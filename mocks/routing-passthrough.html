<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing (passthrough)</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo } = window.Shell

// The other half of the Routing screen: what a surface looks like when
// the router does NOT apply. This used to be hardcoded for
// /v1/responses and /v1/chat/completions in scenario-router.ts, with
// nothing in the UI to say so; it is now a per-surface mode, visible
// and reversible. The mix below is illustrative — no mode is a default.
const SURFACES = [
  { id: 'messages',  label: '/v1/messages',         mode: 'routed',      hint: 'Claude Code' },
  { id: 'chat',      label: '/v1/chat/completions', mode: 'routed',      hint: 'OpenAI SDK' },
  { id: 'responses', label: '/v1/responses',        mode: 'passthrough', hint: 'Codex CLI' },
  { id: 'gemini',    label: '/v1beta/models/*',     mode: 'passthrough', hint: 'Gemini CLI' }
]
const ACTIVE_SURFACE = 'responses'

// Same band 1 as routing.html — see the comment there. A dot carries
// the mode, the client hint rides only the selected tab, and the switch
// that changes the mode sits in the same row.
const surfaceTab = (s) => {
  const on = s.id === ACTIVE_SURFACE
  const href = s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html'
  const dot = s.mode === 'routed'
    ? '<span class="size-1.5 shrink-0 rounded-full bg-emerald-500"></span>'
    : '<span class="size-1.5 shrink-0 rounded-full border border-muted-foreground/50"></span>'
  return `
    <button ${navTo(href)} class="flex items-center gap-2 border-b-2 px-3 py-2.5 transition-colors ${
      on ? 'border-b-foreground' : 'border-b-transparent hover:bg-muted/50'
    }">
      ${dot}
      <span class="whitespace-nowrap font-mono text-xs ${on ? 'text-foreground' : 'text-muted-foreground'}">${s.label}</span>
      ${on ? `<span class="whitespace-nowrap text-[12px] text-muted-foreground/70">${s.hint}</span>` : ''}
    </button>`
}

// In passthrough the only thing that matters is which "provider,model"
// strings a caller may send. Showing the reachable set is the useful
// content here — the chain editor would be misleading.
const REACHABLE = [
  { target: 'codex,gpt-5.5',                  tier: 'opus',   state: 'ready' },
  { target: 'codex,gpt-5.4',                  tier: 'sonnet', state: 'ready' },
  { target: 'openai,gpt-5.5',                 tier: 'opus',   state: 'ready' },
  { target: 'openai,gpt-5.4-mini',            tier: 'haiku',  state: 'ready' },
  { target: 'openai,gpt-5.3-codex',           tier: 'opus',   state: 'ready' }
]

// A reachable target is a "provider,model" a caller may name, so the row
// leads to the provider that has to be configured for it to resolve.
const SUBSCRIPTION_PROVIDERS = ['claude-code', 'codex', 'gemini-cli']
const providerHref = (t) =>
  SUBSCRIPTION_PROVIDERS.includes(t.split(',')[0]) ? 'provider-subscription.html' : 'provider-apikey.html'

const row = (e) => `
  <tr ${navTo(providerHref(e.target))} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-2 font-mono text-xs">${e.target}</td>
    <td class="px-2">${pill(e.tier, 'mute')}</td>
    <td class="px-2">${pill(e.state, 'ok')}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">
      <button class="text-muted-foreground/60 hover:text-foreground"><i class="ri-file-copy-line text-sm"></i></button>
    </td>
  </tr>`

document.getElementById('root').innerHTML = `

  <div class="flex items-center gap-1 border-b border-border pl-4 pr-6">
    ${SURFACES.map(surfaceTab).join('')}
    <div class="ml-auto flex items-center gap-3 pl-4">
      <div class="flex rounded-md border border-border p-0.5">
        <button ${navTo('routing.html')} class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Routed</button>
        <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Passthrough</button>
      </div>
      <button class="text-muted-foreground/60 hover:text-foreground" title="Passthrough sends the caller's provider,model straight upstream: scenario classification, the chain and failover are all skipped. Routed walks the chain for this scenario and fails over on quota.">
        <i class="ri-question-line text-sm"></i>
      </button>
    </div>
  </div>

  <!-- The amber "this was the only behaviour before v3.0.0" notice that
       used to sit here is gone. It said passthrough defaulted to the old
       behaviour "so nothing changes on upgrade", and that stopped being
       true when per-surface defaults were removed: every surface now
       carries an explicit mode and none is more default than another.
       The history also does not earn a block on every visit — what the
       operator needs is what passthrough does, which the header
       explainer and the footer hint already say. -->

  <div class="flex items-center gap-3 border-b border-border px-6 py-2.5">
    <h2 class="text-sm font-semibold">Reachable targets</h2>
    <span class="text-[12px] text-muted-foreground">what a caller may put in <span class="font-mono">body.model</span></span>
    <div class="ml-auto">${btn('Copy as list', 'outline', 'ri-file-copy-line')}</div>
  </div>

  <table class="w-full table-fixed">
    <colgroup><col><col class="w-24"><col class="w-24"><col class="w-16"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-2 text-left font-medium">Target</th>
        <th class="px-2 text-left font-medium">Tier</th>
        <th class="px-2 text-left font-medium">State</th>
        <th class="pl-2 pr-6"></th>
      </tr>
    </thead>
    <tbody>${REACHABLE.map(row).join('')}</tbody>
  </table>

  <div class="px-6 py-5">
    <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
      <i class="ri-lightbulb-line mr-1 align-[-1px]"></i>
      Switch this surface to <span ${navTo('routing.html')} class="font-mono underline underline-offset-2">Routed</span> to give Codex CLI the same
      quota-aware failover Claude Code gets. Callers keep sending their own model string — it
      becomes the <span class="font-mono">requestedModel</span> the classifier reads, rather than
      the final target.
    </div>
  </div>
  <div class="h-8"></div>`

renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Chain']
})
</script>
</body>
</html>
