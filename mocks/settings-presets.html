<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Presets</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, tabs, navTo } = window.Shell

// Absorbs Presets + its six dialogs (Install / Market / Detail / Delete /
// DynamicConfigForm / PresetListItem). The install form was a dialog inside
// a dialog; here the required inputs render inline in the detail pane.
const INSTALLED = [
  { id: 'openai-prod',  name: 'OpenAI production', version: '1.2.0', author: 'tkgstrator', providers: 2, models: 7, active: true },
  { id: 'gemini-free',  name: 'Gemini free tier',  version: '0.4.1', author: 'community',  providers: 1, models: 4, active: false },
  { id: 'local-only',   name: 'Local only',        version: '1.0.0', author: 'tkgstrator', providers: 1, models: 2, active: false }
]

const presetRow = (p) => `
  <button class="block w-full border-l-2 px-4 py-3 text-left transition-colors ${
    p.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  }">
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium">${p.name}</span>
      <span class="ml-auto font-mono text-[12px] text-muted-foreground">v${p.version}</span>
    </div>
    <div class="mt-0.5 text-[12px] text-muted-foreground">
      ${p.author} · ${p.providers} providers · ${p.models} models
    </div>
  </button>`

const input = (label, hint, value, secret) => `
  <div class="grid grid-cols-[12rem_1fr] items-start gap-4 border-t border-border/60 px-6 py-3">
    <div>
      <div class="flex items-center gap-1.5 text-xs font-medium">${label}<span class="text-destructive">*</span></div>
      <div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">${hint}</div>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex h-8 max-w-md flex-1 items-center rounded-md border border-border px-3 font-mono text-xs ${
        value ? '' : 'text-muted-foreground/50'
      }">${value || 'required'}</div>
      ${secret ? '<i class="ri-lock-line text-sm text-muted-foreground"></i>' : ''}
    </div>
  </div>`

document.getElementById('root').innerHTML = `
  <div class="grid h-full grid-cols-[17rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-1 border-b border-border px-3">
        ${tabs([
          { id: 'installed', label: 'Installed', count: '3' },
          { id: 'market', label: 'Browse' }
        ], 'installed')}
      </div>
      ${INSTALLED.map(presetRow).join('')}
      <div class="space-y-2 p-4">
        ${btn('Install from file', 'outline', 'ri-upload-line')}
        ${btn('Export current', 'ghost', 'ri-download-line')}
      </div>
      <div class="border-t border-border px-4 py-4">
        <p class="text-[12px] leading-relaxed text-muted-foreground">
          A preset is a snapshot of providers, models and routing with secrets stripped —
          the shareable half of a configuration.
        </p>
      </div>
    </aside>

    <div class="min-w-0 overflow-y-auto">
      <div class="flex items-center gap-3 border-b border-border px-6 py-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold">OpenAI production</h2>
            ${pill('v1.2.0', 'mute')}
            ${pill('installed', 'ok')}
          </div>
          <p class="mt-0.5 text-[12px] text-muted-foreground">
            by tkgstrator · updated 2026-07-14 · <span class="font-mono">openai</span> <span class="font-mono">production</span>
          </p>
        </div>
        <div class="ml-auto flex gap-2">
          ${btn('View in Routing', 'ghost', 'ri-git-branch-line', 'routing.html')}
          ${btn('Re-apply', 'outline', 'ri-refresh-line')}
          ${btn('Delete', 'ghost', 'ri-delete-bin-line')}
        </div>
      </div>

      <div class="px-6 py-4">
        <p class="text-xs leading-relaxed text-muted-foreground">
          Production routing for an OpenAI-first setup: gpt-5.5 as the default agent with a
          gpt-5.4-mini background lane, plus an Anthropic fallback for long context.
        </p>
      </div>

      <div class="flex items-center gap-2 border-t border-border px-6 pt-5 pb-2">
        <h3 class="text-sm font-semibold">Required inputs</h3>
        ${pill('1 missing', 'warn')}
      </div>
      ${input('OpenAI API key', 'Stored on this machine only. Never written into the preset.', 'sk-proj-••••7fA2', true)}
      ${input('Anthropic API key', 'Used by the longContext fallback.', '', true)}

      <div class="flex items-center gap-2 border-t border-border px-6 pt-5 pb-2">
        <h3 class="text-sm font-semibold">What it changes</h3>
        <span class="text-[12px] text-muted-foreground">diff against your current config</span>
      </div>
      <div class="space-y-1 px-6 pb-5 font-mono text-[12px]">
        <!-- Every line of the diff names something with a screen of its
             own; following one is how you check what a preset would
             overwrite before you apply it. -->
        <div ${navTo('providers-apikey.html')} class="flex gap-2"><span class="w-4 text-emerald-600 dark:text-emerald-400">+</span><span>provider <span class="font-medium">openai</span></span></div>
        <div ${navTo('providers-apikey.html')} class="flex gap-2"><span class="w-4 text-emerald-600 dark:text-emerald-400">+</span><span>provider <span class="font-medium">anthropic</span></span></div>
        <div ${navTo('routing.html')} class="flex gap-2"><span class="w-4 text-amber-600 dark:text-amber-400">~</span><span>Router.default.agent <span class="text-muted-foreground">claude-code,claude-opus-4-8</span> → <span>openai,gpt-5.5</span></span></div>
        <div ${navTo('routing.html')} class="flex gap-2"><span class="w-4 text-amber-600 dark:text-amber-400">~</span><span>Router.longContext.agent <span class="text-muted-foreground">(unset)</span> → <span>anthropic,claude-sonnet-4-6</span></span></div>
        <div class="flex gap-2"><span class="w-4 text-muted-foreground/50">=</span><span class="text-muted-foreground">3 subscription providers untouched</span></div>
      </div>

      <div class="px-6 pb-6">
        <div class="rounded-md border border-amber-500/30 bg-amber-500/5 px-4 py-3">
          <div class="flex items-center gap-2">
            <i class="ri-alert-line text-sm text-amber-600 dark:text-amber-400"></i>
            <span class="text-xs font-medium">Applying replaces your default route</span>
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            Your current routing is snapshotted first, so <span class="font-mono">Revert</span> is
            one click. Subscription providers and their accounts are never touched by a preset.
          </p>
        </div>
      </div>
      <div class="h-6"></div>
    </div>

  </div>`

renderShell({
  active: 'settings',
  navMode: 'cloudflare',
  sub: 'presets',
  crumbs: ['Presets'],
  subtitle: '3 installed · OpenAI production selected',
  actions: btn('Revert last apply', 'ghost', 'ri-arrow-go-back-line') + btn('Apply', 'primary', 'ri-check-line')
})
</script>
</body>
</html>
