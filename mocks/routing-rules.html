<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing rules</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo, selectorBar, SURFACES, surfaceChip } = window.Shell

// Replaces routing-map/RuleEditor.tsx (492 lines, the largest routing
// component). Rules are ordered and first-match-wins, so the list is the
// primary object and the editor is a right pane — not a modal that hides
// the ordering you are reasoning about.

const RULES = [
  {
    n: 1, name: 'Haiku passthrough', enabled: true, active: true, hits: '1.2k',
    when: [{ field: 'requestedModel', op: 'matches', value: '*haiku*' }],
    then: 'claude-code,claude-haiku-4-5'
  },
  {
    n: 2, name: 'Long context', enabled: true, active: false, hits: '318',
    when: [{ field: 'tokens', op: '>', value: '60,000' }],
    then: 'longContext chain'
  },
  {
    n: 3, name: 'Subagent lane', enabled: true, active: false, hits: '4.1k',
    when: [{ field: 'tag', op: 'present', value: '<RIALTO-SUBAGENT-MODEL>' }],
    then: 'subagent lane'
  },
  {
    n: 4, name: 'CI cost cap', enabled: false, active: false, hits: '0',
    when: [{ field: 'token.name', op: '=', value: 'CI — nightly evals' }],
    then: 'cost-first profile'
  }
]

const ruleRow = (r) => `
  <button class="block w-full border-l-2 px-4 py-3 text-left transition-colors ${
    r.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  } ${r.enabled ? '' : 'opacity-45'}">
    <div class="flex items-center gap-2">
      <span class="font-mono text-[12px] tabular-nums text-muted-foreground">${r.n}</span>
      <span class="text-xs font-medium">${r.name}</span>
      ${r.enabled ? '' : pill('off', 'mute')}
      <span class="ml-auto font-mono text-[12px] tabular-nums text-muted-foreground">${r.hits}</span>
    </div>
    <div class="mt-1 truncate font-mono text-[12px] text-muted-foreground">
      ${r.when[0].field} ${r.when[0].op} ${r.when[0].value}
    </div>
  </button>`

const FIELDS = ['requestedModel', 'tokens', 'tag', 'token.name', 'endpoint', 'scenario', 'effort', 'hasImage']

const condition = (field, op, value, removable) => `
  <div class="flex items-center gap-2">
    <button class="inline-flex h-8 min-w-44 items-center gap-2 rounded-md border border-border px-3 text-xs transition-colors hover:bg-muted/60">
      <span class="font-mono">${field}</span>
      <i class="ri-arrow-down-s-line ml-auto text-sm text-muted-foreground"></i>
    </button>
    <button class="inline-flex h-8 min-w-28 items-center gap-2 rounded-md border border-border px-3 text-xs transition-colors hover:bg-muted/60">
      <span class="font-mono">${op}</span>
      <i class="ri-arrow-down-s-line ml-auto text-sm text-muted-foreground"></i>
    </button>
    <div class="flex h-8 flex-1 items-center rounded-md border border-border px-3 font-mono text-xs">${value}</div>
    ${
      removable
        ? '<button class="text-muted-foreground/60 hover:text-destructive"><i class="ri-close-line text-sm"></i></button>'
        : '<span class="w-4"></span>'
    }
  </div>`

document.getElementById('root').innerHTML = `
  ${selectorBar('chain')}


  <div class="grid h-full grid-cols-[20rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-2 px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Rules</h2>
        <span class="text-[12px] text-muted-foreground">first match wins</span>
      </div>
      ${RULES.map(ruleRow).join('')}
      <div class="p-4">${btn('Add rule', 'outline', 'ri-add-line')}</div>

      <div class="border-t border-border px-4 py-4">
        <p class="text-[12px] leading-relaxed text-muted-foreground">
          Evaluated top to bottom against the request, before the preference chain.
          A rule that matches replaces the target outright; the chain still supplies failover.
        </p>
      </div>
    </aside>

    <div class="min-w-0 overflow-y-auto">
      <div class="flex items-center gap-3 border-b border-border px-6 py-3">
        <div class="flex h-8 max-w-xs flex-1 items-center rounded-md border border-border px-3 text-xs font-medium">Haiku passthrough</div>
        ${pill('1.2k matches / 7d', 'info')}
        <div class="ml-auto flex items-center gap-2">
          <span class="inline-flex h-4 w-7 items-center rounded-full bg-foreground px-0.5">
            <span class="size-3 translate-x-3 rounded-full bg-background"></span>
          </span>
          ${btn('Duplicate', 'ghost', 'ri-file-copy-line')}
          ${btn('Delete', 'ghost', 'ri-delete-bin-line')}
        </div>
      </div>

      <div class="px-6 pt-5 pb-2">
        <h3 class="text-sm font-semibold">When</h3>
      </div>
      <div class="space-y-2 px-6">
        ${condition('requestedModel', 'matches', '*haiku*', true)}
        <button class="flex items-center gap-2 rounded-md border border-dashed border-border px-3 py-1.5 text-[12px] text-muted-foreground transition-colors hover:bg-muted/50">
          <i class="ri-add-line"></i> Add condition <span class="opacity-60">(all must match)</span>
        </button>
      </div>

      <div class="px-6 pt-6 pb-2">
        <h3 class="text-sm font-semibold">Then</h3>
      </div>
      <div class="space-y-2 px-6">
        <div class="flex items-center gap-2">
          <button class="inline-flex h-8 min-w-44 items-center gap-2 rounded-md border border-border px-3 text-xs transition-colors hover:bg-muted/60">
            <span>Route to model</span>
            <i class="ri-arrow-down-s-line ml-auto text-sm text-muted-foreground"></i>
          </button>
          <button ${navTo('providers.html')} class="inline-flex h-8 flex-1 items-center gap-2 rounded-md border border-border px-3 text-xs transition-colors hover:bg-muted/60">
            <span class="font-mono">claude-code,claude-haiku-4-5</span>
            <i class="ri-arrow-down-s-line ml-auto text-sm text-muted-foreground"></i>
          </button>
        </div>
      </div>

      <div class="px-6 pt-6 pb-2">
        <h3 class="text-sm font-semibold">Applies to</h3>
      </div>
      <div class="flex flex-wrap gap-2 px-6">
        ${SURFACES.map((s, i) => surfaceChip(s.path, i < 2)).join('')}
        <span class="self-center text-[12px] text-muted-foreground">only endpoints in routed mode can match</span>
      </div>

      <!-- The tester is the payoff of moving rules into their own view:
           first-match-wins ordering is impossible to reason about without
           trying a request against it. -->
      <div class="mt-6 border-t border-border px-6 py-5">
        <h3 class="text-sm font-semibold">Test</h3>
        <div class="mt-3 flex items-center gap-2">
          <div class="flex h-8 flex-1 items-center rounded-md border border-border px-3 font-mono text-xs text-muted-foreground">
            {"model": "claude-haiku-4-5", "messages": [...]}
          </div>
          ${btn('Run', 'primary', 'ri-play-line')}
        </div>
        <div class="mt-3 rounded-md border border-border px-4 py-3">
          <div class="flex items-center gap-2">
            ${pill('rule 1 matched', 'ok')}
            <span class="text-[12px] text-muted-foreground">Haiku passthrough</span>
          </div>
          <div class="mt-2 flex items-center gap-1.5 font-mono text-[12px]">
            <span class="text-muted-foreground">claude-haiku-4-5</span>
            <i class="ri-arrow-right-line text-xs text-muted-foreground/50"></i>
            <span>claude-code,claude-haiku-4-5</span>
          </div>
          <div class="mt-1 text-[12px] text-muted-foreground">rules 2–4 not evaluated (first match wins)</div>
        </div>
      </div>
      <div class="h-8"></div>
    </div>

  </div>`

renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Rules'],
  subtitle: '4 rules · 3 enabled · evaluated before the chain',
  actions: btn('Discard', 'ghost', '') + btn('Save', 'primary', 'ri-check-line')
})
</script>
</body>
</html>
