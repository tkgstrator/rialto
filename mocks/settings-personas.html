<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Personas</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, SURFACES, surfaceChip } = window.Shell

// Absorbs Personas + PersonaView + PersonaEdit — three routes for one
// object. List on the left, editor on the right, no navigation between
// "view" and "edit" states.
const PERSONAS = [
  { id: 'yachiyo',  name: 'Yachiyo',   words: '1,240', applied: 'all endpoints', active: true,  on: true },
  { id: 'terse',    name: 'Terse',     words: '86',    applied: '/v1/chat/completions, /v1/responses', active: false, on: true },
  { id: 'reviewer', name: 'Reviewer',  words: '640',   applied: 'subagent lane', active: false, on: true },
  { id: 'draft',    name: 'Draft',     words: '312',   applied: '—', active: false, on: false }
]

const personaRow = (p) => `
  <button class="block w-full border-l-2 px-4 py-3 text-left transition-colors ${
    p.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  } ${p.on ? '' : 'opacity-45'}">
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium">${p.name}</span>
      ${p.on ? '' : pill('off', 'mute')}
      <span class="ml-auto font-mono text-[12px] tabular-nums text-muted-foreground">${p.words}w</span>
    </div>
    <div class="mt-0.5 text-[12px] text-muted-foreground">${p.applied}</div>
  </button>`

const PROMPT = `You are Yachiyo, the operator's pair for this repository.

Voice
- Direct. State the finding, then the evidence, then what you would do.
- No preamble, no "Great question!", no restating the request.

Working rules
- Read before you claim. If a file decides the answer, open it.
- When two readings of a request differ materially, ask once — otherwise
  pick the reading a careful colleague would and say which you picked.
- Report what actually happened, including the parts that failed.

Repository
- Comments in code are English. Prose to the operator is Japanese.
- Never edit src/components/ui/* — shadcn owns those files.`

document.getElementById('root').innerHTML = `
  <div class="grid h-full grid-cols-[17rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-2 px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Personas</h2>
        <span class="ml-auto font-mono text-[12px] text-muted-foreground">4</span>
      </div>
      ${PERSONAS.map(personaRow).join('')}
      <div class="p-4">${btn('New persona', 'outline', 'ri-add-line')}</div>
      <div class="border-t border-border px-4 py-4">
        <p class="text-[12px] leading-relaxed text-muted-foreground">
          A persona is prepended to the system prompt of every request on the surfaces it applies to.
          It costs input tokens on each turn — cached after the first, so keep it stable.
        </p>
      </div>
    </aside>

    <div class="min-w-0 overflow-y-auto">
      <div class="flex items-center gap-3 border-b border-border px-6 py-3">
        <div class="flex h-8 max-w-xs flex-1 items-center rounded-md border border-border px-3 text-xs font-medium">Yachiyo</div>
        ${pill('1,240 words ≈ 1.6k tokens', 'info')}
        <div class="ml-auto flex items-center gap-2">
          <span class="inline-flex h-4 w-7 items-center rounded-full bg-foreground px-0.5">
            <span class="size-3 translate-x-3 rounded-full bg-background"></span>
          </span>
          ${btn('Duplicate', 'ghost', 'ri-file-copy-line')}
          ${btn('Delete', 'ghost', 'ri-delete-bin-line')}
        </div>
      </div>

      <div class="flex items-center gap-2 border-b border-border px-6 py-2.5">
        <span class="text-[12px] text-muted-foreground">Applies to</span>
        ${SURFACES.map((s, i) => surfaceChip(s.path, i === 0)).join('')}
        <span class="mx-1 h-4 w-px bg-border"></span>
        <span class="text-[12px] text-muted-foreground">Lane</span>
        <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-[12px] hover:bg-muted/60">
          both <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
        </button>
      </div>

      <div class="grid grid-cols-2">
        <div class="border-r border-border">
          <div class="flex items-center gap-2 px-6 pt-4 pb-2">
            <h3 class="text-sm font-semibold">Prompt</h3>
            <span class="ml-auto text-[12px] text-muted-foreground">Markdown</span>
          </div>
          <pre class="px-6 pb-6 font-mono text-[12px] leading-relaxed whitespace-pre-wrap">${PROMPT}</pre>
        </div>
        <div>
          <div class="flex items-center gap-2 px-6 pt-4 pb-2">
            <h3 class="text-sm font-semibold">Preview</h3>
            <span class="ml-auto text-[12px] text-muted-foreground">as sent</span>
          </div>
          <div class="px-6 pb-6">
            <div class="rounded-md border border-border">
              <div class="border-b border-border px-3 py-1.5">
                <span class="font-mono text-[12px] uppercase tracking-wider text-muted-foreground">system</span>
              </div>
              <div class="space-y-2 px-3 py-2.5 text-[12px] leading-relaxed">
                <div class="rounded bg-muted/60 px-2 py-1.5">
                  <span class="font-mono text-[12px] text-muted-foreground">persona: yachiyo</span>
                  <p class="mt-1">You are Yachiyo, the operator's pair for this repository. Voice — direct…</p>
                </div>
                <div class="rounded border border-dashed border-border px-2 py-1.5 text-muted-foreground">
                  <span class="font-mono text-[12px]">client system prompt</span>
                  <p class="mt-1">…whatever Claude Code sends, appended unchanged.</p>
                </div>
              </div>
            </div>
            <p class="mt-3 text-[12px] leading-relaxed text-muted-foreground">
              The persona goes first so the client's own prompt can still override it. Both blocks
              are marked cacheable, so the cost is paid once per session.
            </p>
          </div>
        </div>
      </div>
      <div class="h-6"></div>
    </div>

  </div>`

renderShell({
  active: 'settings',
  navMode: 'cloudflare',
  sub: 'personas',
  crumbs: ['Personas'],
  subtitle: '4 personas · 3 enabled',
  actions: btn('Discard', 'ghost', '') + btn('Save', 'primary', 'ri-check-line')
})
</script>
</body>
</html>
