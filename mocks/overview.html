<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Overview</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, section, pill, mono, meter, btn, surfacePill, navTo } = window.Shell

// ─── Inbound surfaces: the headline of the new IA ─────────────────────
// Rialto's identity is "four wire formats in, many vendors out", so the
// first thing the operator sees is the four surfaces and whether the
// router is actually applied to each. Under the old build only
// /v1/messages was routed and nothing in the UI said so.
const SURFACES = [
  { path: '/v1/messages',         client: 'Claude Code',   mode: 'routed',      reqs: '12.4k', p50: '1.9s', err: '0.2%' },
  { path: '/v1/chat/completions', client: 'OpenAI SDK',    mode: 'routed',      reqs: '3.1k',  p50: '1.2s', err: '0.4%' },
  { path: '/v1/responses',        client: 'Codex CLI',     mode: 'passthrough', reqs: '2.7k',  p50: '2.4s', err: '0.1%' },
  { path: '/v1beta/models/*',     client: 'Gemini CLI',    mode: 'passthrough', reqs: '486',   p50: '1.1s', err: '1.9%' }
]

// Overview is the landing screen, so every row here is a question whose
// answer lives somewhere else: a surface leads to its Routing screen, a
// quota window to Usage, a failover entry to the requests or the provider
// that caused it, a session to its trace.
const surfaceRow = (s) => `
  <tr ${navTo(s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html')} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-3">
      <div class="font-mono text-xs">${s.path}</div>
      <div class="text-[12px] text-muted-foreground">${s.client}</div>
    </td>
    <td class="px-3">${s.mode === 'routed' ? pill('routed', 'ok') : pill('passthrough', 'mute')}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.reqs}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums text-muted-foreground">${s.p50}</td>
    <td class="py-2.5 pl-3 pr-6 text-right font-mono text-xs tabular-nums text-muted-foreground">${s.err}</td>
  </tr>`

const surfaces = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-32"><col class="w-28"><col class="w-20"><col class="w-24"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-3 text-left font-medium">Surface</th>
        <th class="px-3 text-left font-medium">Routing</th>
        <th class="px-3 text-right font-medium">Requests</th>
        <th class="px-3 text-right font-medium">p50</th>
        <th class="pl-3 pr-6 text-right font-medium">Errors</th>
      </tr>
    </thead>
    <tbody>${SURFACES.map(surfaceRow).join('')}</tbody>
  </table>`

// ─── Subscription quota ───────────────────────────────────────────────
//
// An account has SEVERAL limits, not one, and they are not
// interchangeable: Claude runs a 5h rolling window, a 7d window, and a
// per-model weekly window for each model it scopes (`scopedWindows` on
// SubAccountQuota). Any one of them hitting 100% stops the account, so a
// row per (account, window) with the account name repeated down the
// column both buried the relationship and read as four unrelated
// accounts.
//
// Grouped by account, and the windows sorted worst-first inside it: with
// five limits on one subscription, the only one that matters right now is
// the tightest, and it should not have to be found by scanning. The
// account line carries that number so the section can be read without
// opening anything.
const QUOTA = [
  {
    account: 'Claude Max',
    windows: [
      { window: '7d · Opus', pct: 88, resets: '3d 04h' },
      { window: '7d', pct: 71, resets: '3d 04h' },
      { window: '7d · Sonnet', pct: 44, resets: '3d 04h' },
      { window: '5h', pct: 34, resets: '2h 11m' }
    ]
  },
  {
    account: 'Codex Pro',
    windows: [
      { window: 'primary', pct: 88, resets: '46m' },
      { window: 'secondary', pct: 65, resets: '4d 02h' }
    ]
  },
  { account: 'Gemini AI Pro', windows: [{ window: 'daily', pct: 12, resets: '9h 22m' }] }
]

const windowLine = (w, worst) => `
  <div class="flex items-baseline gap-3 pt-2 first:pt-0">
    <span class="w-28 shrink-0 font-mono text-[12px] ${worst ? 'text-foreground' : 'text-muted-foreground'}">${w.window}</span>
    <div class="min-w-0 flex-1">${meter(w.pct)}</div>
    <span class="w-10 shrink-0 text-right font-mono text-[12px] tabular-nums ${worst ? 'font-medium' : 'text-muted-foreground'}">${w.pct}%</span>
    <span class="w-20 shrink-0 text-right text-[12px] text-muted-foreground">${w.resets}</span>
  </div>`

const quotaRow = (q) => `
  <div ${navTo('activity-usage.html')} class="border-t border-border/60 px-6 py-3 transition-colors hover:bg-muted/50">
    <div class="flex items-baseline gap-2">
      <span class="text-xs font-medium">${q.account}</span>
      <span class="text-[12px] text-muted-foreground/70">${q.windows.length} limit${q.windows.length === 1 ? '' : 's'}</span>
      <span class="ml-auto font-mono text-xs tabular-nums">${q.windows[0].pct}%</span>
    </div>
    <div class="mt-2">${q.windows.map((w, i) => windowLine(w, i === 0)).join('')}</div>
  </div>`

// ─── Spend ────────────────────────────────────────────────────────────
// Money is always 3 significant figures — same rule the React side uses
// via fmtCost(). Never re-derive a formatter in a component.
const SPEND = [
  { label: 'Today',      value: '$4.82',  delta: '+12%', tone: 'warn' },
  { label: 'This week',  value: '$31.7',  delta: '-6%',  tone: 'ok' },
  { label: 'This month', value: '$118',   delta: '+3%',  tone: 'mute' },
  { label: 'Saved by subscription', value: '$806', delta: '', tone: 'ok' }
]

const spendTile = (s) => `
  <div ${navTo('activity-usage.html')} class="border-l-2 border-l-border px-4 py-3 transition-colors hover:bg-muted/50 hover:border-l-foreground/30">
    <div class="text-[12px] uppercase tracking-wider text-muted-foreground">${s.label}</div>
    <div class="mt-1 flex items-baseline gap-2">
      <span class="font-mono text-xl tabular-nums">${s.value}</span>
      ${s.delta ? pill(s.delta, s.tone) : ''}
    </div>
  </div>`

// ─── Recent sessions ──────────────────────────────────────────────────
const SESSIONS = [
  { id: 'ses_9fa2…c41', surface: '/v1/messages',  model: 'claude-opus-4-8',   turns: 42, tokens: '318k', cost: '$1.24', ago: '2m' },
  { id: 'ses_71bd…08e', surface: '/v1/responses', model: 'gpt-5.5',           turns: 17, tokens: '96.2k', cost: '$0.412', ago: '19m' },
  { id: 'ses_04c7…9aa', surface: '/v1/chat/completions',      model: 'gemini-3.1-pro',    turns: 8,  tokens: '41.7k', cost: '$0.0930', ago: '1h' },
  { id: 'ses_ba51…2f0', surface: '/v1/messages',  model: 'claude-sonnet-4-6', turns: 91, tokens: '702k', cost: '$2.06', ago: '3h' }
]

const sessionRow = (s) => `
  <tr ${navTo('activity-session.html')} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-3 font-mono text-xs">${s.id}</td>
    <td class="px-3">${surfacePill(s.surface)}</td>
    <td class="px-3 font-mono text-xs text-muted-foreground">${s.model}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.turns}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.tokens}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.cost}</td>
    <td class="py-2.5 pl-3 pr-6 text-right text-[12px] text-muted-foreground">${s.ago}</td>
  </tr>`

const sessions = `
  <table class="w-full table-fixed">
    <colgroup><col class="w-40"><col class="w-40"><col><col class="w-16"><col class="w-20"><col class="w-24"><col class="w-16"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-3 text-left font-medium">Session</th>
        <th class="px-3 text-left font-medium">Endpoint</th>
        <th class="px-3 text-left font-medium">Model</th>
        <th class="px-3 text-right font-medium">Turns</th>
        <th class="px-3 text-right font-medium">Tokens</th>
        <th class="px-3 text-right font-medium">Cost</th>
        <th class="pl-3 pr-6 text-right font-medium">Last</th>
      </tr>
    </thead>
    <tbody>${SESSIONS.map(sessionRow).join('')}</tbody>
  </table>`

document.getElementById('root').innerHTML = `
  ${section('Inbound surfaces', surfaces, 'last 24h')}
  ${section('Spend', `<div class="grid grid-cols-4 gap-px px-6 pb-6">${SPEND.map(spendTile).join('')}</div>`)}
  <div class="grid grid-cols-2 border-t border-border">
    <div class="border-r border-border">
      ${section('Subscription quota', QUOTA.map(quotaRow).join(''), 'tightest window first')}
    </div>
    <div>
      ${section('Failover activity', `
        <div class="space-y-0">
          <div ${navTo('activity-requests.html')} class="border-t border-border/60 px-6 py-3 transition-colors hover:bg-muted/50">
            <div class="flex items-baseline gap-2">
              ${pill('429', 'bad')}
              <span class="text-xs">Codex Pro exhausted on <span class="font-mono">primary</span></span>
              <span class="ml-auto text-[12px] text-muted-foreground">46m ago</span>
            </div>
            <div class="mt-1 text-[12px] text-muted-foreground">fell through to <span class="font-mono">openai,gpt-5.5</span></div>
          </div>
          <div ${navTo('routing.html')} class="border-t border-border/60 px-6 py-3 transition-colors hover:bg-muted/50">
            <div class="flex items-baseline gap-2">
              ${pill('weight', 'warn')}
              <span class="text-xs"><span class="font-mono">claude-code,claude-opus-4-8</span> 1.00 → 0.60</span>
              <span class="ml-auto text-[12px] text-muted-foreground">1h ago</span>
            </div>
            <div class="mt-1 text-[12px] text-muted-foreground">reason: <span class="font-mono">quota_drop</span></div>
          </div>
          <div ${navTo('providers.html')} class="border-t border-border/60 px-6 py-3 transition-colors hover:bg-muted/50">
            <div class="flex items-baseline gap-2">
              ${pill('auth', 'bad')}
              <span class="text-xs">Gemini AI Pro needs re-authentication</span>
              <span class="ml-auto text-[12px] text-muted-foreground">5h ago</span>
            </div>
            <div class="mt-1 text-[12px] text-muted-foreground">refresh token rejected by Code Assist</div>
          </div>
        </div>`)}
    </div>
  </div>
  ${section('Recent sessions', sessions)}
  <div class="h-10"></div>`

renderShell({
  active: 'overview',
  navMode: 'cloudflare',
  crumbs: [],
  subtitle: '4 inbound surfaces · 7 providers · 23 models enabled',
  actions: btn('Last 24h', 'outline', 'ri-time-line') + btn('Refresh', 'ghost', 'ri-refresh-line')
})
</script>
</body>
</html>
