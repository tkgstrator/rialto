<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Access token</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo, SURFACES, surfaceChip, meter, dialog, PLANS } = window.Shell

// One token's own page.
//
// It exists so the destructive actions have somewhere to be that is not a
// row in a table of live credentials. Revoke used to be a button in every
// row; the cost of aiming one click badly there is a CLI that stops
// working with a 401 nobody can trace from the client end. Reaching a
// token's page first makes it deliberate, and puts the figures that
// inform the decision — what this token has been doing, when it was last
// seen — next to the button that acts on it.
//
// Rotate is the ordinary answer to a leak: a new secret on the SAME row,
// keeping the id, the name, the scope and every request already
// attributed to it. Re-issuing splits one client's history across two
// rows and leaves the operator to remember they were the same machine.

/** One labelled row. Same 14rem label column the Settings forms use. */
const field = (label, hint, body) => `
  <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
    <div>
      <div class="text-xs font-medium">${label}</div>
      <div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">${hint}</div>
    </div>
    <div>${body}</div>
  </div>`

const select = (value) => `
  <div class="relative inline-flex w-full max-w-md">
    <div class="flex h-8 w-full items-center rounded-md border border-border pl-3 pr-8 font-mono text-xs">${value}</div>
    <i class="ri-arrow-down-s-line pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground"></i>
  </div>`

const params = new URLSearchParams(location.search)
const noPlan = params.has('no-plan')
const unlimited = params.has('unlimited')
const partial = params.has('partial')
const notStarted = params.has('not-started')
const spent = params.has('spent')
const weekSpent = params.has('week-spent')
const plan = PLANS[unlimited ? 3 : partial ? 1 : 0]
const returnHref = `access-token.html${spent ? '?spent' : weekSpent ? '?week-spent' : partial ? '?partial' : ''}`
const resetHref = `${returnHref}${returnHref.includes('?') ? '&' : '?'}reset`
const limitMeter = (label, used, limit, usd = false) => {
  const format = value => usd ? `$${value.toFixed(2)}` : value.toLocaleString('en-US')
  return `<div class="mt-2 flex items-center gap-3">
    <span class="w-20 shrink-0 text-[12px] text-muted-foreground">${label}</span>
    <div class="min-w-0 flex-1">${limit === null ? '<span class="text-[12px] text-muted-foreground">No limit</span>' : meter(Math.min(100, used / limit * 100))}</div>
    <span class="w-40 shrink-0 text-right font-mono text-xs tabular-nums">${format(used)}${limit === null ? ' used' : ` / ${format(limit)}`}</span>
  </div>`
}
const usageWindow = (name, index, resets) => {
  const limits = plan.windows[index]
  const requests = notStarted ? 0 : index === 0 ? spent ? 100 : 42 : 286
  const spend = notStarted ? 0 : index === 0 ? spent ? 1.84 : 0.84 : weekSpent ? 10 : 5.72
  const exhausted = (index === 0 && spent) || (index === 1 && weekSpent)
  return `<div class="border-t border-border/60 py-3 first:border-t-0 first:pt-0">
    <div class="flex items-center gap-2 text-xs">
      <span class="font-medium">${name}</span>${exhausted ? pill('spent', 'bad') : ''}
      <span class="ml-auto text-[12px] text-muted-foreground">${notStarted ? 'Not started' : `Resets ${resets}`}</span>
    </div>
    ${limitMeter('Requests', requests, limits.requests)}
    ${limitMeter('Spend (USD)', spend, limits.usd, true)}
  </div>`
}
const usageWindows = noPlan || unlimited
  ? `<div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
      <span class="font-medium text-foreground">No plan usage limits.</span>
      ${noPlan ? 'Assign a plan to apply per-token usage windows and model rules.' : 'Max has no request or spend limits in either window. Its allowed models and default model still apply.'}
      Historical usage is shown below.
    </div>`
  : `<div class="max-w-2xl">
      ${spent || weekSpent ? `<div class="mb-3 rounded-md border border-destructive/20 bg-destructive/5 px-3 py-2 text-[12px] text-destructive">
        Requests refused (429) until ${weekSpent ? 'Oct 3, 09:00 JST' : 'Sep 29, 18:00 JST'}.
        ${weekSpent ? '7-day spend limit reached.' : '5-hour request limit reached.'} Every spent window must reset before requests resume.
      </div>` : ''}
      ${usageWindow('5-hour window', 0, 'in 2h 41m · Sep 29, 18:00 JST')}
      ${usageWindow('7-day window', 1, 'in 3d 17h 41m · Oct 3, 09:00 JST')}
      <div class="flex items-center gap-3 border-t border-border/60 pt-3">
        <span class="text-[12px] leading-snug text-muted-foreground">${notStarted ? 'The next counted request starts each window.' : 'Each window starts at the first counted request; it resets 5 hours or 7 days later, not on a sliding schedule.'}</span>
        <span class="ml-auto shrink-0">${notStarted ? '<span class="text-[12px] text-muted-foreground">Nothing to reset</span>' : btn('Reset usage', 'outline', 'ri-restart-line', resetHref)}</span>
      </div>
    </div>`
const resetDialog = () => dialog('Reset usage for MacBook — Codex?',
  `<div class="space-y-3 text-xs leading-relaxed text-muted-foreground">
    <p>Clears this token’s request counts and spend in both the 5-hour and 7-day windows. The next counted request starts fresh windows.</p>
    <p class="font-medium text-foreground">This removes any current plan usage block immediately. It cannot be undone.</p>
    <p>Other tokens, plan limits, token credentials and historical usage stay unchanged. Provider subscription quotas are not reset.</p>
  </div>`,
  `${btn('Cancel', 'ghost', '', returnHref)}${btn('Reset usage', 'danger', 'ri-restart-line', `access-token.html?not-started${partial ? '&partial' : ''}`)}`)

document.getElementById('root').innerHTML = `
  <div class="min-w-0">

    <!-- Identity and the two actions that change what this token can do.
         Rotate first and Revoke second: rotating answers almost every
         reason for being on this page, and revoking is the one that takes
         a client offline. On an expired token Rotate is absent rather than
         disabled — a new secret on an expired row would not authenticate,
         so there is no state in which the control could become live.
         Revoke deletes the token; this page has nothing left to show after. -->
    <div class="flex items-center gap-3 px-6 pt-6 pb-3">
      <span ${navTo('access-tokens.html')} class="text-muted-foreground hover:text-foreground">
        <i class="ri-arrow-left-line text-base"></i>
      </span>
      <div class="min-w-0">
        <div class="truncate text-sm font-semibold">MacBook — Codex</div>
        <div class="font-mono text-[12px] text-muted-foreground">rlt_7c02…</div>
      </div>
      ${pill('active', 'ok')}${spent || weekSpent ? pill('usage blocked', 'bad') : ''}
      <div class="ml-auto flex items-center gap-2">
        ${btn('Rotate', 'outline', 'ri-refresh-line')}
        ${btn('Revoke', 'danger', 'ri-forbid-line')}
      </div>
    </div>

    <!-- Scope and profile are editable here, because neither is an
         issue-time-only decision: a client picks up a second endpoint, or
         its traffic should start following a different chain, and neither
         is a reason to hand the machine a new secret. -->
    ${field(
      'Endpoint',
      'Pick the endpoints this token may call. Choose several when one client speaks more than one — Codex uses both <span class="font-mono">/v1/responses</span> and <span class="font-mono">/v1/chat/completions</span>. All endpoints leaves it unrestricted.',
      `<div class="flex flex-wrap gap-2">
        ${surfaceChip('all endpoints', false)}
        ${SURFACES.map((s, i) => surfaceChip(s.path, i === 1 || i === 2)).join('')}
      </div>`
    )}

    ${field(
      'Profile',
      'Route this client’s traffic through a named profile. Unset follows the endpoint’s own routing.',
      select('live')
    )}

    ${field(
      'Plan',
      'Apply the plan’s allowed models, default model and per-token usage limits. None applies no plan restrictions.',
      select(noPlan ? 'None' : plan.name)
    )}

    ${field(
      'Usage windows',
      'Current plan usage, separate from historical totals. Reaching either request or spend limit blocks requests until that window resets. Times shown in JST (UTC+09:00).',
      usageWindows
    )}

    ${field(
      'Usage',
      'Requests served, spend and tokens over the last 30 days, and when this token was last seen.',
      `<div class="flex items-center gap-4 font-mono text-xs tabular-nums">
        <span>2.71k requests</span>
        <span class="text-muted-foreground">·</span>
        <span>$41.80</span>
        <span class="text-muted-foreground">·</span>
        <span>18.4M in · 412k out</span>
        <span class="text-muted-foreground">·</span>
        <span class="text-muted-foreground">19m ago</span>
      </div>`
    )}

    <!-- Rotated is drawn only once the secret has actually been replaced.
         A "never rotated" line on a week-old token is noise; on a
         two-year-old one the absence is the point, so it is the date that
         appears rather than a reassuring default. -->
    ${field(
      'Lifetime',
      'When this token was created, when it stops working, and when its secret last changed.',
      `<div class="space-y-1 font-mono text-xs">
        <div>Created 2026-06-04</div>
        <div>No expiry</div>
        <div>Rotated 2026-09-08</div>
      </div>`
    )}

    <div class="px-6 py-4">
      <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
        <i class="ri-information-line mr-1 align-[-1px]"></i>
        <span class="font-medium text-foreground">Rotating keeps this row.</span>
        The name, endpoint scope, routing profile and every request already attributed to this token
        stay as they are; only the secret the client presents changes.
      </div>
    </div>

    <!-- Last thing on the page, which is where a form's own actions
         belong. Not the app title bar — up there it sits beside the
         breadcrumbs and says nothing about which of the page's controls
         it applies to, and Rotate and Revoke are already in the header
         without being part of this form. It names the token because this
         page is reached from a table of several, and that is the one
         thing worth being sure of before changing what a live client may
         reach. Present rather than appearing on the first edit: a bar
         that materialises moves everything around it. -->
    <div class="flex items-center gap-2 border-t border-border/60 px-6 py-4">
      <span class="text-[12px] text-muted-foreground">
        Saves the endpoint, profile and plan of <span class="font-medium text-foreground">MacBook — Codex</span>,
        from its next request. The token value itself does not change.
      </span>
      <div class="ml-auto flex gap-2">
        ${btn('Discard', 'ghost', '')}
        ${btn('Save', 'primary', 'ri-check-line')}
      </div>
    </div>

    <div class="h-8"></div>
  </div>
  ${params.has('reset') ? resetDialog() : ''}`

renderShell({
  active: 'access-tokens',
  navMode: 'cloudflare',
  crumbs: [{ label: 'Access tokens', href: 'access-tokens.html' }, 'MacBook — Codex'],
  subtitle: 'Rotate, re-scope or revoke one client’s credential'
})
document.querySelector('.fixed button.absolute')?.addEventListener('click', () => { location.href = returnHref })
</script>
</body>
</html>
