<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Providers</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, meter, btn, navTo, tierCell, sortTh, toast } = window.Shell

// Providers / Subscriptions / Models / Transformers were four separate
// screens. They are one thing — "where requests can go" — so they become
// one master-detail screen: pick a provider on the left, configure its
// models on the right.
//
// The rail itself lives in shell.js: it is the same list on both provider
// detail mocks, and picking a row is how a reviewer crosses from the
// subscription detail to the API-key one.

// The page reads until Edit is pressed, the same as the API-key detail:
// the tier pickers and the switches were live all the time. `?edit` draws
// the state after Edit. Declared first because the model table is rendered
// the moment it is defined.
const EDITING = new URLSearchParams(location.search).has('edit')

// Actions that reload the page or leave it would drop an unsaved edit, so
// they are locked until Save or Revert.
const lockedWhileEditing = EDITING ? 'pointer-events-none opacity-50' : ''
const withClass = (html, cls) => (cls === '' ? html : html.replace('class="', `class="${cls} `))

// A read-only tier cell: the picker's own tone, without the chevron that
// says it opens.
const READ_TONE = { manual: 'bg-muted text-foreground', auto: 'text-muted-foreground', unset: 'text-muted-foreground/50' }
const tierRead = (tier, source) =>
  `<span class="inline-flex items-center rounded px-1.5 py-0.5 text-[12px] ${READ_TONE[source]}">${source === 'unset' ? '—' : tier}</span>`

// The pill switch, a reading of the state until Edit is pressed.
const toggle = (on) => `
  <span class="inline-flex h-4 w-7 items-center rounded-full ${on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5 align-middle ${EDITING ? '' : 'opacity-50'}">
    <span class="size-3 rounded-full bg-background ${on ? 'translate-x-3' : ''}"></span>
  </span>`

// ─── Model table for the selected provider ────────────────────────────
// Prices stay in separate columns (in / cached / out) — one packed
// "$3/$0.30/$15" cell is unreadable and unsortable.
// `tierSource` is the fact the old pill could not carry. Every name here
// but one contains its family, so the router infers it; `claude-mythos-5`
// does not, and only exists as a tier because someone set one.
const MODELS = [
  { name: 'claude-fable-5',    tier: 'fable',  tierSource: 'auto',   ctx: '500k', inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-opus-4-8',   tier: 'opus',   tierSource: 'auto',   ctx: '200k', inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-opus-4-7',   tier: 'opus',   tierSource: 'auto',   ctx: '200k', inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-sonnet-5',   tier: 'sonnet', tierSource: 'auto',   ctx: '1M',   inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-sonnet-4-6', tier: 'sonnet', tierSource: 'auto',   ctx: '1M',   inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-haiku-4-5',  tier: 'haiku',  tierSource: 'auto',   ctx: '200k', inp: '—', cache: '—', out: '—', test: 'fail',    on: true },
  { name: 'claude-mythos-5',   tier: 'fable',  tierSource: 'manual', ctx: '500k', inp: '—', cache: '—', out: '—', test: 'unknown', on: false }
]

const testIcon = { ok: '<i class="ri-check-line text-emerald-600 dark:text-emerald-400"></i>', fail: '<i class="ri-close-line text-destructive"></i>', unknown: '<i class="ri-subtract-line text-muted-foreground/50"></i>' }

const modelRow = (m) => `
  <tr class="border-t border-border/60 transition-colors hover:bg-muted/50 ${m.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2 font-mono text-xs">${m.name}</td>
    <td class="px-2">${EDITING ? tierCell(m.tier, m.tierSource) : tierRead(m.tier, m.tierSource)}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.ctx}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.inp}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.cache}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.out}</td>
    <td class="px-2 text-center text-sm leading-none">${testIcon[m.test]}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">${toggle(m.on)}</td>
  </tr>`

const models = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-16"><col class="w-20"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Model', 'pl-6 pr-2')}
        ${sortTh('Tier', 'px-2', 'left', true, 'desc')}
        ${sortTh('Context', 'px-2', 'right')}
        ${sortTh('In /1M', 'px-2', 'right')}
        ${sortTh('Cached', 'px-2', 'right')}
        ${sortTh('Out /1M', 'px-2', 'right')}
        ${sortTh('Test', 'px-2', 'center')}
        ${sortTh('On', 'pl-2 pr-6', 'right')}
      </tr>
    </thead>
    <tbody>${MODELS.map(modelRow).join('')}</tbody>
  </table>`

// Every window the account is under, not just the weekly one.
//
// This drew one meter and called it the account, picking the 7-day
// because it is the one an operator plans around. But all of them bind:
// an account at 0% for the week is still unroutable while its 5-hour
// window is spent, and the per-model row is the only place a Fable
// ceiling is visible at all. Showing one and labelling it "weekly" made
// the other two look like they did not exist.
//
// The first account is this install's, from GET /api/usage: 5-hour 0%
// with no reset time yet, 7-day at 100%, and the weeklyScoped row the
// collector reports, which on this account is Fable. The second is
// invented so the panel shows more than one row — its windows are the
// same three, because those are the ones Claude actually publishes. No
// row is singled out: no account is designated any more, the proxy picks
// between them per request.
const ACCOUNTS = [
  // Full addresses, not the elided ones this fixture used to carry. They
  // were shortened to survive a 288px-narrower pane; drawn short, the
  // panel looked comfortable at a width it never had.
  {
    // "Max 20x", not "Max": Max is two plans, and which one decides how
    // much headroom the meters below are a percentage of.
    label: 'tkgstrator@gmail.com', plan: 'Max 20x', auth: 'live',
    windows: [
      { label: '5-hour',        pct: 0,   resets: '—' },
      { label: '7-day',         pct: 100, resets: '2d 09h' },
      { label: '7-day · Fable', pct: 9,   resets: '2d 09h' }
    ]
  },
  {
    label: 'second.account@gmail.com', plan: 'Pro', auth: 'live',
    windows: [
      { label: '5-hour',        pct: 12, resets: '1h 47m' },
      { label: '7-day',         pct: 22, resets: '3d 04h' },
      { label: '7-day · Fable', pct: 4,  resets: '3d 04h' }
    ]
  }
]

// One row per window: label, bar, percentage, and the clock it resets on.
// The bar is what carries the shape at a glance, so it keeps the slack;
// the label and the two numbers are fixed so three rows line up as a
// small table rather than three ragged lines.
const windowLine = (w) => `
  <div class="mt-1.5 flex items-center gap-2">
    <span class="w-24 shrink-0 truncate text-[12px] text-muted-foreground">${w.label}</span>
    <div class="min-w-0 flex-1">${meter(w.pct)}</div>
    <span class="w-9 shrink-0 text-right font-mono text-[12px] tabular-nums">${w.pct}%</span>
    <span class="w-14 shrink-0 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${w.resets}</span>
  </div>`

// An account's meters are a snapshot; the history behind them is Usage.
const accountRow = (a) => `
  <div ${navTo('activity-usage.html')} class="px-4 py-3 transition-colors hover:bg-muted/50">
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium">${a.label}</span>
      ${pill(a.plan, 'info')}
      <span class="ml-auto text-[12px] text-muted-foreground/70">resets in</span>
    </div>
    ${a.windows.map(windowLine).join('')}
    <div class="mt-2 text-[12px] text-muted-foreground">auth ${a.auth}</div>
  </div>`

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <div class="flex items-center gap-3 border-b border-border px-6 py-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold">Claude Code</h2>
            ${pill('subscription', 'info')}
            ${pill('live', 'ok')}
          </div>
          <p class="mt-0.5 font-mono text-[12px] text-muted-foreground">https://api.anthropic.com/v1/messages</p>
        </div>
        <!-- Edit, then Revert / Save, for the switch Routing reads and each
             model's tier and switch. The accounts are read-only either way:
             they change by signing in, not by editing this page. Test all is
             locked while editing, like the page actions above. -->
        <div class="ml-auto flex items-center gap-2">
          <span class="flex items-center gap-1.5 pr-1 text-[12px] text-muted-foreground">Routable ${toggle(true)}</span>
          ${withClass(btn('Test all', 'outline', 'ri-pulse-line'), lockedWhileEditing)}
          ${
            EDITING
              ? `${btn('Revert', 'outline', 'ri-arrow-go-back-line')}${btn('Save', 'primary', 'ri-check-line')}`
              : btn('Edit', 'outline', 'ri-pencil-line')
          }
        </div>
      </div>

      <div class="grid grid-cols-2 border-b border-border">
        <div class="border-r border-border">
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Accounts</h3>
          </div>
          <div class="px-2 pb-4">${ACCOUNTS.map(accountRow).join('')}</div>
        </div>
        <!-- Read-only. There is nothing to pick here: the wire shape is a
             function of apiStyle + authMode, and all six registered
             transformers are endpoint- or auth-bound. Shown because
             "what does this provider actually speak" is worth seeing
             when a request misbehaves. -->
        <div>
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Request shape</h3>
          </div>
          <div class="px-6 pb-4">
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">API style</span>
              <span class="ml-auto font-mono text-[12px]">anthropic</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">Auth</span>
              <span class="ml-auto font-mono text-[12px]">subscription (OAuth)</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">Pipeline</span>
              <span class="ml-auto font-mono text-[12px]">claude-code-oauth</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">Endpoint</span>
              <span class="ml-auto font-mono text-[12px]">/v1/messages</span>
            </div>
            <p class="mt-3 text-[12px] leading-relaxed text-muted-foreground">
              Derived from the API style — not configurable. Per-model overrides live in the
              model row below.
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <h3 class="text-sm font-semibold">Models</h3>
        <span class="text-[12px] text-muted-foreground">6 of 7 enabled</span>
        <div class="ml-auto flex items-center gap-2">
          <div class="flex h-7 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Filter
          </div>
        </div>
      </div>
      ${models}
      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Tier is read from the model name when the name says a family —
          <span class="font-mono">fable</span> / <span class="font-mono">opus</span> /
          <span class="font-mono">sonnet</span> / <span class="font-mono">haiku</span>. Those cells are
          plain. <span class="font-mono">claude-mythos-5</span> says none of them, so its tier was set
          by hand and is shown solid. Press Edit to override or clear one; Routing's
          <span class="font-medium text-foreground">tier respect</span> floor is what reads it.
        </div>
      </div>
      <div class="h-8"></div>
  </div>`

renderShell({
  active: 'providers',
  sub: 'subscriptions',
  navMode: 'cloudflare',
  crumbs: [{ label: 'Subscriptions', href: 'providers.html' }, 'Claude Code'],
  subtitle: '7 providers · 23 models enabled · 3 subscription accounts',
  // One Refresh, under one backdrop: this provider's accounts — re-checked,
  // with their windows read now, even while the provider is switched off,
  // which is exactly when an operator wants to know whether its credentials
  // still work — plus the catalog's prices and models. It replaced
  // "Refresh prices" here and "Sync models" beside Test all. Both actions
  // are locked while an edit is open.
  actions:
    withClass(btn('Refresh', 'ghost', 'ri-refresh-line'), lockedWhileEditing) +
    withClass(btn('Add subscription', 'primary', 'ri-add-line', 'providers-connect.html'), lockedWhileEditing),
  // Drawn here because a refresh is the app's longest action and the one
  // whose result is hardest to see on the screen that started it. It says
  // what was refreshed; an account that could not be is named instead.
  // Not drawn over the edit state, which a refresh cannot start from.
  ...(EDITING ? {} : { toast: toast('Refreshed usage, prices and models', 'ok') })
})
</script>
</body>
</html>
