<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Providers</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, meter, btn, navTo, sortTh, toast, dialog } = window.Shell

// Providers / Subscriptions / Models / Transformers were four separate
// screens. They are one thing — "where requests can go" — so they become
// one master-detail screen: pick a provider on the left, configure its
// models on the right.
//
// The rail itself lives in shell.js: it is the same list on both provider
// detail mocks, and picking a row is how a reviewer crosses from the
// subscription detail to the API-key one.

// The page reads until Edit is pressed, the same as the API-key detail.
// `?edit` draws the state after Edit. `?codex` draws the same page for a
// Codex provider — the one whose accounts carry banked resets — and
// `?codex&reset` the confirmation that spending one opens. Declared first
// because the tables are rendered the moment they are defined.
const params = new URLSearchParams(location.search)
const EDITING = params.has('edit')
const CODEX = params.has('codex')
const CONFIRM_RESET = CODEX && params.has('reset')

// Actions that reload the page or leave it would drop an unsaved edit, so
// they are locked until Save or Revert.
const lockedWhileEditing = EDITING ? 'pointer-events-none opacity-50' : ''
const withClass = (html, cls) => (cls === '' ? html : html.replace('class="', `class="${cls} `))

// The pill switch, a reading of the state until Edit is pressed.
const toggle = (on) => `
  <span class="inline-flex h-4 w-7 items-center rounded-full ${on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5 align-middle ${EDITING ? '' : 'opacity-50'}">
    <span class="size-3 rounded-full bg-background ${on ? 'translate-x-3' : ''}"></span>
  </span>`

// ─── Model table for the selected provider ────────────────────────────
// Prices stay in separate columns (in / cached / out) — one packed
// "$3/$0.30/$15" cell is unreadable and unsortable.
//
// On a wide table two more columns sit beside the model: the effort levels
// the model's own list reported, and how thinking is switched off on it
// (`disabled` or `between_tools`, up to which effort, or not at all:
// always on). Measured on the table, not the viewport, and dropped below
// 84rem rather than squeezing the model name. A model switched off has not
// been probed yet and reads a dash; Codex has no thinking probe and so no
// Thinking off column. The Effort levels column is as wide as the longest
// ladder needs — 16rem holds any four levels, each one past that adds
// 2.5rem — so a Codex list up to `ultra` stays clear of Context.
const CLAUDE_EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max']
const MODELS = CODEX
  ? [
      { name: 'gpt-5.5',             ctx: '400k', test: 'ok',      on: true,  effort: ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'] },
      { name: 'gpt-5.3-codex-spark', ctx: '128k', test: 'ok',      on: true,  effort: ['low', 'medium', 'high'] },
      { name: 'gpt-5.3-codex',       ctx: '400k', test: 'unknown', on: false, effort: ['low', 'medium', 'high', 'xhigh'] }
    ]
  : [
      { name: 'claude-opus-5',     ctx: '500k', test: 'unknown', on: false, effort: CLAUDE_EFFORTS, thinking: null },
      { name: 'claude-fable-5',    ctx: '500k', test: 'ok',   on: true, effort: CLAUDE_EFFORTS, thinking: [] },
      { name: 'claude-opus-4-8',   ctx: '200k', test: 'ok',   on: true, effort: CLAUDE_EFFORTS, thinking: [['disabled', '≤ high']] },
      { name: 'claude-opus-4-7',   ctx: '200k', test: 'ok',   on: true, effort: ['low', 'medium', 'high', 'max'], thinking: [['disabled', '≤ high']] },
      { name: 'claude-sonnet-5',   ctx: '1M',   test: 'ok',   on: true, effort: CLAUDE_EFFORTS, thinking: [['disabled', '']] },
      { name: 'claude-sonnet-4-6', ctx: '1M',   test: 'ok',   on: true, effort: ['low', 'medium', 'high', 'max'], thinking: [['between_tools', '≤ high']] },
      { name: 'claude-haiku-4-5',  ctx: '200k', test: 'fail', on: true, effort: [], thinking: [['disabled', '']] }
    ]

const testIcon = { ok: '<i class="ri-check-line text-emerald-600 dark:text-emerald-400"></i>', fail: '<i class="ri-close-line text-destructive"></i>', unknown: '<i class="ri-subtract-line text-muted-foreground/50"></i>' }

// Filled for a value that holds, outlined for one that says "nothing
// here".
const badge = (text, filled = true) =>
  filled
    ? `<span class="inline-flex items-center rounded bg-muted px-1.5 py-0.5 text-[12px]">${text}</span>`
    : `<span class="inline-flex items-center rounded border border-border px-1.5 py-px text-[12px] text-muted-foreground/70">${text}</span>`

const dash = '<span class="text-[12px] text-muted-foreground/50">—</span>'

const effortRead = (efforts) =>
  efforts === undefined
    ? dash
    : efforts.length === 0
      ? badge('unsupported', false)
      : `<span class="inline-flex items-center gap-1">${efforts.map((e) => badge(e)).join('')}</span>`

const thinkingRead = (thinking) =>
  thinking === null
    ? dash
    : thinking.length === 0
      ? badge('always on', false)
      : `<span class="inline-flex items-center gap-1.5">${thinking
          .map(([setting, cond]) => `${badge(setting)}${cond === '' ? '' : `<span class="text-[12px] text-muted-foreground">${cond}</span>`}`)
          .join('')}</span>`

// Shown only on a wide table: hidden until the container is 84rem.
const WIDE_CELL = 'hidden @min-[84rem]:table-cell'
const WIDE_COL = 'hidden @min-[84rem]:table-column'
const EFFORT_LEVELS_WIDTHS = ['w-64', 'w-70', 'w-80', 'w-90', 'w-100']
const effortLevelsWidth = EFFORT_LEVELS_WIDTHS[
  Math.min(Math.max(Math.max(...MODELS.map((m) => (m.effort === undefined ? 0 : m.effort.length))) - 4, 0), EFFORT_LEVELS_WIDTHS.length - 1)
]

const modelRow = (m) => `
  <tr class="border-t border-border/60 transition-colors hover:bg-muted/50 ${m.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2">
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs">${m.name}</span>
      </div>
    </td>
    <td class="${WIDE_CELL} px-2 whitespace-nowrap">${effortRead(m.effort)}</td>
    ${CODEX ? '' : `<td class="${WIDE_CELL} px-2 whitespace-nowrap">${thinkingRead(m.thinking)}</td>`}
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.ctx}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">—</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">—</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">—</td>
    <td class="px-2 text-center text-sm leading-none">${testIcon[m.test]}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">${toggle(m.on)}</td>
  </tr>`

const models = `
  <div class="@container">
  <table class="w-full table-fixed">
    <colgroup><col><col class="${WIDE_COL} ${effortLevelsWidth}">${CODEX ? '' : `<col class="${WIDE_COL} w-44">`}<col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-16"><col class="w-20"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Model', 'pl-6 pr-2')}
        <th class="${WIDE_CELL} px-2 text-left font-medium">Effort levels</th>
        ${CODEX ? '' : `<th class="${WIDE_CELL} px-2 text-left font-medium">Thinking off</th>`}
        ${sortTh('Context', 'px-2', 'right')}
        ${sortTh('In /1M', 'px-2', 'right')}
        ${sortTh('Cached', 'px-2', 'right')}
        ${sortTh('Out /1M', 'px-2', 'right')}
        ${sortTh('Test', 'px-2', 'center')}
        ${sortTh('On', 'pl-2 pr-6', 'right')}
      </tr>
    </thead>
    <tbody>${MODELS.map(modelRow).join('')}</tbody>
  </table>
  </div>`

// ─── Accounts ─────────────────────────────────────────────────────────
// Every window the account is under, not just the weekly one: all of them
// bind, and the per-model row is the only place a Fable ceiling shows.
//
// What the account carried at API prices ("API equiv") is not drawn
// here: the Usage tab shows it, over time, beside the same windows.
//
// Codex accounts also carry banked resets. The count comes from the same
// usage poll as the windows; spending one is the one action on this page
// that acts on a single account, and it is never done for the operator —
// banked resets expire, and whether to spend one now is a judgement the
// page can inform but not make.
const ACCOUNTS = CODEX
  ? [
      {
        label: 'tkgstrator@gmail.com', plan: 'Pro', auth: 'live',
        windows: [
          { label: '5-hour', pct: 100, resets: '3h 12m' },
          { label: 'weekly', pct: 64,  resets: '4d 02h' }
        ],
        resets: { available: 2, expires: 'Oct 14' }
      },
      {
        label: 'team.codex@example.com', plan: 'Plus', auth: 'live',
        windows: [
          { label: '5-hour', pct: 18, resets: '4h 40m' },
          { label: 'weekly', pct: 31, resets: '6d 11h' }
        ],
        resets: { available: 0, expires: null }
      }
    ]
  : [
      {
        // "Max 20x", not "Max": Max is two plans, and which one decides how
        // much headroom the meters below are a percentage of.
        label: 'tkgstrator@gmail.com', plan: 'Max 20x', auth: 'live',
        windows: [
          { label: '5-hour',        pct: 0,   resets: '—' },
          { label: '7-day',         pct: 100, resets: '2d 09h' },
          { label: '7-day · Fable', pct: 9,   resets: '2d 09h' }
        ],
      },
      {
        label: 'second.account@gmail.com', plan: 'Pro', auth: 'live',
        windows: [
          { label: '5-hour',        pct: 12, resets: '1h 47m' },
          { label: '7-day',         pct: 22, resets: '3d 04h' },
          { label: '7-day · Fable', pct: 4,  resets: '3d 04h' }
        ],
      }
    ]

// One row per window: label, bar, percentage, and the clock it resets on.
const windowLine = (w) => `
  <div class="mt-1.5 flex items-center gap-2">
    <span class="w-24 shrink-0 truncate text-[12px] text-muted-foreground">${w.label}</span>
    <div class="min-w-0 flex-1">${meter(w.pct)}</div>
    <span class="w-9 shrink-0 text-right font-mono text-[12px] tabular-nums">${w.pct}%</span>
    <span class="w-14 shrink-0 truncate whitespace-nowrap text-right font-mono text-[12px] tabular-nums text-muted-foreground">${w.resets}</span>
  </div>`
const resetLine = (r) => `
  <div class="mt-2.5 flex items-center gap-2 border-t border-border/60 pt-2.5">
    <span class="w-24 shrink-0 text-[12px] text-muted-foreground">Banked resets</span>
    <span class="font-mono text-[12px] tabular-nums">${r.available}</span>
    ${r.expires === null ? '' : `<span class="text-[12px] text-muted-foreground">next expires ${r.expires}</span>`}
    <span class="ml-auto">${
      r.available > 0
        ? withClass(btn('Use reset', 'outline', 'ri-restart-line'), lockedWhileEditing)
        : '<span class="text-[12px] text-muted-foreground/60">none to spend</span>'
    }</span>
  </div>`

// An account's meters are a snapshot; the history behind them is Usage.
const accountRow = (a) => `
  <div class="px-4 py-3 transition-colors hover:bg-muted/50">
    <div ${navTo('activity-usage.html')} class="flex items-center gap-2">
      <span class="min-w-0 truncate text-xs font-medium" title="${a.label}">${a.label}</span>
      ${withClass(pill(a.plan, 'info'), 'shrink-0 whitespace-nowrap')}
      <span class="ml-auto shrink-0 whitespace-nowrap text-[12px] text-muted-foreground/70">resets in</span>
    </div>
    ${a.windows.map(windowLine).join('')}
    ${a.resets === undefined ? '' : resetLine(a.resets)}
    <div class="mt-2 flex items-center gap-2 text-[12px] text-muted-foreground">
      ${withClass(pill(a.auth === 'live' ? 'valid' : a.auth, a.auth === 'live' ? 'ok' : a.auth === 'invalid' ? 'bad' : 'mute'), 'shrink-0 whitespace-nowrap')}
      <span class="ml-auto flex items-center gap-1.5">Routable ${toggle(a.enabled !== false)}</span>
    </div>
  </div>`

const PROVIDER = CODEX
  ? { title: 'Codex', url: 'https://chatgpt.com/backend-api/codex/responses', style: 'openai_responses', pipeline: 'codex-oauth', endpoint: '/v1/responses', crumb: 'Codex', count: '2 of 3 enabled' }
  : { title: 'Claude Code', url: 'https://api.anthropic.com/v1/messages', style: 'anthropic', pipeline: 'claude-code-oauth', endpoint: '/v1/messages', crumb: 'Claude Code', count: '6 of 7 enabled' }

// Spending a banked reset cannot be undone and the vendor keeps no
// "unspend", so it asks first, and says what it does in the vendor's own
// terms: both windows go back to 0%, one credit is gone.
const resetDialog = dialog(
  'Use a banked reset on tkgstrator@gmail.com?',
  `<div class="grid gap-3 text-xs leading-relaxed text-muted-foreground">
     <p>OpenAI resets this account's <span class="text-foreground">5-hour and weekly</span> windows to 0%. The
       credit is spent at once and cannot be returned.</p>
     <div class="grid grid-cols-[auto_1fr] gap-x-6 gap-y-1.5 rounded-md border border-border px-3 py-2.5">
       <span>Banked resets</span><span class="text-right font-mono tabular-nums text-foreground">2 → 1</span>
       <span>Next expires</span><span class="text-right font-mono tabular-nums text-foreground">Oct 14</span>
       <span>5-hour now</span><span class="text-right font-mono tabular-nums text-foreground">100%, resets in 3h 12m</span>
     </div>
     <p>The account takes requests again as soon as the reset lands — no need to wait for the next usage poll.</p>
   </div>`,
  `${btn('Cancel', 'outline', '', 'provider-subscription.html?codex')}${btn('Use reset', 'danger', 'ri-restart-line')}`
)

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <div class="flex items-center gap-3 border-b border-border px-6 py-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold">${PROVIDER.title}</h2>
            ${pill('subscription', 'info')}
            ${pill('live', 'ok')}
          </div>
          <p class="mt-0.5 font-mono text-[12px] text-muted-foreground">${PROVIDER.url}</p>
        </div>
        <!-- Edit, then Revert / Save, for provider, model and account
             switches. Account switches only select which seats may take
             requests: OAuth credentials remain read-only. A reset acts on
             the vendor and stays locked while an edit is open. -->
        <div class="ml-auto flex items-center gap-2">
          <span class="flex items-center gap-1.5 pr-1 text-[12px] text-muted-foreground">Routable ${toggle(true)}</span>
          ${withClass(btn('Test all', 'outline', 'ri-pulse-line'), lockedWhileEditing)}
          ${
            EDITING
              ? `${btn('Revert', 'outline', 'ri-arrow-go-back-line')}${btn('Save', 'primary', 'ri-check-line')}`
              : btn('Edit', 'outline', 'ri-pencil-line')
          }
        </div>
      </div>

      <div class="grid grid-cols-2 border-b border-border">
        <div class="border-r border-border">
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Accounts</h3>
          </div>
          <div class="px-2 pb-4">${ACCOUNTS.map(accountRow).join('')}</div>
        </div>
        <!-- Read-only. The wire shape is a function of apiStyle + authMode. -->
        <div>
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Request shape</h3>
          </div>
          <div class="px-6 pb-4">
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">API style</span>
              <span class="ml-auto font-mono text-[12px]">${PROVIDER.style}</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">Auth</span>
              <span class="ml-auto font-mono text-[12px]">subscription (OAuth)</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">Pipeline</span>
              <span class="ml-auto font-mono text-[12px]">${PROVIDER.pipeline}</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[12px] text-muted-foreground">Endpoint</span>
              <span class="ml-auto font-mono text-[12px]">${PROVIDER.endpoint}</span>
            </div>
            <p class="mt-3 text-[12px] leading-relaxed text-muted-foreground">
              Derived from the API style — not configurable.
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <h3 class="text-sm font-semibold">Models</h3>
        <span class="text-[12px] text-muted-foreground">${PROVIDER.count}</span>
        <div class="ml-auto flex items-center gap-2">
          <div class="flex h-7 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Filter
          </div>
        </div>
      </div>
      ${models}
      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          A model that is switched off is left out of <span class="font-mono">/v1/models</span> and cannot
          be added to a plan. A model Refresh discovers is listed here switched off; switch it on to offer it.
        </div>
      </div>
      <div class="h-8"></div>
      ${CONFIRM_RESET ? resetDialog : ''}
  </div>`

renderShell({
  active: 'providers',
  sub: 'subscriptions',
  navMode: 'cloudflare',
  crumbs: [{ label: 'Subscriptions', href: 'providers.html' }, PROVIDER.crumb],
  subtitle: '7 providers · 23 models enabled · 3 subscription accounts',
  // One Refresh: this provider's accounts — re-checked, with their windows
  // and banked resets read now, and the exhaustion marks held against
  // them reconsidered on the spot — plus the catalog's prices and
  // models. Both actions are locked while an edit is open.
  actions:
    withClass(btn('Refresh', 'ghost', 'ri-refresh-line'), lockedWhileEditing) +
    withClass(btn('Add subscription', 'primary', 'ri-add-line', 'providers-connect.html'), lockedWhileEditing),
  ...(EDITING || CONFIRM_RESET
    ? {}
    : { toast: toast('Refreshed usage, prices and models', 'ok', CODEX ? '' : '1 new model: claude-opus-5 — switch it on to offer it') })
})
</script>
</body>
</html>
