<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Advanced</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, tabs } = window.Shell

// Absorbs DebugPage + JsonEditor + the debug/ sub-components. Two things
// live here: the raw config document and the health probe. A request
// scratchpad tab used to sit between them; it was designed but never
// built, and the copy inside it pointed at /debug, a route that no
// longer exists. A tab whose only content is "not built, go here" —
// where "here" is a 404 — is worse than no tab.
// (original note kept below for the record)
// live here: the raw config document, and a request scratchpad for
// reproducing a routing decision without a client.
const CONFIG = `{
  // Boot scalars. Everything else — providers, models, routing — is
  // in Postgres and edited from the screens above.
  HOST: "0.0.0.0",
  PORT: 3456,
  RIALTO_TOKEN: "$RIALTO_TOKEN",
  LOG: true,
  LOG_LEVEL: "info",
  API_TIMEOUT_MS: 600000,
  PROXY_URL: null,
  NON_INTERACTIVE_MODE: false,

  StatusLine: {
    modules: [
      { type: "cwd" },
      { type: "gitBranch" },
      { type: "model", color: "#38bdf8", stripProvider: true },
      { type: "quota", color: "#34d399" },
      { type: "cost",  color: "#fbbf24" }
    ]
  }
}`

const line = (n, text) => `
  <div class="flex hover:bg-muted/40">
    <span class="w-10 shrink-0 select-none py-0.5 pr-3 text-right font-mono text-[12px] tabular-nums text-muted-foreground/50">${n}</span>
    <span class="min-w-0 flex-1 whitespace-pre py-0.5 font-mono text-[12px]">${text || ' '}</span>
  </div>`

document.getElementById('root').innerHTML = `
  <div class="grid h-full grid-cols-1">

    <div class="min-w-0 overflow-y-auto">
      <div class="flex items-center gap-1 border-b border-border px-6">
        ${tabs([
          { id: 'config', label: 'Config document' },
          { id: 'health', label: 'Health', href: 'settings-advanced-health.html' }
        ], 'config')}
      </div>

      <div class="flex items-center gap-3 border-b border-border px-6 py-3">
        <span class="font-mono text-[12px] text-muted-foreground">~/.rialto/config.json</span>
        ${pill('JSON5', 'mute')}
        ${pill('valid', 'ok')}
        <span class="text-[12px] text-muted-foreground">no backups &mdash; this is the only copy</span>
        <div class="ml-auto flex gap-2">
          ${btn('Reload', 'ghost', 'ri-refresh-line')}
          ${btn('Format', 'ghost', 'ri-code-line')}
          ${btn('Save', 'primary', 'ri-check-line')}
        </div>
      </div>

      <div class="border-b border-border py-2">
        ${CONFIG.split('\\n').map((t, i) => line(i + 1, t.replace(/</g, '&lt;'))).join('')}
      </div>

      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Comments survive round-trips (JSON5) and <span class="font-mono">$VAR</span> is
          interpolated at boot, so a key can live in the environment rather than this file.
          Changes here need a restart — the screens above apply live.
        </div>
      </div>

      <div class="flex items-center gap-3 border-t border-border px-6 pt-5 pb-3">
        <h2 class="text-sm font-semibold">Danger zone</h2>
      </div>
      <!-- Three destructive operations, drawn as rows without buttons on
           purpose. Each needs a server-side handler that can do the work
           in one transaction; a client-side loop over the per-row
           endpoints would leave a half-reset install behind on any
           failure. A button here would be a button that cannot run, so
           the panel names what is missing instead. -->
      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-4">
          <div class="flex items-center gap-2">
            <i class="ri-tools-line text-sm text-muted-foreground"></i>
            <span class="text-xs font-medium">Reset routing · re-seed catalog · purge captured data</span>
            ${pill('not yet available', 'mute')}
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            All three are destructive operations with no route behind them. They need server-side
            handlers that can do the work inside one transaction.
          </p>
        </div>
      </div>
      <div class="h-10"></div>
    </div>

  </div>`

renderShell({
  active: 'settings',
  navMode: 'cloudflare',
  sub: 'advanced',
  crumbs: ['Advanced'],
  subtitle: '~/.rialto/config.json · JSON5',
  // No Backups button: there are none. `writeConfigFile` overwrites the
  // file in place, and the only safety net is that a config which fails
  // to parse gets renamed aside rather than deleted. The header says so
  // outright, because this is the one screen where an operator decides
  // whether it is safe to save — and it used to claim "3 backups kept",
  // which is the opposite of the truth.
  actions: btn('Save', 'primary', 'ri-check-line')
})
</script>
</body>
</html>
