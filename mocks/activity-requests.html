<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Requests</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, surfacePill, navTo, sortTh } = window.Shell

// One row per upstream call (RequestLog), vs Sessions which groups them.
// The columns that did not exist before are `Requested` / `Sent`, `Rule`
// and `Token` — the three answers to "why did this go there, and who
// asked for it".
//
// The middle column is `Scenario`, not `Rule`. It was drawn as a rule name
// ("Haiku passthrough"), but no rule name is persisted — RequestLog has no
// matchedRule column and model-selection.ts only logs the match — so the
// build could fill it with nothing but the ScenarioKey. Calling it Rule made
// "think" read as a rule someone had written. Restore the rule name here
// once a matchedRule column exists to stamp it into.
const REQS = [
  { t: '14:05:47', status: 200, requested: 'claude-haiku-4-5',  sent: 'claude-code,claude-haiku-4-5',  surface: '/v1/messages',  rule: 'default', lane: 'subagent', token: 'MacBook — Claude Code', inTok: '3.10k', outTok: '412',  ms: '812',   cost: '$0.00412' },
  { t: '14:03:02', status: 200, requested: 'claude-sonnet-4-5', sent: 'claude-code,claude-fable-5',    surface: '/v1/messages',  rule: '—', lane: 'agent',    token: 'MacBook — Claude Code', inTok: '48.2k', outTok: '2.10k', ms: '4,411', cost: '$0.0891' },
  { t: '14:03:02', status: 429, requested: 'claude-sonnet-4-5', sent: 'codex,gpt-5.5',                 surface: '/v1/messages',  rule: '—', lane: 'agent',    token: 'MacBook — Claude Code', inTok: '—',     outTok: '—',     ms: '—',     cost: '—' },
  { t: '14:02:33', status: 200, requested: 'claude-sonnet-4-5', sent: 'claude-code,claude-opus-4-8',   surface: '/v1/messages',  rule: '—', lane: 'agent',    token: 'MacBook — Claude Code', inTok: '46.1k', outTok: '1.84k', ms: '3,806', cost: '$0.121' },
  { t: '13:58:10', status: 200, requested: 'gpt-5.5',           sent: 'codex,gpt-5.5',                 surface: '/v1/responses', rule: '—', lane: 'agent',    token: 'MacBook — Codex',       inTok: '12.4k', outTok: '940',   ms: '2,140', cost: '—' },
  { t: '13:51:04', status: 200, requested: 'gemini-3.1-pro',    sent: 'gemini-cli,gemini-3.1-pro',     surface: '/v1beta/models/*',    rule: '—', lane: 'agent',    token: 'Gemini CLI',            inTok: '8.20k', outTok: '610',   ms: '1,104', cost: '—' },
  { t: '13:40:22', status: 400, requested: 'gpt-5.4-mini',      sent: 'openai,gpt-5.4-mini',           surface: '/v1/chat/completions',      rule: 'longContext', lane: 'agent', token: 'CI — nightly evals', inTok: '—', outTok: '—',  ms: '188',   cost: '—' },
  { t: '13:38:57', status: 200, requested: 'gpt-5.4-mini',      sent: 'openai,gpt-5.4-mini',           surface: '/v1/chat/completions',      rule: 'longContext', lane: 'agent', token: 'CI — nightly evals', inTok: '2.30k', outTok: '301', ms: '640', cost: '$0.00118' }
]

const statusPill = (s) => (s === 200 ? pill('200', 'ok') : s === 429 ? pill('429', 'warn') : pill(String(s), 'bad'))

// Two cells name something that lives on another screen — the rule that
// matched, and the credential the caller presented. A nested data-nav
// wins over the row's, so those two cells lead to their own editor while
// the rest of the row still opens the log group.
const linked = (text, href) => '<span ' + navTo(href) + '>' + text + '</span>'

// The row leads to its SESSION, not to the log group: a request's log
// lines are split across several reqIds today (the access line, the
// routing decision and each upstream attempt each mint their own), so a
// link to Logs lands on a fragment of the story. The session is the
// whole conversation the request belongs to, and its id is on every row.
const row = (r) => `
  <tr ${navTo('activity-session.html')} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-2 font-mono text-[12px] tabular-nums text-muted-foreground">${r.t}</td>
    <td class="px-2">${statusPill(r.status)}</td>
    <td class="px-2">${surfacePill(r.surface)}</td>
    <!-- Two columns, not one cell with an arrow between them. Sharing a
         column meant both halves truncated to "claude… → claude-code…"
         at 1440px — the one thing this screen exists to show, unreadable
         — because the pair needs 318px and the column had 272. -->
    <td class="px-2 font-mono text-[12px] text-muted-foreground">${r.requested}</td>
    <td class="px-2 font-mono text-[12px]">${r.sent}</td>
    <!-- The lane rides with the scenario instead of holding a column: it
         is a qualifier of it (there is no lane without a scenario), it is
         "agent" on almost every row, and the column it cost belonged to
         the model pair, which was truncating both of its halves. -->
    <td class="px-2 text-[12px] ${r.rule === '—' ? 'text-muted-foreground/50' : ''}">${
      r.rule === '—' ? r.rule : linked(r.rule, 'routing-rules.html')
    }${r.lane === 'agent' ? '' : `<span class="ml-1.5 text-muted-foreground">· ${r.lane}</span>`}</td>
    <td class="px-2 truncate text-[12px] text-muted-foreground">${linked(r.token, 'settings-access.html')}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums">${r.inTok}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums">${r.outTok}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${r.ms}</td>
    <td class="py-2.5 pl-2 pr-6 text-right font-mono text-xs tabular-nums">${r.cost}</td>
  </tr>`

const filter = (label, value) => `
  <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs transition-colors hover:bg-muted/60">
    <span class="text-muted-foreground">${label}</span><span>${value}</span>
    <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
  </button>`

document.getElementById('root').innerHTML = `

  <div class="flex flex-wrap items-center gap-2 border-b border-border px-6 py-3">
    ${filter('Surface', 'All')}
    ${filter('Status', 'All')}
    ${filter('Token', 'All')}
    ${filter('Scenario', 'All')}
    ${filter('Range', 'Last 24h')}
    <div class="ml-auto flex items-center gap-2">
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground">
        <span class="size-1.5 animate-pulse rounded-full bg-emerald-500"></span> live
      </span>
      ${btn('Export', 'ghost', 'ri-download-line')}
    </div>
  </div>

  <div class="grid grid-cols-5 gap-px border-b border-border px-6 py-4">
    ${[
      ['Requests', '18,742', 'last 24h'],
      ['2xx', '18,619', '99.3%'],
      ['429', '104', 'failed over'],
      ['4xx / 5xx', '19', '0.1%'],
      ['p50 / p95', '1.9s / 8.4s', 'end to end']
    ].map(([l, v, s]) => `
      <div class="border-l-2 border-l-border px-4 py-3 transition-colors hover:border-l-foreground/30 hover:bg-muted/50">
        <div class="text-[12px] uppercase tracking-wider text-muted-foreground">${l}</div>
        <div class="mt-1 font-mono text-base tabular-nums">${v}</div>
        <div class="text-[12px] text-muted-foreground">${s}</div>
      </div>`).join('')}
  </div>

  <!-- Eleven columns need 1360px and a 1440px window has 1184 for them, so
       the table keeps its own width and scrolls rather than paying for the
       gap in ellipses. Every fixed width below is the widest value that
       column actually renders plus its padding — measured, not guessed —
       and Sent is the auto column, so a wide window spends its slack on
       the longest value on the screen instead of on empty gutters. -->
  <div class="overflow-x-auto">
  <table class="w-full min-w-[1360px] table-fixed">
<colgroup><col class="w-28"><col class="w-16"><col class="w-44"><col class="w-36"><col><col class="w-36"><col class="w-36"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-28"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Time', 'pl-6 pr-2', 'left', true, 'desc')}
        ${sortTh('Status', 'px-2')}
        ${sortTh('Endpoint', 'px-2')}
        ${sortTh('Requested', 'px-2')}
        ${sortTh('Sent', 'px-2')}
        ${sortTh('Scenario', 'px-2')}
        ${sortTh('Token', 'px-2')}
        ${sortTh('Input', 'px-2', 'right')}
        ${sortTh('Output', 'px-2', 'right')}
        ${sortTh('ms', 'px-2', 'right')}
        ${sortTh('Cost', 'pl-2 pr-6', 'right')}
      </tr>
    </thead>
    <tbody>${REQS.map(row).join('')}</tbody>
  </table>
  </div>

  <div class="px-6 py-4">
    <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
      <i class="ri-information-line mr-1 align-[-1px]"></i>
      A <span class="font-mono">429</span> row is not an error the client saw — it is a failover
      step. The 14:03:02 pair shows Codex refusing and Fable serving the same turn 0ms later.
      Subscription rows have no cost: the plan is already paid for.
    </div>
  </div>
  <div class="h-6"></div>`

renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'requests',
  crumbs: ['Requests'],
  // Every number here describes ONE scope, and says which. The build that
  // followed this line drifted into mixing three: an all-time total, a
  // failover count taken from the filtered rows, and the page cap — three
  // scopes in one sentence, none of them labelled.
  subtitle: '184 of 18.7k requests · last 24h',
  actions:
    btn('Live tail', 'outline', 'ri-broadcast-line', 'activity-logs.html') +
    btn('Columns', 'ghost', 'ri-layout-column-line')
})
</script>
</body>
</html>
