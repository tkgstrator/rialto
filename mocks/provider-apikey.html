<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Provider (API key)</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, tierCell, effortCell, sortTh, pager } = window.Shell

// The api_key half of Providers. Differs from the subscription detail in
// three ways that matter: a key field instead of accounts, real prices
// instead of "—", and a much longer model list that needs filtering.
//
// Same shape as provider-subscription.html — the two are one
// screen with two kinds of detail, and the rail is what says so.

// Prices are per 1M tokens, each in its own right-aligned column.
//
// No name here contains a Claude family, so `tierOf` classifies none of
// them: every tier below was typed by an operator, and the four left unset
// are what an untouched api_key provider actually looks like. Those four
// are invisible to Routing's tier-respect floor — that is the cost of the
// column having been read-only.
const MODELS = [
  { name: 'gpt-5.5',        tier: 'opus',   tierSource: 'manual', effort: null,   ctx: '400k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: '—',        test: 'ok',      on: true },
  { name: 'gpt-5.4',        tier: 'sonnet', tierSource: 'manual', effort: null,   ctx: '400k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: '—',        test: 'ok',      on: true },
  { name: 'gpt-5.4-mini',   tier: 'haiku',  tierSource: 'manual', effort: 'low',  ctx: '400k', inp: '$0.250', cache: '$0.0250', out: '$2.00', style: '—',      test: 'ok',      on: true },
  { name: 'gpt-5.3-codex',  tier: 'opus',   tierSource: 'manual', effort: 'high', ctx: '400k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: 'responses', test: 'ok',     on: true },
  { name: 'gpt-5.2',        tier: null,     tierSource: 'unset',  effort: null,   ctx: '272k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: '—',        test: 'ok',      on: true },
  { name: 'gpt-4.1',        tier: null,     tierSource: 'unset',  effort: null,   ctx: '1M',   inp: '$2.00', cache: '$0.500', out: '$8.00', style: '—',        test: 'unknown', on: false, legacy: true },
  { name: 'gpt-4.1-mini',   tier: null,     tierSource: 'unset',  effort: null,   ctx: '1M',   inp: '$0.400', cache: '$0.100', out: '$1.60', style: '—',       test: 'unknown', on: false, legacy: true },
  { name: 'o3-deep-research', tier: null,   tierSource: 'unset',  effort: 'high', ctx: '200k', inp: '$10.0', cache: '$2.50',  out: '$40.0', style: 'responses', test: 'fail',   on: false }
]
const testIcon = {
  ok: '<i class="ri-check-line text-emerald-600 dark:text-emerald-400"></i>',
  fail: '<i class="ri-close-line text-destructive"></i>',
  unknown: '<i class="ri-subtract-line text-muted-foreground/50"></i>'
}

const modelRow = (m) => `
  <tr class="border-t border-border/60 transition-colors hover:bg-muted/50 ${m.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2">
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs">${m.name}</span>
        ${m.legacy ? pill('legacy', 'mute') : ''}
      </div>
    </td>
    <td class="px-2">${tierCell(m.tier, m.tierSource)}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.ctx}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums">${m.inp}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.cache}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums">${m.out}</td>
    <td class="px-2 font-mono text-[12px] text-muted-foreground">${m.style}</td>
    <td class="px-2">${effortCell(m.effort)}</td>
    <td class="px-2 text-center text-sm leading-none">${testIcon[m.test]}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">
      <span class="inline-flex h-4 w-7 items-center rounded-full ${m.on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5 align-middle">
        <span class="size-3 rounded-full bg-background ${m.on ? 'translate-x-3' : ''}"></span>
      </span>
    </td>
  </tr>`

const models = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-24"><col class="w-24"><col class="w-14"><col class="w-16"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Model', 'pl-6 pr-2', 'left', true, 'desc')}
        ${sortTh('Tier', 'px-2')}
        ${sortTh('Context', 'px-2', 'right')}
        ${sortTh('In /1M', 'px-2', 'right')}
        ${sortTh('Cached', 'px-2', 'right')}
        ${sortTh('Out /1M', 'px-2', 'right')}
        <th class="px-2 text-left font-medium">Shape</th>
        <th class="px-2 text-left font-medium">Effort</th>
        ${sortTh('Test', 'px-2', 'center')}
        ${sortTh('On', 'pl-2 pr-6', 'right')}
      </tr>
    </thead>
    <tbody>${MODELS.map(modelRow).join('')}</tbody>
  </table>`

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <div class="flex items-center gap-3 border-b border-border px-6 py-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold">OpenAI</h2>
            ${pill('api key', 'mute')}
            ${pill('live', 'ok')}
          </div>
          <p class="mt-0.5 font-mono text-[12px] text-muted-foreground">https://api.openai.com/v1/chat/completions</p>
        </div>
        <div class="ml-auto flex gap-2">
          ${btn('Test all', 'outline', 'ri-pulse-line')}
          ${btn('Sync models', 'ghost', 'ri-refresh-line')}
          ${btn('Remove', 'ghost', 'ri-delete-bin-line')}
        </div>
      </div>

      <div class="grid grid-cols-2 border-b border-border">
        <div class="border-r border-border">
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Credentials</h3>
          </div>
          <div class="space-y-3 px-6 pb-5">
            <div>
              <div class="mb-1 text-[12px] text-muted-foreground">API key</div>
              <div class="flex items-center gap-2">
                <div class="flex h-8 flex-1 items-center rounded-md border border-border px-3 font-mono text-xs">sk-proj-••••••••••••••••7fA2</div>
                ${btn('Reveal', 'ghost', 'ri-eye-line')}
              </div>
            </div>
            <div>
              <div class="mb-1 text-[12px] text-muted-foreground">Base URL</div>
              <div class="flex h-8 items-center rounded-md border border-border px-3 font-mono text-xs">https://api.openai.com/v1/chat/completions</div>
            </div>
            <p class="text-[12px] leading-relaxed text-muted-foreground">
              Supports <span class="font-mono">$VAR</span> interpolation — the key is read from the
              environment at boot rather than stored, if you prefer.
            </p>
            <p class="text-[12px] leading-relaxed text-muted-foreground">
              <span class="font-medium text-foreground">Outbound only.</span> This is what Rialto
              sends to OpenAI. It has nothing to do with the
              <a href="access-tokens.html" class="underline underline-offset-2">access tokens</a>
              that let your clients into Rialto.
            </p>
          </div>
        </div>

        <div>
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Request shape</h3>
          </div>
          <div class="px-6 pb-5">
            <div class="flex items-baseline gap-3 py-1.5">
              <span class="text-[12px] text-muted-foreground">API style</span>
              <span class="ml-auto font-mono text-[12px]">openai_chat</span>
            </div>
            <div class="flex items-baseline gap-3 py-1.5">
              <span class="text-[12px] text-muted-foreground">Auth</span>
              <span class="ml-auto font-mono text-[12px]">Bearer</span>
            </div>
            <div class="flex items-baseline gap-3 py-1.5">
              <span class="text-[12px] text-muted-foreground">Pipeline</span>
              <span class="ml-auto font-mono text-[12px]">openai</span>
            </div>
            <p class="mt-3 text-[12px] leading-relaxed text-muted-foreground">
              Derived from the API style — not configurable. Codex-family models here override to
              <span class="font-mono">openai_responses</span>; see the Shape column.
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <h3 class="text-sm font-semibold">Models</h3>
        <span class="text-[12px] text-muted-foreground">5 of 18 enabled</span>
        <div class="ml-auto flex items-center gap-2">
          <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60">
            <span class="text-muted-foreground">Show</span> Enabled + priced
            <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
          </button>
          <div class="flex h-7 w-44 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Filter models
          </div>
        </div>
      </div>
      ${models}
      <div class="px-6 pt-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Tier is per model. Rialto only infers it from a name that says a Claude family, and nothing
          here does — every tier above was typed. A model left at <span class="font-mono">—</span> is
          invisible to Routing's <span class="font-medium text-foreground">tier respect</span> floor:
          "never fall below sonnet" cannot hold a line against a target whose tier is unknown, so the
          chain will use it anyway.
          <span class="mt-1.5 block">
            <span class="font-medium text-foreground">Effort</span> is the same kind of override, for
            OpenAI / Responses / Codex models only. A dash sends nothing and lets the vendor pick;
            setting one injects <span class="font-mono">reasoning_effort</span> into every request.
            Not every model accepts every value — a rejected one comes back as a request error, not a
            validation message here.
          </span>
        </div>
      </div>
      <!-- Paged like every other long list, rather than a "show 10 more"
           that only ever grows. Revealing in steps means a 61-model
           vendor ends as one 61-row table with no way back up, and the
           button can never say where you are — this footer does both. -->
      ${pager({ first: 1, last: 8, total: 18, hasPrev: false })}
      <div class="h-6"></div>
  </div>`

renderShell({
  active: 'providers',
  sub: 'api-keys',
  navMode: 'cloudflare',
  crumbs: [{ label: 'API keys', href: 'providers-keys.html' }, 'OpenAI'],
  subtitle: 'API key · 5 of 18 models enabled',
  actions:
    btn('Refresh prices', 'ghost', 'ri-price-tag-3-line') +
    btn('Add provider', 'primary', 'ri-add-line', 'providers-connect.html')
})
</script>
</body>
</html>
