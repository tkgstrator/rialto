<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Provider (API key)</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, selectCell, effortCell, sortTh, pager, dialog, uiInput, uiSelectContent } = window.Shell

// The api_key half of Providers. Differs from the subscription detail in
// three ways that matter: a key field instead of accounts, real prices
// instead of "—", and a much longer model list that needs filtering.
//
// Same shape as provider-subscription.html — the two are one
// screen with two kinds of detail, and the rail is what says so.

// The page reads until Edit is pressed: effort pickers, the
// switches and Replace were live all the time, one stray click from
// changing which models callers can reach. `?edit` draws the state after Edit and
// `?remove` the confirmation Remove opens from there, so a reviewer sees all
// three without copies of the page. Declared first because the model table
// is rendered the moment it is defined.
const PARAMS = new URLSearchParams(location.search)
const REMOVING = PARAMS.has('remove')
const EDITING = REMOVING || PARAMS.has('edit')
// `?edit&shape` draws a Shape picker open, since the closed cell only says
// "—" and the option wording is what a reviewer has to approve.
const SHAPE_OPEN = PARAMS.has('shape')

// Controls that change the provider exist only while editing; they go
// invisible rather than absent where their absence would move the layout.
const editOnly = EDITING ? '' : 'invisible'
// Actions that reload the page or leave it would drop an unsaved edit, so
// they are locked until Save or Revert.
const lockedWhileEditing = EDITING ? 'pointer-events-none opacity-50' : ''
const withClass = (html, cls) => (cls === '' ? html : html.replace('class="', `class="${cls} `))

// A read-only override cell: the picker's own tone, without the chevron
// that says it opens.
const READ_TONE = { manual: 'bg-muted text-foreground', auto: 'text-muted-foreground', unset: 'text-muted-foreground/50' }
const readCell = (label, source) =>
  `<span class="inline-flex items-center rounded px-1.5 py-0.5 text-[12px] ${READ_TONE[source]}">${label}</span>`
const effortRead = (effort) => readCell(effort === null ? '—' : effort, effort === null ? 'unset' : 'manual')

// Shape is which OpenAI API a model's requests go to: Chat Completions or
// Responses. Unset follows the provider (its API style, openai_chat in the
// panel on the right), which is why the first option names what "default"
// currently means — a dash alone would not say.
//
// The cell is the effort picker's: value, chevron, the same three tones.
// Implemented as a shadcn Select whose trigger is styled to this chip, not
// as a bordered SelectTrigger — a bordered 130px control per row would turn
// a table you scan into a column of form fields. Only the list it opens is
// the component's own look (SelectContent).
const SHAPE_LABEL = { '—': '—', chat: 'Chat Completions', responses: 'Responses' }
const shapeCell = (style, open) => {
  const chip = selectCell(SHAPE_LABEL[style], style === '—' ? 'unset' : 'manual')
  if (!open) return chip
  // item-aligned, as the wrapper's default: the list opens over the cell
  // with the selected item on top of the trigger's text, so it is offset by
  // the list's padding and half an item's height rather than hung below.
  return `<span class="relative inline-block">${chip}<span class="absolute -top-[9px] -left-1.5 z-40 block w-max">${uiSelectContent([
    { label: 'Default (Chat Completions)', selected: style === '—' },
    { label: 'Chat Completions', selected: style === 'chat' },
    { label: 'Responses', selected: style === 'responses' }
  ])}</span></span>`
}

// The pill switch, a reading of the state until Edit is pressed.
const toggle = (on) => `
  <span class="inline-flex h-4 w-7 items-center rounded-full ${on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5 align-middle ${EDITING ? '' : 'opacity-50'}">
    <span class="size-3 rounded-full bg-background ${on ? 'translate-x-3' : ''}"></span>
  </span>`

// Prices are per 1M tokens, each in its own right-aligned column.
const MODELS = [
  { name: 'gpt-5.5',        effort: null,   ctx: '400k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: '—',        test: 'ok',      on: true },
  { name: 'gpt-5.4',        effort: null,   ctx: '400k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: '—',        test: 'ok',      on: true },
  { name: 'gpt-5.4-mini',   effort: 'low',  ctx: '400k', inp: '$0.250', cache: '$0.0250', out: '$2.00', style: '—',      test: 'ok',      on: true },
  { name: 'gpt-5.3-codex',  effort: 'high', ctx: '400k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: 'responses', test: 'ok',     on: true },
  { name: 'gpt-5.2',        effort: null,   ctx: '272k', inp: '$1.25', cache: '$0.125', out: '$10.0', style: '—',        test: 'ok',      on: true },
  { name: 'gpt-4.1',        effort: null,   ctx: '1M',   inp: '$2.00', cache: '$0.500', out: '$8.00', style: '—',        test: 'unknown', on: false, legacy: true },
  { name: 'gpt-4.1-mini',   effort: null,   ctx: '1M',   inp: '$0.400', cache: '$0.100', out: '$1.60', style: '—',       test: 'unknown', on: false, legacy: true },
  { name: 'o3-deep-research', effort: 'high', ctx: '200k', inp: '$10.0', cache: '$2.50',  out: '$40.0', style: 'responses', test: 'fail',   on: false }
]
const testIcon = {
  ok: '<i class="ri-check-line text-emerald-600 dark:text-emerald-400"></i>',
  fail: '<i class="ri-close-line text-destructive"></i>',
  unknown: '<i class="ri-subtract-line text-muted-foreground/50"></i>'
}

const modelRow = (m) => `
  <tr class="border-t border-border/60 transition-colors hover:bg-muted/50 ${m.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2">
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs">${m.name}</span>
        ${m.legacy ? pill('legacy', 'mute') : ''}
      </div>
    </td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.ctx}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums">${m.inp}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.cache}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums">${m.out}</td>
    <td class="px-2 ${EDITING ? '' : 'font-mono text-[12px] text-muted-foreground'}">${EDITING ? shapeCell(m.style, SHAPE_OPEN && m.name === 'gpt-5.4') : m.style}</td>
    <td class="px-2">${EDITING ? effortCell(m.effort) : effortRead(m.effort)}</td>
    <td class="px-2 text-center text-sm leading-none">${testIcon[m.test]}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">${toggle(m.on)}</td>
  </tr>`

const models = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-40"><col class="w-24"><col class="w-14"><col class="w-16"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Model', 'pl-6 pr-2', 'left', true, 'desc')}
        ${sortTh('Context', 'px-2', 'right')}
        ${sortTh('In /1M', 'px-2', 'right')}
        ${sortTh('Cached', 'px-2', 'right')}
        ${sortTh('Out /1M', 'px-2', 'right')}
        <th class="px-2 text-left font-medium">Shape</th>
        <th class="px-2 text-left font-medium">Effort</th>
        ${sortTh('Test', 'px-2', 'center')}
        ${sortTh('On', 'pl-2 pr-6', 'right')}
      </tr>
    </thead>
    <!-- "Enabled only" is the default: what this provider actually
         serves is the question the table is opened with. Everything else
         — priced-but-off models, and the legacy rows that are still
         priced and so rode along under "Enabled + priced" — is one click
         away under the wider slices. A legacy model that is switched ON
         still shows, because that is a live target and a list that hides
         one cannot be trusted to say what this provider serves. -->
    <tbody>${MODELS.filter((m) => m.on).map(modelRow).join('')}</tbody>
  </table>`

// Remove is irreversible, so it is red and it asks through a dialog that
// says what goes with it — the copy is the app's own confirmation.
const removeDialog = REMOVING
  ? dialog(
      'Remove OpenAI?',
      '<p class="text-xs leading-relaxed text-muted-foreground">This deletes its 18 models and the stored credential, There is no undo.</p>',
      `${btn('Cancel', 'ghost')}${btn('Remove', 'danger', 'ri-delete-bin-line')}`
    )
  : ''

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <div class="flex items-center gap-3 border-b border-border px-6 py-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold">OpenAI</h2>
            ${pill('api key', 'mute')}
            ${pill('live', 'ok')}
          </div>
          <p class="mt-0.5 font-mono text-[12px] text-muted-foreground">https://api.openai.com/v1/chat/completions</p>
        </div>
        <!-- Edit, then Revert / Save, for everything on this page that
             changes the provider: the provider switch, the key, the Base
             URL, and each model's shape, effort and switch.
             One Save writes them all.
             Remove only exists while editing, red, and still asks first.
             Test all is locked meanwhile, like the page actions above: its
             results reload the page, and an unsaved edit would go with it. -->
        <div class="ml-auto flex items-center gap-2">
          <span class="flex items-center gap-1.5 pr-1 text-[12px] text-muted-foreground">Routable ${toggle(true)}</span>
          ${withClass(btn('Test all', 'outline', 'ri-pulse-line'), lockedWhileEditing)}
          ${
            EDITING
              ? `${btn('Remove', 'danger', 'ri-delete-bin-line')}${btn('Revert', 'outline', 'ri-arrow-go-back-line')}${btn('Save', 'primary', 'ri-check-line')}`
              : btn('Edit', 'outline', 'ri-pencil-line')
          }
        </div>
      </div>

      <div class="grid grid-cols-2 border-b border-border">
        <div class="border-r border-border">
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Credentials</h3>
          </div>
          <div class="space-y-3 px-6 pb-5">
            <div>
              <div class="mb-1 text-[12px] text-muted-foreground">API key</div>
              <div class="flex items-center gap-2">
                <div class="flex h-8 flex-1 items-center rounded-md border border-border px-3 font-mono text-xs">sk-proj-••••••••••••••••7fA2</div>
                ${btn('Reveal', 'ghost', 'ri-eye-line')}
                ${withClass(btn('Replace', 'outline', 'ri-refresh-line'), editOnly)}
              </div>
            </div>
            <!-- Editable while the page is in Edit, like the key beside it,
                 and saved with the rest by the one Save. The note is there
                 in both states: it is also why a /responses URL is not a
                 mistake, and drawing it only in Edit would move everything
                 under it when Edit is pressed. -->
            <div>
              <div class="mb-1 text-[12px] text-muted-foreground">Base URL</div>
              ${
                EDITING
                  ? uiInput('https://api.openai.com/v1/chat/completions')
                  : '<div class="flex h-8 items-center rounded-md border border-border px-3 font-mono text-xs">https://api.openai.com/v1/chat/completions</div>'
              }
              <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
                Either <span class="font-mono">…/chat/completions</span> or
                <span class="font-mono">…/responses</span> works — each request goes to the one that
                matches the model's API.
              </p>
            </div>
            <p class="text-[12px] leading-relaxed text-muted-foreground">
              Supports <span class="font-mono">$VAR</span> interpolation — the key is read from the
              environment at boot rather than stored, if you prefer.
            </p>
            <p class="text-[12px] leading-relaxed text-muted-foreground">
              <span class="font-medium text-foreground">Outbound only.</span> This is what Rialto
              sends to OpenAI. It has nothing to do with the
              <a href="access-tokens.html" class="underline underline-offset-2">access tokens</a>
              that let your clients into Rialto.
            </p>
          </div>
        </div>

        <div>
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-sm font-semibold">Request shape</h3>
          </div>
          <div class="px-6 pb-5">
            <div class="flex items-baseline gap-3 py-1.5">
              <span class="text-[12px] text-muted-foreground">API style</span>
              <span class="ml-auto font-mono text-[12px]">openai_chat</span>
            </div>
            <div class="flex items-baseline gap-3 py-1.5">
              <span class="text-[12px] text-muted-foreground">Auth</span>
              <span class="ml-auto font-mono text-[12px]">Bearer</span>
            </div>
            <div class="flex items-baseline gap-3 py-1.5">
              <span class="text-[12px] text-muted-foreground">Pipeline</span>
              <span class="ml-auto font-mono text-[12px]">openai</span>
            </div>
            <p class="mt-3 text-[12px] leading-relaxed text-muted-foreground">
              The provider's default, derived from its API style. Each model can override it in the
              Shape column — Codex-family models here already use
              <span class="font-mono">openai_responses</span>.
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <h3 class="text-sm font-semibold">Models</h3>
        <span class="text-[12px] text-muted-foreground">5 of 18 enabled</span>
        <div class="ml-auto flex items-center gap-2">
          <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60">
            <span class="text-muted-foreground">Show</span> Enabled only
            <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
          </button>
          <div class="flex h-7 w-44 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Filter models
          </div>
        </div>
      </div>
      ${models}
      <div class="px-6 pt-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          A model that is switched off is left out of <span class="font-mono">/v1/models</span> and cannot
          be added to a plan.
          <span class="mt-1.5 block">
            <span class="font-medium text-foreground">Shape</span> picks which API a model's requests
            use, Chat Completions or Responses. A dash follows the provider's default; the Base URL may
            end in either.
          </span>
          <span class="mt-1.5 block">
            <span class="font-medium text-foreground">Effort</span> is the same kind of override, for
            OpenAI / Responses / Codex models only. A dash sends nothing and lets the vendor pick;
            setting one injects <span class="font-mono">reasoning_effort</span> into every request.
            Not every model accepts every value — a rejected one comes back as a request error, not a
            validation message here.
          </span>
        </div>
      </div>
      <!-- Paged like every other long list, rather than a "show 10 more"
           that only ever grows. Revealing in steps means a 61-model
           vendor ends as one 61-row table with no way back up, and the
           button can never say where you are — this footer does both. -->
      ${pager({ first: 1, last: 5, total: 5, hasPrev: false, hasNext: false })}
      <div class="h-6"></div>
      ${removeDialog}
  </div>`

renderShell({
  active: 'providers',
  sub: 'api-keys',
  navMode: 'cloudflare',
  crumbs: [{ label: 'API keys', href: 'providers-keys.html' }, 'OpenAI'],
  subtitle: 'API key · 5 of 18 models enabled',
  // One Refresh for the catalog this page reads — prices and the model
  // list — under one backdrop. It replaced "Refresh prices" here and "Sync
  // models" beside Test all, two halves of the same round trip. Both
  // actions are locked while an edit is open.
  actions:
    withClass(btn('Refresh', 'ghost', 'ri-refresh-line'), lockedWhileEditing) +
    withClass(btn('Add key', 'primary', 'ri-add-line', 'providers-connect.html'), lockedWhileEditing)
})
</script>
</body>
</html>
