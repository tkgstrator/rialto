<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Activity · Usage</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, mono, meter, surfacePill, navTo } = window.Shell

// Usage is the fourth Activity tab because that is where the pre-Rialto
// /usage screen was folded (NotFound's MERGED_INTO already says so) and
// the answer it gives is a time series, which the other three tabs are
// not shaped to hold.
//
// The split against Overview is deliberate and load-bearing: Overview
// answers "what is it right now" with the 5h/7d meters. This screen
// answers the two questions that need history or a breakdown — how the
// windows got here, and whose traffic did it.
const filter = (label, value) => `
  <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs transition-colors hover:bg-muted/60">
    <span class="text-muted-foreground">${label}</span>
    <span>${value}</span>
    <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
  </button>`

// ─── Subscription windows, right now ──────────────────────────────────
// Grouped by account rather than flattened, because "100%" means nothing
// without knowing which subscription is spent. The per-model weekly row
// is the one Overview's quota array drops on the floor — it is the reason
// this section exists rather than linking to Overview.
//
// Taken from GET /api/usage as it answers, not from a plausible-looking
// invention. Which matters here more than anywhere: this drew a
// `7-day · model / Opus` row, and there is no Opus window. Claude's wire
// shape carries `seven_day_opus` and `seven_day_sonnet` as legacy flat
// fields that come back null; the per-model windows that do exist arrive
// under `weeklyScoped`, and on this account that is Fable alone.
//
// A 5-hour window with no reset time is also real: the collector only
// learns `resetsAt` once the window has been touched, so a quiet account
// shows 0% and no clock rather than a made-up one.
const ACCOUNTS = [
  {
    name: 'Yuki Minakami', vendor: 'Claude Max 20x', tone: 'ok',
    windows: [
      { label: '5-hour',        scope: '',      pct: 0,   resets: '—' },
      { label: '7-day',         scope: '',      pct: 100, resets: '2d 09h' },
      { label: '7-day · model', scope: 'Fable', pct: 9,   resets: '2d 09h' }
    ]
  }
]

// Two per row once there is room. A window is a label, a bar and two
// numbers; given the whole width the bar became 800px of track carrying
// one figure, and the "resets in" column ended up a screen away from the
// percentage it qualifies. The grid folds at xl (1280px viewport, ~1050px
// of content) — below that a single column is already the right shape,
// and a half-width bar would be too short to read.
const windowRow = (w) => `
  <div ${navTo('provider-subscription.html')} class="flex items-center gap-3 border-t border-border/60 px-6 py-2.5 transition-colors hover:bg-muted/50">
    <span class="w-24 shrink-0 truncate text-xs">${w.label}</span>
    <span class="w-12 shrink-0">${w.scope ? mono(w.scope) : ''}</span>
    <div class="min-w-0 flex-1">${meter(w.pct)}</div>
    <span class="w-10 shrink-0 text-right font-mono text-xs tabular-nums">${w.pct}%</span>
    <span class="w-16 shrink-0 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${w.resets}</span>
  </div>`

const accountBlock = (a) => `
  <div class="min-w-0">
    <div class="flex items-baseline gap-2 px-6 pb-1">
      <span class="text-xs font-medium">${a.name}</span>
      ${pill(a.vendor, a.tone)}
      <span class="ml-auto pr-6 text-[12px] text-muted-foreground/70">resets in</span>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2">
      ${a.windows.map(windowRow).join('')}
    </div>
  </div>`

// ─── Utilization over time ────────────────────────────────────────────
// One measure (percent of a window) on one axis, three series — the only
// shape a second y-axis would ever be argued for, and the argument is
// wrong. Series colours are validated against both surfaces:
//   light #2563eb / #d97706 / #7c3aed   on #ffffff
//   dark  #3b82f6 / #d97706 / #8b5cf6   on #0a0a0a
// (worst adjacent CVD ΔE 32.3 light / 30.2 dark, every check PASS).
// Identity never rests on colour alone: the legend above the plot names
// every series.
const SERIES = [
  {
    id: '5h', label: '5-hour', stroke: 'text-blue-600 dark:text-blue-500',
    dot: 'bg-blue-600 dark:bg-blue-500',
    points: [1, 6, 0, 20, 5, 27, 28, 5, 5, 17, 19, 0, 1, 19, 61, 29, 29, 0, 0, 2, 44, 81, 0, 0, 0, 0, 0, 0]
  },
  {
    id: '7d', label: '7-day', stroke: 'text-amber-600 dark:text-amber-600',
    dot: 'bg-amber-600',
    points: [39, 40, 40, 44, 52, 56, 17, 24, 24, 28, 29, 29, 29, 47, 57, 64, 70, 74, 74, 74, 92, 100, 100, 100, 100, 100, 100, 100]
  },
  {
    id: 'fable', label: '7-day · Fable', stroke: 'text-violet-600 dark:text-violet-500',
    dot: 'bg-violet-600 dark:bg-violet-500',
    points: [11, 11, 11, 17, 29, 36, 0, 0, 0, 0, 0, 0, 0, 6, 8, 8, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9]
  }
]

const DAYS = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'now']

// Plot geometry in viewBox units. The SVG scales to the container; strokes
// are pinned with vector-effect so a wide viewport does not fatten them.
// PAD_R is half a day-label wide, not the 96 the end labels used to
// need: the last tick is centred on the right edge of the plot, so "now"
// runs off without it.
const W = 1080, H = 200, PAD_L = 34, PAD_R = 28, PAD_T = 12, PAD_B = 24
const px = (i, n) => PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R)
const py = (v) => PAD_T + (1 - v / 100) * (H - PAD_T - PAD_B)

// Axis labels sit in viewBox units and scale with the SVG, so the size
// here is not the size on screen: the plot is 1080 wide and renders at
// roughly 1170, so 11 lands on the 12px floor the rest of these screens
// use. They were 9, which arrived under 10 and was the smallest text in
// the app.
const AXIS_TEXT = 'text-[11px]'

const gridline = (v) => `
  <line x1="${PAD_L}" y1="${py(v)}" x2="${W - PAD_R}" y2="${py(v)}"
        class="stroke-border" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <text x="${PAD_L - 8}" y="${py(v) + 4}" text-anchor="end"
        class="fill-muted-foreground ${AXIS_TEXT}">${v}%</text>`

const dayLabel = (d, i) => `
  <text x="${px(i * 4, 28)}" y="${H - 6}" text-anchor="middle"
        class="fill-muted-foreground ${AXIS_TEXT}">${d}</text>`

// No label at the line's end. The legend above already names every
// series, and with five of them the end labels collided with each other
// and with the plot — and the 96 units of right padding they needed were
// coming out of the chart, which is the part carrying the information.
const line = (s) => {
  const d = s.points.map((p, i) => `${px(i, s.points.length)},${py(p)}`).join(' ')
  const last = s.points[s.points.length - 1]
  return `
    <polyline points="${d}" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"
              class="${s.stroke}" vector-effect="non-scaling-stroke"/>
    <circle cx="${px(s.points.length - 1, s.points.length)}" cy="${py(last)}" r="3"
            class="fill-current ${s.stroke}"/>`
}

// Crosshair + readout, drawn at one sample so the static mock carries the
// hover contract the implementation has to honour rather than leaving it
// to be discovered later. The sample it names is the real one: index 15 of
// a series running 2026-09-03T17:20Z → 2026-09-10T05:55Z lands on Monday
// morning, so the readout says Mon, not a time picked to look plausible.
const CROSS_I = 15
const crosshair = `
  <line x1="${px(CROSS_I, 28)}" y1="${PAD_T}" x2="${px(CROSS_I, 28)}" y2="${H - PAD_B}"
        class="stroke-border" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
  ${SERIES.map((s) => `<circle cx="${px(CROSS_I, 28)}" cy="${py(s.points[CROSS_I])}" r="3.5"
        class="fill-current ${s.stroke}" stroke="var(--background)" stroke-width="2"/>`).join('')}`

const tooltip = `
  <div class="pointer-events-none absolute left-[46%] top-6 w-44 rounded-md border border-border bg-background px-3 py-2 shadow-sm">
    <div class="text-[12px] text-muted-foreground">Mon 07:00</div>
    ${SERIES.map((s) => `
      <div class="mt-1 flex items-center gap-2">
        <span class="h-1.5 w-1.5 shrink-0 rounded-full ${s.dot}"></span>
        <span class="text-[12px]">${s.label}</span>
        <span class="ml-auto font-mono text-[12px] tabular-nums">${s.points[CROSS_I]}%</span>
      </div>`).join('')}
  </div>`

const legend = `
  <div class="flex items-center gap-4 px-6 pb-3">
    ${SERIES.map((s) => `
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground">
        <span class="h-1.5 w-4 rounded-full ${s.dot}"></span>${s.label}
      </span>`).join('')}
    <span class="ml-auto text-[12px] text-muted-foreground/70">sampled every 5 min · captured off real traffic</span>
  </div>`

const chart = `
  ${legend}
  <div class="relative px-6 pb-5">
    <svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:200px">
      ${[0, 25, 50, 75, 100].map(gridline).join('')}
      ${DAYS.map(dayLabel).join('')}
      ${crosshair}
      ${SERIES.map(line).join('')}
    </svg>
    ${tooltip}
  </div>`

// ─── By access token ──────────────────────────────────────────────────
// The same numbers Settings → Access shows beside each credential, which
// is where an operator asking "what is this costing me" does not think to
// look. There they are decision support for Revoke; here they are the
// answer to the question the screen is named after.
// From GET /api/access-tokens. `cost: '—'` is not a placeholder: a token
// whose requests were all served by a subscription provider has no dollar
// figure to show, and `count-tokens-verify` genuinely spent nothing.
// A token with no surface scope answers on every one of them, which is
// why the Endpoint cell can be empty.
const TOKENS = [
  { name: 'laptop (Claude Code)', prefix: 'rialto_06f0b5', surface: '',                      reqs: '1,284', cost: '$13.40', share: 33, used: '2d ago' },
  { name: 'old laptop',           prefix: 'rialto_d0a856', surface: '',                      reqs: '903',   cost: '—',      share: 0,  used: 'revoked' },
  { name: 'codex-cli',            prefix: 'rialto_4d540e', surface: '/v1/responses',         reqs: '738',   cost: '$3.50',  share: 9,  used: '2d ago' },
  { name: 'ci-pipeline',          prefix: 'rialto_ecfd82', surface: '/v1/chat/completions',  reqs: '412',   cost: '$13.59', share: 33, used: '2d ago' },
  { name: 'scratch script',       prefix: 'rialto_7f4740', surface: '',                      reqs: '27',    cost: '$11.00', share: 27, used: '2d ago' },
  { name: 'count-tokens-verify',  prefix: 'rialto_0d1c9b', surface: '',                      reqs: '3',     cost: '—',      share: 0,  used: '9d ago' }
]

const tokenRow = (t) => `
  <tr ${navTo('activity-requests.html')} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-3">
      <div class="text-xs font-medium">${t.name}</div>
      <div class="font-mono text-[12px] text-muted-foreground">${t.prefix}</div>
    </td>
    <td class="px-3">${surfacePill(t.surface)}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${t.reqs}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${t.cost}</td>
    <td class="px-3">
      <div class="flex items-center gap-2">
        ${meter(t.share, 'mute')}
        <span class="w-8 shrink-0 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${t.share}%</span>
      </div>
    </td>
    <td class="py-2.5 pl-3 pr-6 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${t.used}</td>
  </tr>`

const tokenTable = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-40"><col class="w-24"><col class="w-24"><col class="w-40"><col class="w-28"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-3 text-left font-medium">Token</th>
        <th class="px-3 text-left font-medium">Endpoint</th>
        <th class="px-3 text-right font-medium">Requests</th>
        <th class="px-3 text-right font-medium">Cost 30d</th>
        <th class="px-3 text-left font-medium">Share of spend</th>
        <th class="whitespace-nowrap pl-3 pr-6 text-right font-medium">Last used</th>
      </tr>
    </thead>
    <tbody>${TOKENS.map(tokenRow).join('')}</tbody>
  </table>`

// ─── Page ─────────────────────────────────────────────────────────────
const sectionHead = (title, meta, action = '') => `
  <div class="flex items-baseline gap-3 border-t border-border px-6 pt-6 pb-3">
    <h2 class="text-sm font-semibold">${title}</h2>
    <span class="text-xs text-muted-foreground/70">${meta}</span>
    ${action ? `<div class="ml-auto">${action}</div>` : ''}
  </div>`

document.getElementById('root').innerHTML = `

  <div class="flex flex-wrap items-center gap-2 border-b border-border px-6 py-3">
    ${filter('Range', '7 days')}
    <p class="ml-auto max-w-md text-right text-[12px] leading-snug text-muted-foreground">
      Overview shows where the windows stand now. This is how they got there, and whose traffic did it.
    </p>
  </div>

  ${sectionHead('Subscription windows', 'live, from each vendor’s usage API')}
  <div class="pb-2">${ACCOUNTS.map(accountBlock).join('')}</div>

  ${sectionHead('Utilization', 'last 7 days', btn('Export CSV', 'ghost', 'ri-download-line'))}
  ${chart}

  ${sectionHead('By access token', 'last 30 days', btn('Manage tokens', 'ghost', 'ri-key-2-line', 'settings-access.html'))}
  ${tokenTable}
  <div class="h-10"></div>`

renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'usage',
  crumbs: ['Usage'],
  subtitle: '1 subscription account · last 7 days',
  actions: btn('Refresh', 'outline', 'ri-refresh-line')
})
</script>
</body>
</html>
