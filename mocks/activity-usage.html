<script>
const { renderShell, pill, btn, mono, meter, surfacePill, navTo } = window.Shell

// Usage is the fourth Activity tab because that is where the pre-Rialto
// /usage screen was folded (NotFound's MERGED_INTO already says so) and
// the answer it gives is a time series, which the other three tabs are
// not shaped to hold.
//
// The split against Overview is deliberate and load-bearing: Overview
// answers "what is it right now" with the 5h/7d meters. This screen
// answers the two questions that need history or a breakdown — how the
// windows got here, and whose traffic did it.
const filter = (label, value) => `
  <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs transition-colors hover:bg-muted/60">
    <span class="text-muted-foreground">${label}</span>
    <span>${value}</span>
    <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
  </button>`

// ─── Subscription windows, right now ──────────────────────────────────
// Grouped by provider first, then by account. Flattened into one grid, a
// Claude account and a Codex account shared a row with nothing on either
// saying which vendor it was, and "5-hour 88%" reads the same under both.
// The provider heading says whose limit this is; the account under it says
// which seat. The per-model weekly row is the one Overview's quota array
// drops on the floor — it is the reason this section exists rather than
// linking to Overview.
//
// The plan pill carries the multiplier, because the multiplier is the
// plan. Claude "Max" is two plans (5x and 20x), and so is Codex "Pro" since
// OpenAI split it; a 20x at 60% has four times the headroom of a 5x at 60%,
// so a pill that cannot tell them apart makes every meter under it
// unreadable. Claude names the level in `rate_limit_tier`
// (`default_claude_max_20x`) and only "max" in the plan; Codex names it in
// `plan_type` itself — `prolite` is Pro 5x, `pro` is Pro 20x. The base
// plans (Claude Pro, Codex Plus) have no multiplier to show. No vendor in
// the pill: the heading above already says it.
//
// Codex windows are named by their length, not by the wire's primary /
// secondary. Both vendors publish a 5-hour and a 7-day window
// (`windowSeconds` says which is which), and naming one pair by duration
// and the other by rank made the same two limits look like different ones.
//
// Taken from GET /api/usage as it answers, not from a plausible-looking
// invention. Which matters here more than anywhere: this drew a
// `7-day · model / Opus` row, and there is no Opus window. Claude's wire
// shape carries `seven_day_opus` and `seven_day_sonnet` as legacy flat
// fields that come back null; the per-model windows that do exist arrive
// under `weeklyScoped`, and on this account that is Fable alone.
//
// A 5-hour window with no reset time is also real: the collector only
// learns `resetsAt` once the window has been touched, so a quiet account
// shows 0% and no clock rather than a made-up one.
//
// The first account in each group is this install's: Yuki Minakami on
// `claude_max` / `default_claude_max_20x`, and the Codex seat
// `db:seed:demo` writes, on `codex_pro`. The others are invented so each
// group has something to fold — but only their numbers are: every window
// and every plan is one the vendors actually send. Codex has no per-model
// row, because `mapCodexToQuota` has no per-model windows to write.
const PROVIDERS = [
  {
    label: 'Claude Code', id: 'claude-code', icon: 'ri-sparkling-line',
    accounts: [
      {
        name: 'Yuki Minakami', plan: 'Max 20x',
        windows: [
          { label: '5-hour',        scope: '',      pct: 0,   resets: '—', pace: null },
          { label: '7-day',         scope: '',      pct: 100, resets: '1d 23h', pace: 139 },
          { label: '7-day · model', scope: 'Fable', pct: 9,   resets: '1d 23h', pace: 13 }
        ],
        usage: { weekTokens: '61.4M', weekCost: '$684', monthCost: '$2.20k', fee: '$200', ratio: '×11' }
      },
      {
        name: 'ops@example.com', plan: 'Max 5x',
        windows: [
          { label: '5-hour',        scope: '',      pct: 34, resets: '2h 41m', pace: 73 },
          { label: '7-day',         scope: '',      pct: 62, resets: '4d 02h', pace: 148 },
          { label: '7-day · model', scope: 'Fable', pct: 18, resets: '4d 02h', pace: 43 }
        ],
        usage: { weekTokens: '18.9M', weekCost: '$204', monthCost: '$612', fee: '$100', ratio: '×6.1' }
      },
      {
        name: 'nightly@example.com', plan: 'Pro',
        windows: [
          { label: '5-hour', scope: '', pct: 7,  resets: '3h 18m', pace: 21 },

        ],
        usage: { weekTokens: '2.04M', weekCost: '$18.7', monthCost: '$61.0', fee: '$20', ratio: '×3.1' }
      }
    ]
  },
  {
    label: 'Codex', id: 'codex', icon: 'ri-terminal-line',
    accounts: [
      {
        name: 'Demo Operator', plan: 'Pro 20x',
        windows: [
          { label: '5-hour', scope: '', pct: 92, resets: '46m', pace: 109 },
          { label: '7-day',  scope: '', pct: 65, resets: '1d 20h', pace: 88 }
        ],

      },

        name: 'ci@example.com', plan: 'Pro 5x',

          { label: '5-hour', scope: '', pct: 22, resets: '3h 05m', pace: 58 },

]

const windowRow = (w) => `
  <div class="border-t border-border/60 px-6 py-2.5 transition-colors hover:bg-muted/50">
    <div class="flex items-center gap-2">
      <span class="w-20 shrink-0 truncate text-xs">${w.label}</span>
      <span class="w-10 shrink-0 truncate font-mono text-[12px] text-muted-foreground">${w.scope}</span>
      <div class="min-w-0 flex-1">${meter(w.pct)}</div>
      <span class="w-10 shrink-0 text-right font-mono text-xs tabular-nums">${w.pct}%</span>
      <span class="w-16 shrink-0 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${w.resets}</span>
    </div>
    <div class="mt-1 text-right text-[12px] tabular-nums ${w.pace !== null && w.pace >= 100 ? 'text-destructive' : 'text-muted-foreground'}">${w.pace === null ? 'Pace unknown' : `Projected ${w.pace}% · ${w.pace >= 100 ? 'limit likely' : 'on track'}`}</div>
  </div>`

// What the account carried, at the models' API prices — "API equiv",
// never a bill — the same block a subscription provider's page draws under
// each account: this week's tokens and cost, then 30 days' cost against the
// plan fee and the ratio of the two. Rows in the windows' own rhythm, so
// the two read as one small table. One figure per cell.
const usageRow = (label, cells) => `
  <div class="flex items-center gap-3 border-t border-border/60 px-6 py-2.5 transition-colors hover:bg-muted/50">
    <span class="w-24 shrink-0 truncate text-xs">${label}</span>
    <span class="min-w-0 flex-1"></span>
    ${cells.map((c) => `<span class="${c.w} shrink-0 text-right font-mono text-[12px] tabular-nums ${c.mute ? 'text-muted-foreground' : ''}">${c.v}</span>`).join('')}
  </div>`

const usageBlock = (u) => `
  <div class="flex items-center gap-3 border-t border-border/60 px-6 pt-2.5 pb-1.5 text-[12px] uppercase tracking-wider text-muted-foreground/60">
    <span class="w-24 shrink-0">API equiv</span>
    <span class="min-w-0 flex-1"></span>
    <span class="w-16 shrink-0 text-right">tokens</span>
    <span class="w-14 shrink-0 text-right">cost</span>
    <span class="w-12 shrink-0 text-right">fee</span>
    <span class="w-10 shrink-0 text-right">×</span>
  </div>
  ${usageRow('this week', [
    { v: u.weekTokens, w: 'w-16' },
    { v: u.weekCost, w: 'w-14' },
    { v: '', w: 'w-12' },
    { v: '', w: 'w-10' }
  ])}
  ${usageRow('30 days', [
    { v: '', w: 'w-16' },
    { v: u.monthCost, w: 'w-14' },
    { v: u.fee, w: 'w-12', mute: true },
    { v: u.ratio, w: 'w-10' }
  ])}`

const accountBlock = (a) => `
  <div class="min-w-0">
    <div class="flex items-baseline gap-2 px-6 pb-1">
      <span class="text-xs font-medium">${a.name}</span>
      ${pill(a.plan, 'info')}
      <span class="ml-auto text-[12px] text-muted-foreground/70">resets in</span>
    </div>
    ${a.windows.map(windowRow).join('')}
    ${usageBlock(a.usage)}
  </div>`

// The heading names the provider by the label the Providers list leads
// with, and the row name beside it: nothing stops two subscription
// providers on the same vendor, and the label alone would not tell them
// apart. A hairline between groups, none above the first: the section
// head already draws one.
const providerGroup = (p) => `
  <div class="@container border-t border-border/60 pt-3 first:border-t-0 first:pt-0">
    <div class="flex items-center gap-2 px-6 pb-2">
      <i class="${p.icon} text-sm leading-none text-muted-foreground"></i>
      <span class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">${p.label}</span>
      ${mono(p.id)}
      <span class="text-[12px] text-muted-foreground/70">${p.accounts.length} account${p.accounts.length === 1 ? '' : 's'}</span>
    </div>
    <div class="grid grid-cols-1 gap-x-px pb-3 @min-[56rem]:grid-cols-2 @min-[84rem]:grid-cols-3">
      ${p.accounts.map(accountBlock).join('')}
    </div>
  </div>`

// ─── Projected quota pace over time ───────────────────────────────────
// One measure (projected use at reset) on one axis, three series — the only
// shape a second y-axis would ever be argued for, and the argument is
// wrong. Series colours are validated against both surfaces:
//   light #2563eb / #d97706 / #7c3aed   on #ffffff
//   dark  #3b82f6 / #d97706 / #8b5cf6   on #0a0a0a
// (worst adjacent CVD ΔE 32.3 light / 30.2 dark, every check PASS).
// Identity never rests on colour alone: the legend above the plot names
// every series.
const SERIES = [
  {
    id: '5h', label: '5-hour', stroke: 'text-blue-600 dark:text-blue-500',
    dot: 'bg-blue-600 dark:bg-blue-500',
    points: [8, 12, 5, 28, 13, 40, 32, 9, 10, 24, 29, 5, 7, 30, 76, 42, 38, 6, 4, 9, 63, 112, 14, 8, 5, 4, 3, 2]
  },
  {
    id: '7d', label: '7-day', stroke: 'text-amber-600 dark:text-amber-600',
    dot: 'bg-amber-600',
    points: [55, 57, 56, 62, 74, 78, 28, 38, 41, 44, 48, 50, 51, 69, 78, 86, 95, 101, 103, 106, 123, 140, 138, 135, 132, 130, 127, 125]
  },
  {
    id: 'fable', label: '7-day · Fable', stroke: 'text-violet-600 dark:text-violet-500',
    dot: 'bg-violet-600 dark:bg-violet-500',
    points: [16, 17, 17, 20, 35, 42, 0, 0, 0, 0, 0, 0, 0, 8, 10, 11, 12, 12, 13, 13, 14, 14, 14, 14, 14, 14, 14, 13]
  }
]

const DAYS = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'now']

// Plot geometry in viewBox units. The SVG scales to the container; strokes
// are pinned with vector-effect so a wide viewport does not fatten them.
// PAD_R is half a day-label wide, not the 96 the end labels used to
// need: the last tick is centred on the right edge of the plot, so "now"
// runs off without it.
const W = 1080, H = 200, PAD_L = 34, PAD_R = 28, PAD_T = 12, PAD_B = 24
const px = (i, n) => PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R)
const py = (v) => PAD_T + (1 - v / 150) * (H - PAD_T - PAD_B)

// Axis labels sit in viewBox units and scale with the SVG, so the size
// here is not the size on screen: the plot is 1080 wide and renders at
// roughly 1170, so 11 lands on the 12px floor the rest of these screens
// use. They were 9, which arrived under 10 and was the smallest text in
// the app.
const AXIS_TEXT = 'text-[11px]'

const gridline = (v) => `
  <line x1="${PAD_L}" y1="${py(v)}" x2="${W - PAD_R}" y2="${py(v)}"
        class="stroke-border" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <text x="${PAD_L - 8}" y="${py(v) + 4}" text-anchor="end"
        class="fill-muted-foreground ${AXIS_TEXT}">${v}%</text>`

const dayLabel = (d, i) => `
  <text x="${px(i * 4, 28)}" y="${H - 6}" text-anchor="middle"
        class="fill-muted-foreground ${AXIS_TEXT}">${d}</text>`

// No label at the line's end. The legend above already names every
// series, and with five of them the end labels collided with each other
// and with the plot — and the 96 units of right padding they needed were
// coming out of the chart, which is the part carrying the information.
const line = (s) => {
  const d = s.points.map((p, i) => `${px(i, s.points.length)},${py(p)}`).join(' ')
  const last = s.points[s.points.length - 1]
  return `
    <polyline points="${d}" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"
              class="${s.stroke}" vector-effect="non-scaling-stroke"/>
    <circle cx="${px(s.points.length - 1, s.points.length)}" cy="${py(last)}" r="3"
            class="fill-current ${s.stroke}"/>`
}

// Crosshair + readout, drawn at one sample so the static mock carries the
// hover contract the implementation has to honour rather than leaving it
// to be discovered later. The sample it names is the real one: index 15 of
// a series running 2026-09-03T17:20Z → 2026-09-10T05:55Z lands on Monday
// morning, so the readout says Mon, not a time picked to look plausible.
const CROSS_I = 15
const crosshair = `
  <line x1="${px(CROSS_I, 28)}" y1="${PAD_T}" x2="${px(CROSS_I, 28)}" y2="${H - PAD_B}"
        class="stroke-border" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
  ${SERIES.map((s) => `<circle cx="${px(CROSS_I, 28)}" cy="${py(s.points[CROSS_I])}" r="3.5"
        class="fill-current ${s.stroke}" stroke="var(--background)" stroke-width="2"/>`).join('')}`

const tooltip = `
  <div class="pointer-events-none absolute left-[46%] top-6 w-44 rounded-md border border-border bg-background px-3 py-2 shadow-sm">
    <div class="text-[12px] text-muted-foreground">Mon 07:00</div>
    ${SERIES.map((s) => `
      <div class="mt-1 flex items-center gap-2">
        <span class="h-1.5 w-1.5 shrink-0 rounded-full ${s.dot}"></span>
        <span class="text-[12px]">${s.label}</span>
        <span class="ml-auto font-mono text-[12px] tabular-nums">${s.points[CROSS_I]}%</span>
      </div>`).join('')}
  </div>`

// No note on how the samples were taken. The legend names the series;
// the sampling rate is the collector's business, not the reader's.
const legend = `
  <div class="flex items-center gap-4 px-6 pb-3">
    ${SERIES.map((s) => `
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground">
        <span class="h-1.5 w-4 rounded-full ${s.dot}"></span>${s.label}
      </span>`).join('')}
  </div>`

const chart = `
  ${legend}
  <div class="relative px-6 pb-5">
    <svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:200px">
      ${[0, 25, 50, 75, 100, 125, 150].map(gridline).join('')}
      <line x1="${PAD_L}" y1="${py(100)}" x2="${W - PAD_R}" y2="${py(100)}"
            class="stroke-destructive" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      ${DAYS.map(dayLabel).join('')}
      ${crosshair}
      ${SERIES.map(line).join('')}
    </svg>
    ${tooltip}
  </div>`

// ─── By access token ──────────────────────────────────────────────────
// The same numbers Settings → Access shows beside each credential, which
// is where an operator asking "what is this costing me" does not think to
// look. There they are decision support for Revoke; here they are the
// answer to the question the screen is named after.
// From GET /api/access-tokens. `cost: '—'` is not a placeholder: a token
// whose requests were all served by a subscription provider has no dollar
// figure to show, and `count-tokens-verify` genuinely spent nothing.
// A token with no surface scope answers on every one of them, which is
// why the Endpoint cell can be empty.
// The last line is not a token: revoking deletes one, so every revoked
// token's traffic in the window is summed into a single line at the
// bottom. Without it the survivors' shares would add up to more than was
// spent.
const TOKENS = [
  { name: 'laptop (Claude Code)', prefix: 'rialto_06f0b5', surface: '',                      reqs: '1,284', cost: '$13.40', share: 33, used: '2d ago' },
  { name: 'codex-cli',            prefix: 'rialto_4d540e', surface: '/v1/responses',         reqs: '738',   cost: '$3.50',  share: 9,  used: '2d ago' },
  { name: 'ci-pipeline',          prefix: 'rialto_ecfd82', surface: '/v1/chat/completions',  reqs: '412',   cost: '$13.59', share: 33, used: '2d ago' },
  { name: 'scratch script',       prefix: 'rialto_7f4740', surface: '',                      reqs: '27',    cost: '$11.00', share: 27, used: '2d ago' },
  { name: 'count-tokens-verify',  prefix: 'rialto_0d1c9b', surface: '',                      reqs: '3',     cost: '—',      share: 0,  used: '9d ago' },
  { revoked: true, reqs: '903', cost: '—', share: 0 }
]

const tokenRow = (t) => `
  <tr ${navTo('activity-requests.html')} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-3">${
      t.revoked
        ? `<div class="text-xs font-medium text-muted-foreground">Revoked tokens</div>
      <div class="text-[12px] text-muted-foreground">traffic from tokens since revoked</div>`
        : `<div class="text-xs font-medium">${t.name}</div>
      <div class="font-mono text-[12px] text-muted-foreground">${t.prefix}</div>`
    }
    </td>
    <td class="px-3">${t.revoked ? '<span class="text-[12px] text-muted-foreground">–</span>' : surfacePill(t.surface)}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${t.reqs}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${t.cost}</td>
    <td class="px-3">
      <div class="flex items-center gap-2">
        ${meter(t.share, 'mute')}
        <span class="w-8 shrink-0 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${t.share}%</span>
      </div>
    </td>
    <td class="py-2.5 pl-3 pr-6 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${t.revoked ? '–' : t.used}</td>
  </tr>`

const tokenTable = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-40"><col class="w-24"><col class="w-24"><col class="w-40"><col class="w-28"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-3 text-left font-medium">Token</th>
        <th class="px-3 text-left font-medium">Endpoint</th>
        <th class="px-3 text-right font-medium">Requests</th>
        <th class="px-3 text-right font-medium">Cost 30d</th>
        <th class="px-3 text-left font-medium">Share of spend</th>
        <th class="whitespace-nowrap pl-3 pr-6 text-right font-medium">Last used</th>
      </tr>
    </thead>
    <tbody>${TOKENS.map(tokenRow).join('')}</tbody>
  </table>`

// ─── API keys, over the same range ────────────────────────────────────
// The other half of "what is it costing": the windows above are the
// subscriptions, and say nothing about a request that went to a provider
// paid by the token. Until this section, that traffic showed up nowhere on
// the screen — only, summed into one dollar figure per access token, in the
// table at the bottom, with no way to see which provider or model it was.
//
// Deliberately NOT here: meters, resets, pace. An API key has no window to
// run out of, so a 5h/7d row for it would be drawn from nothing; the one
// number that answers "is this getting out of hand" is spend, so spend is
// what the bar shows (share of the total, the way "By access token" does).
//
// Data is GET /api/usage/cost?days=N as it answers — one entry per provider
// that carried traffic in the window, each with its models — kept to the
// rows whose `isSubscription` is false. `totalCostUsd` is null for a model
// whose price has not been fetched, and a provider's total is the sum of the
// models that DO have one, null only when none does. That last rule is why
// the table has three kinds of cost cell:
//   Anthropic  one model unpriced → the total is a floor, drawn "≥ $42.7"
//   OpenAI     everything priced  → a plain figure
//   Google     nothing priced     → "—", no share, and it stays out of the total
// A bare "$42.7" over a model that cost more than that would be a number
// that looks complete and is not.
//
// Rows are ordered by spend, unpriced last, so the first row is the one to
// open. Input is the fresh (uncached) tokens, Cache is read + written; the
// two add up to what the model was sent, which is how the totals above and
// on Sessions are counted too. Splitting read from write would be a sixth
// number column for a distinction the Requests screen already carries.
const API_DAYS = 7
const API_PROVIDERS = [
  {
    id: 'anthropic', name: 'Anthropic',
    models: [
      { model: 'claude-sonnet-5',  requestCount: 538,   inputTokens: 1950000, outputTokens: 640000,  cacheReadTokens: 22400000, cacheWriteTokens: 3100000, totalCostUsd: 33.8 },
      { model: 'claude-haiku-4-5', requestCount: 1214,  inputTokens: 2400000, outputTokens: 880000,  cacheReadTokens: 9600000,  cacheWriteTokens: 900000,  totalCostUsd: 8.885 },
      { model: 'claude-mythos-5',  requestCount: 41,    inputTokens: 188000,  outputTokens: 52000,   cacheReadTokens: 0,        cacheWriteTokens: 0,       totalCostUsd: null }
    ]
  },
  {
    id: 'openai', name: 'OpenAI',
    models: [
      { model: 'gpt-5.5',       requestCount: 412,  inputTokens: 3804220, outputTokens: 512340,  cacheReadTokens: 14210000, cacheWriteTokens: 0, totalCostUsd: 11.65 },
      { model: 'gpt-5.4-mini',  requestCount: 1903, inputTokens: 6100000, outputTokens: 1210000, cacheReadTokens: 20100000, cacheWriteTokens: 0, totalCostUsd: 4.45 },
      { model: 'gpt-5.3-codex', requestCount: 96,   inputTokens: 1120000, outputTokens: 301000,  cacheReadTokens: 4800000,  cacheWriteTokens: 0, totalCostUsd: 5.01 }
    ]
  },
  {
    id: 'google', name: 'Google',
    models: [
      { model: 'gemini-3-flash',      requestCount: 305, inputTokens: 1420000, outputTokens: 260000, cacheReadTokens: 0, cacheWriteTokens: 0, totalCostUsd: null },
      { model: 'gemini-3-flash-lite', requestCount: 64,  inputTokens: 410000,  outputTokens: 88000,  cacheReadTokens: 0, cacheWriteTokens: 0, totalCostUsd: null }
    ]
  }
]

// The same formatters the app uses: fmtCount for token and request counts,
// fmtCost's three significant figures for money. Written out here because
// a static page has no import; the figures are computed from the rows above
// rather than typed, so the totals and shares cannot disagree with them.
const fmtN = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : String(n))
const USD = new Intl.NumberFormat('en-US', { minimumSignificantDigits: 3, maximumSignificantDigits: 3 })
const fmtUsd = (usd) => `$${USD.format(usd)}`
const sum = (rows, key) => rows.reduce((a, r) => a + r[key], 0)
const pricedSum = (rows) => {
  const priced = rows.filter((r) => r.totalCostUsd !== null)
  return priced.length === 0 ? null : priced.reduce((a, r) => a + r.totalCostUsd, 0)
}
const rowOf = (name, rows, extra = {}) => ({
  name,
  requestCount: sum(rows, 'requestCount'),
  inputTokens: sum(rows, 'inputTokens'),
  outputTokens: sum(rows, 'outputTokens'),
  cacheTokens: sum(rows, 'cacheReadTokens') + sum(rows, 'cacheWriteTokens'),
  totalCostUsd: pricedSum(rows),
  // Some models cost nothing we can see: the figure is a floor.
  partial: rows.some((r) => r.totalCostUsd === null) && pricedSum(rows) !== null,
  ...extra
})
const API_ROWS = API_PROVIDERS.map((p) =>
  rowOf(p.name, p.models, {
    id: p.id,
    models: p.models.map((m) => rowOf(m.model, [m], { partial: false }))
  })
).sort((a, b) => (b.totalCostUsd ?? -1) - (a.totalCostUsd ?? -1))
const API_TOTAL = rowOf('Total', API_PROVIDERS.flatMap((p) => p.models))
const shareOf = (usd) => (usd === null ? null : Math.round((usd / API_TOTAL.totalCostUsd) * 100))

const ukey = (cls = '') => `font-mono tabular-nums ${cls}`
const apiCost = (r) =>
  r.totalCostUsd === null
    ? '<span class="text-muted-foreground/50" title="No price for this yet">—</span>'
    : `${r.partial ? '<span class="mr-1 text-muted-foreground" title="At least this much: a model here has no price yet">≥</span>' : ''}${fmtUsd(r.totalCostUsd)}`
const apiShare = (r) => {
  const pct = shareOf(r.totalCostUsd)
  return `
    <div class="flex items-center gap-2">
      ${meter(pct === null ? 0 : pct, 'mute')}
      <span class="w-8 shrink-0 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${pct === null ? '–' : `${pct}%`}</span>
    </div>`
}

// Open/closed is the only state a row has. The first row starts open so a
// reader sees what is under it without having to guess it opens.
const chevron = (open) =>
  `<i data-api-chevron class="${open ? 'ri-arrow-down-s-line' : 'ri-arrow-right-s-line'} shrink-0 text-base leading-none text-muted-foreground/60"></i>`

const apiProviderRow = (r, open) => `
  <tr data-api-toggle="${r.id}" aria-expanded="${open}" class="cursor-pointer border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-3">
      <div class="flex items-center gap-2">
        ${chevron(open)}
        <div class="min-w-0">
          <a href="provider-apikey.html" class="block truncate text-xs font-medium underline-offset-2 hover:underline">${r.name}</a>
          <div class="text-[12px] text-muted-foreground">${r.models.length} model${r.models.length === 1 ? '' : 's'}</div>
        </div>
      </div>
    </td>
    <td class="px-3 text-right text-xs ${ukey()}">${r.requestCount.toLocaleString('en-US')}</td>
    <td class="px-3 text-right text-xs ${ukey()}">${fmtN(r.inputTokens)}</td>
    <td class="px-3 text-right text-xs ${ukey()}">${fmtN(r.outputTokens)}</td>
    <td class="px-3 text-right text-xs ${ukey('text-muted-foreground')}">${fmtN(r.cacheTokens)}</td>
    <td class="px-3 text-right text-xs ${ukey()}">${apiCost(r)}</td>
    <td class="py-2.5 pl-3 pr-6">${apiShare(r)}</td>
  </tr>`

// A model row sits under its provider, on a faint ground so the nesting
// reads without an indent guide, and lines its name up with the provider's.
const apiModelRow = (m, parent, open) => `
  <tr data-api-children="${parent}" class="${open ? '' : 'hidden'} border-t border-border/40 bg-muted/20 transition-colors hover:bg-muted/40">
    <td class="py-2 pl-12 pr-3"><span class="block truncate font-mono text-[12px]">${m.name}</span></td>
    <td class="px-3 text-right text-[12px] ${ukey()}">${m.requestCount.toLocaleString('en-US')}</td>
    <td class="px-3 text-right text-[12px] ${ukey()}">${fmtN(m.inputTokens)}</td>
    <td class="px-3 text-right text-[12px] ${ukey()}">${fmtN(m.outputTokens)}</td>
    <td class="px-3 text-right text-[12px] ${ukey('text-muted-foreground')}">${fmtN(m.cacheTokens)}</td>
    <td class="px-3 text-right text-[12px] ${ukey()}">${apiCost(m)}</td>
    <td class="py-2 pl-3 pr-6">${apiShare(m)}</td>
  </tr>`

const apiTotalRow = `
  <tr class="border-t border-border">
    <td class="py-2.5 pl-6 pr-3 text-xs font-medium">Total</td>
    <td class="px-3 text-right text-xs font-medium ${ukey()}">${API_TOTAL.requestCount.toLocaleString('en-US')}</td>
    <td class="px-3 text-right text-xs font-medium ${ukey()}">${fmtN(API_TOTAL.inputTokens)}</td>
    <td class="px-3 text-right text-xs font-medium ${ukey()}">${fmtN(API_TOTAL.outputTokens)}</td>
    <td class="px-3 text-right text-xs font-medium ${ukey()}">${fmtN(API_TOTAL.cacheTokens)}</td>
    <td class="px-3 text-right text-xs font-medium ${ukey()}">${apiCost(API_TOTAL)}</td>
    <td class="py-2.5 pl-3 pr-6"></td>
  </tr>`

// The two layouts are measured on the section, not the viewport, for the
// reason the subscription groups are: the sidebar's width is not the
// screen's. Below 52rem the six number columns would leave the name less
// than a model id, so a row becomes the phone list's two-line form — name
// and cost on the first line, the counts on the second — which is also how
// "By access token" reads on a phone.
const apiTable = `
  <table class="w-full table-fixed @max-[52rem]:hidden">
    <colgroup><col><col class="w-20"><col class="w-24"><col class="w-24"><col class="w-24"><col class="w-24"><col class="w-36"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-3 text-left font-medium">Provider</th>
        <th class="px-3 text-right font-medium">Requests</th>
        <th class="px-3 text-right font-medium">Input</th>
        <th class="px-3 text-right font-medium">Output</th>
        <th class="px-3 text-right font-medium" title="Tokens read from or written to the provider's cache">Cache</th>
        <th class="px-3 text-right font-medium">Cost ${API_DAYS}d</th>
        <th class="px-3 text-left font-medium">Share of spend</th>
      </tr>
    </thead>
    <tbody>
      ${API_ROWS.map((r, i) => apiProviderRow(r, i === 0) + r.models.map((m) => apiModelRow(m, r.id, i === 0)).join('')).join('')}
      ${apiTotalRow}
    </tbody>
  </table>`

const phoneCounts = (r, tail) => `
  <div class="mt-1 flex min-w-0 items-center gap-2 overflow-hidden whitespace-nowrap text-[12px] text-muted-foreground">
    <span class="shrink-0 ${ukey()}">${r.requestCount.toLocaleString('en-US')} req</span>
    <span class="shrink-0 ${ukey()}">${fmtN(r.inputTokens)} in</span>
    <span class="shrink-0 ${ukey()}">${fmtN(r.outputTokens)} out</span>
    <span class="shrink-0 ${ukey()}">${fmtN(r.cacheTokens)} cache</span>
    ${tail}
  </div>`
const phonePct = (r) => {
  const pct = shareOf(r.totalCostUsd)
  return `<span class="ml-auto shrink-0 ${ukey()}">${pct === null ? '–' : `${pct}%`}</span>`
}
const apiPhoneRow = (r, open) => `
  <div data-api-toggle="${r.id}" aria-expanded="${open}" class="cursor-pointer border-t border-border/60 px-4 py-3 transition-colors active:bg-muted/50">
    <div class="flex items-center gap-2">
      ${chevron(open)}
      <a href="provider-apikey.html" class="min-w-0 flex-1 truncate text-xs font-medium">${r.name}</a>
      <span class="shrink-0 text-xs ${ukey()}">${apiCost(r)}</span>
    </div>
    <div class="pl-6">${phoneCounts(r, phonePct(r))}</div>
  </div>
  ${r.models.map((m) => `
  <div data-api-children="${r.id}" class="${open ? '' : 'hidden'} border-t border-border/40 bg-muted/20 py-2.5 pr-4 pl-10">
    <div class="flex items-baseline gap-3">
      <span class="min-w-0 flex-1 truncate font-mono text-[12px]">${m.name}</span>
      <span class="shrink-0 text-[12px] ${ukey()}">${apiCost(m)}</span>
    </div>
    ${phoneCounts(m, phonePct(m))}
  </div>`).join('')}`

const apiPhone = `
  <div class="hidden @max-[52rem]:block">
    ${API_ROWS.map((r, i) => apiPhoneRow(r, i === 0)).join('')}
    <div class="flex items-baseline gap-3 border-t border-border px-4 py-3">
      <span class="flex-1 text-xs font-medium">Total</span>
      <span class="shrink-0 text-xs font-medium ${ukey()}">${apiCost(API_TOTAL)}</span>
    </div>
    <div class="px-4 pb-3">${phoneCounts(API_TOTAL, '')}</div>
  </div>`

// Empty is a fact about the range, not an error: a week with no API-key
// traffic is ordinary on an install that only routes to subscriptions.
// Saying what IS counted (and where the rest went) is what stops it
// reading as a broken query.
const apiEmpty = `
  <div class="px-6 py-6 text-xs text-muted-foreground @max-[52rem]:px-4">
    No requests went to an API key provider in the last ${API_DAYS} days. Subscription traffic is counted in the windows above.
  </div>`

// Click a row to open or close it: the chevron, the aria state and every
// model row under it. A click on the provider's name is a link, not a toggle.
document.addEventListener('click', (event) => {
  const toggle = event.target.closest('[data-api-toggle]')
  if (!toggle || event.target.closest('a')) return
  const id = toggle.getAttribute('data-api-toggle')
  const open = toggle.getAttribute('aria-expanded') !== 'true'
  document.querySelectorAll(`[data-api-toggle="${id}"]`).forEach((el) => {
    el.setAttribute('aria-expanded', String(open))
    el.querySelector('[data-api-chevron]').className = el.querySelector('[data-api-chevron]').className.replace(/ri-arrow-(down|right)-s-line/, open ? 'ri-arrow-down-s-line' : 'ri-arrow-right-s-line')
  })
  document.querySelectorAll(`[data-api-children="${id}"]`).forEach((el) => el.classList.toggle('hidden', !open))
})

// ─── Page ─────────────────────────────────────────────────────────────
// The meta beside a title is the range the section covers, and only
// that. Where the numbers came from is not something the reader acts on.
const sectionHead = (title, meta = '', action = '', pad = 'px-6') => `
  <div class="flex items-baseline gap-3 border-t border-border ${pad} pt-6 pb-3">
    <h2 class="text-sm font-semibold">${title}</h2>
    ${meta ? `<span class="text-xs text-muted-foreground/70">${meta}</span>` : ''}
    ${action ? `<div class="ml-auto">${action}</div>` : ''}
  </div>`

// ?api-keys   the same page, scrolled to the new section (it sits under the
//             fold of a 1440x900 capture)
// ?empty      that section with no API-key traffic in the range
// ?phone      only that section, in a 390px column, so the narrow form can be
//             reviewed without a phone-sized shell, which no mock draws
const PARAMS = new URLSearchParams(location.search)
const API_EMPTY = PARAMS.has('empty')
const API_PHONE = PARAMS.has('phone')

const apiSection = `
  <div id="api-keys" class="@container">
    ${sectionHead('API keys', `last ${API_DAYS} days`, btn('Manage keys', 'ghost', 'ri-key-2-line', 'providers-keys.html'), 'px-6 @max-[52rem]:px-4')}
    ${API_EMPTY ? apiEmpty : `${apiTable}${apiPhone}`}
  </div>`

document.getElementById('root').innerHTML = API_PHONE ? `
  <div class="flex min-h-screen justify-center bg-muted/40 px-4 py-8">
    <div class="h-fit w-[390px] overflow-hidden rounded-xl border border-border bg-background pb-2">${apiSection}</div>
  </div>` : `

  <div class="flex flex-wrap items-center gap-2 border-b border-border px-6 py-3">
    ${filter('Range', '7 days')}
  </div>

  ${sectionHead('Subscription windows')}
  <!-- One group per provider; inside it, as many accounts per row as get
       28rem each, up to three — measured on the group with a container
       query, not the viewport, because the sidebar folds at any width. An
       account is a name and its windows; given the whole width each bar
       became 800px of track carrying one figure, with "resets in" a screen
       away from the percentage it qualifies. An empty column is left empty
       rather than stretching the accounts to fill the row — and never lent
       to the next provider. -->
  <div class="pb-2">
    ${PROVIDERS.map(providerGroup).join('')}
  </div>

  <!-- Under the windows, because both answer "what is it costing" and this
       is the half that is not a subscription. It goes between the windows
       and the pace chart, not after the chart: the chart is a history of
       the windows, so the two stay a scroll apart at most from what they
       explain, and the per-token table that follows is the cross-cut of
       both kinds. -->
  ${apiSection}

  <!-- No Export CSV: the chart is read here, and the screens hand out no
       files. -->
  ${sectionHead('Projected quota pace', 'last 7 days')}
  <p class="px-6 pb-3 text-xs text-muted-foreground">Projected use at each window's reset if its pace continues. At or above 100% means it may reach the limit by reset; actual rate limits can differ. Early or missing readings are unknown.</p>
  ${chart}

  ${sectionHead('By access token', 'last 30 days', btn('Manage tokens', 'ghost', 'ri-key-2-line', 'settings-access.html'))}
  ${tokenTable}
  <div class="h-10"></div>`

if (!API_PHONE) renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'usage',
  crumbs: ['Usage'],
  // The API-key count is providers that carried traffic in the range, which
  // is all /api/usage/cost can say; a connected key that sat idle is not one.
  subtitle: '5 subscription accounts · 3 API key providers · last 7 days',
  actions: btn('Refresh', 'outline', 'ri-refresh-line')
})

// Scroll the new section to the top of the page, once the fonts have set
// the heights above it. Needed only because it sits below a 900px capture.
if (!API_PHONE && (PARAMS.has('api-keys') || API_EMPTY)) {
  const jump = () => document.getElementById('api-keys').scrollIntoView({ block: 'start' })
  jump()
  document.fonts.ready.then(jump)
}
</script>
</body>
</html>
