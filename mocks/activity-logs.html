<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Logs</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, pager } = window.Shell

// A tail, in order. Nothing to open.
//
// This screen used to be three panes — a file rail, a rail of request
// groups, and a body — on the premise that one request produces a story
// worth opening. It does not. Rialto writes exactly two lines that carry a
// reqId: the access log's `POST /v1/messages 200 4411ms`, and, at debug
// only, provider-fetch's `final request`. Everything else in the file is
// boot, OAuth, sync jobs and vendor scrapes, which have no request at all.
// So a "group" was one line with a disclosure arrow in front of it, and
// two rails of chrome to reach it.
//
// What is left is the file, the level filter, and the lines. The width
// caps at 64rem: a log line has a natural length, and a wider window
// should not pull the message away from the fields that qualify it.

const FILES = [
  { name: 'rialto-2026-08-31.log', size: '4.2 MB', active: true },
  { name: 'rialto-2026-08-30.log', size: '11.8 MB' },
  { name: 'rialto-2026-08-29.log', size: '9.1 MB' },
  { name: 'rialto-2026-08-28.log', size: '6.7 MB' }
]

// Real messages, taken from the source. `POST … 200 4411ms` is
// api/access-log.ts; `final request` is llms/provider-fetch.ts and only
// appears at LOG_LEVEL=debug; the rest are the services that actually
// log. A GET on /api/* that succeeded is demoted to debug, which is why
// the UI's own polling is not on top of everything else here.
const LINES = [
  { lv: 'info',  t: '14:05:47.882', msg: 'POST /v1/messages 200 4411ms', kv: 'reqId=req_9f21c4 status=200 durationMs=4411' },
  { lv: 'debug', t: '14:05:43.471', msg: 'final request', kv: 'reqId=req_9f21c4 requestUrl=https://api.anthropic.com/v1/messages bodyLength=48210' },
  { lv: 'warn',  t: '14:03:04.883', msg: 'POST /v1/messages 429 2140ms', kv: 'reqId=req_71bd08 status=429 durationMs=2140' },
  { lv: 'debug', t: '14:03:02.741', msg: 'final request', kv: 'reqId=req_71bd08 requestUrl=https://chatgpt.com/backend-api/codex/responses bodyLength=48210' },
  { lv: 'info',  t: '14:02:33.104', msg: 'POST /v1/messages 200 3806ms', kv: 'reqId=req_04c79a status=200 durationMs=3806' },
  { lv: 'warn',  t: '13:58:10.220', msg: '[codex] wham/usage non-OK', kv: 'status=401 body={"detail":"token_expired"}' },
  { lv: 'info',  t: '13:58:09.004', msg: '[codex-oauth] token refresh failed', kv: 'account=tkgstrator@… attempt=1' },
  { lv: 'error', t: '13:40:22.518', msg: 'POST /v1/chat/completions 500 812ms', kv: 'reqId=req_3d907b status=500 durationMs=812' },
  { lv: 'warn',  t: '13:35:00.913', msg: 'google scrape: no priced Gemini sections found', kv: '' },
  { lv: 'warn',  t: '13:35:00.902', msg: 'vendor pricing fetch: non-2xx', kv: 'url=https://ai.google.dev/gemini-api/docs/pricing status=503' },
  { lv: 'info',  t: '13:20:41.660', msg: '[routing-scheduler] armed', kv: 'intervalMs=60000' },
  { lv: 'debug', t: '13:20:41.655', msg: 'GET /api/config 200 12ms', kv: 'reqId=req_ba512f status=200 durationMs=12' },
  { lv: 'info',  t: '13:20:40.118', msg: 'log config applied', kv: 'LOG_LEVEL=info LOG=true LOG_MAX_MB=10' },
  { lv: 'info',  t: '13:20:40.106', msg: 'Created default configuration file', kv: 'path=/home/vscode/.rialto/config.json' }
]

// Levels are colour-coded on the gutter only — colouring the whole line
// makes a long tail unreadable.
const gutter = { info: 'bg-transparent', debug: 'bg-transparent', warn: 'bg-amber-500', error: 'bg-destructive' }

const line = (l) => `
  <div class="flex gap-0 border-b border-border/40 hover:bg-muted/50">
    <span class="w-0.5 shrink-0 ${gutter[l.lv]}"></span>
    <span class="w-28 shrink-0 py-1.5 pl-6 font-mono text-[12px] tabular-nums text-muted-foreground">${l.t}</span>
    <span class="w-16 shrink-0 py-1.5 pl-2 font-mono text-[12px] uppercase ${
      l.lv === 'warn' ? 'text-amber-600 dark:text-amber-400' : l.lv === 'error' ? 'text-destructive' : 'text-muted-foreground/60'
    }">${l.lv}</span>
    <span class="min-w-0 flex-1 py-1.5 pr-6">
      <span class="font-mono text-[12px]">${l.msg}</span>
      ${l.kv ? `<span class="ml-2 font-mono text-[12px] text-muted-foreground">${l.kv}</span>` : ''}
    </span>
  </div>`

const chip = (label, on) => `
  <button class="h-7 rounded-md border px-2.5 text-xs transition-colors ${
    on ? 'border-border bg-muted/60' : 'border-transparent text-muted-foreground hover:bg-muted/50'
  }">${label}</button>`

document.getElementById('root').innerHTML = `
  <div class="min-w-0">

    <!-- Capped, not stretched, and left-aligned so the toolbar and the
         lines under it share one left edge. -->
    <div class="max-w-[64rem]">

      <!-- The file is a control, not a rail: it is chosen once per visit
           and then never looked at again. -->
      <div class="flex flex-wrap items-center gap-2 border-b border-border px-6 py-3">
        <button class="flex h-7 items-center gap-2 rounded-md border border-border px-2.5 transition-colors hover:bg-muted/50">
          <i class="ri-file-text-line text-sm text-muted-foreground"></i>
          <span class="font-mono text-[12px]">${FILES[0].name}</span>
          <span class="font-mono text-[12px] text-muted-foreground">${FILES[0].size}</span>
          <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
        </button>
        <span class="mx-1 h-4 w-px bg-border"></span>
        ${chip('error', true)}${chip('warn', true)}${chip('info', true)}${chip('debug', true)}
        <!-- No Copy and no Raw. Both belonged to the group pane: Copy took
             the open group's lines, and Raw swapped the rendered group for
             its JSON. With one flat list there is no group to take, and the
             whole file is one click away under Download. -->
        <div class="ml-auto flex items-center gap-2">
          <div class="flex h-7 w-44 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Search
          </div>
        </div>
      </div>

      ${LINES.map(line).join('')}

      ${pager({ first: 1, last: 14, total: 214, hasPrev: false })}

      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Newest first, and one line per event — the way the file is written.
          A request appears here as its access-log line; what it was routed to,
          and why, is in <span class="font-medium text-foreground">Requests</span>,
          which reads the archive rather than the log.
        </div>
      </div>

      <div class="h-6"></div>
    </div>

  </div>`

renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'logs',
  crumbs: ['Logs'],
  subtitle: 'rialto-2026-08-31.log · 4.2 MB · newest first',
  actions: btn('Follow', 'outline', 'ri-broadcast-line') + btn('Download', 'ghost', 'ri-download-line')
})
</script>
</body>
</html>
