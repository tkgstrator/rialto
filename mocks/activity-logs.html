<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Logs</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo, pager } = window.Shell

// Absorbs LogViewer + its four sub-components (LogFileList, Breadcrumbs,
// RequestGroupList, LogEditor). Same three-pane shape as today, but the
// middle pane groups lines by request id instead of showing a flat tail —
// a flat pino tail is unreadable once two clients are active at once.

const FILES = [
  { name: 'rialto-2026-08-31.log', size: '4.2 MB', active: true },
  { name: 'rialto-2026-08-30.log', size: '11.8 MB' },
  { name: 'rialto-2026-08-29.log', size: '9.1 MB' },
  { name: 'rialto-2026-08-28.log', size: '6.7 MB' }
]

const GROUPS = [
  { id: 'req_9f21c4', t: '14:05:47', level: 'info',  lines: 12, summary: 'POST /v1/messages → claude-code,claude-haiku-4-5', active: false },
  { id: 'req_71bd08', t: '14:03:02', level: 'warn',  lines: 24, summary: 'POST /v1/messages → codex,gpt-5.5 (429, failed over)', active: true },
  { id: 'req_04c79a', t: '14:02:33', level: 'info',  lines: 11, summary: 'POST /v1/messages → claude-code,claude-opus-4-8', active: false },
  { id: 'req_ba512f', t: '13:58:10', level: 'info',  lines: 9,  summary: 'POST /v1/responses → codex,gpt-5.5', active: false },
  { id: 'req_3d907b', t: '13:40:22', level: 'error', lines: 18, summary: 'POST /v1/chat/completions → openai,gpt-5.4-mini (400)', active: false },
  { id: '—',          t: '13:35:00', level: 'info',  lines: 4,  summary: 'routing scheduler tick — 2 weights changed', active: false }
]

const levelTone = { info: 'mute', warn: 'warn', error: 'bad', debug: 'mute' }

const fileRow = (f) => `
  <button class="flex w-full items-center gap-2 border-l-2 px-4 py-2 text-left transition-colors ${
    f.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  }">
    <i class="ri-file-text-line text-sm text-muted-foreground"></i>
    <span class="truncate font-mono text-[12px]">${f.name}</span>
    <span class="ml-auto shrink-0 font-mono text-[12px] text-muted-foreground">${f.size}</span>
  </button>`

const groupRow = (g) => `
  <button class="block w-full border-l-2 px-4 py-2.5 text-left transition-colors ${
    g.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  }">
    <div class="flex items-center gap-2">
      <span class="font-mono text-[12px] tabular-nums text-muted-foreground">${g.t}</span>
      ${pill(g.level, levelTone[g.level])}
      <span class="ml-auto font-mono text-[12px] text-muted-foreground">${g.lines} lines</span>
    </div>
    <div class="mt-1 truncate text-[12px]">${g.summary}</div>
    <div class="mt-0.5 font-mono text-[12px] text-muted-foreground">${g.id}</div>
  </button>`

// Log body. Levels are colour-coded on the gutter only — colouring the
// whole line makes a 24-line group unreadable.
const LINES = [
  { lv: 'info',  t: '14:03:02.104', msg: 'incoming POST /v1/messages', kv: 'surface=anthropic session=ses_9fa2…c41 token=rlt_a91f…' },
  { lv: 'debug', t: '14:03:02.106', msg: 'scenario classified', kv: 'scenario=default tokens=48210 threshold=60000' },
  { lv: 'debug', t: '14:03:02.107', msg: 'rule stack evaluated', kv: 'matched=none rules=4' },
  { lv: 'info',  t: '14:03:02.108', msg: 'preference chain resolved', kv: 'chain=[claude-opus-4-8,claude-fable-5,gpt-5.5,gemini-3.1-pro]' },
  { lv: 'debug', t: '14:03:02.109', msg: 'target selected', kv: 'target=codex,gpt-5.5 weight=1.00 reason=quota_headroom' },
  { lv: 'warn',  t: '14:03:04.882', msg: 'upstream rate limited', kv: 'provider=codex status=429 retry_after=2760' },
  { lv: 'warn',  t: '14:03:04.883', msg: 'marking target exhausted', kv: 'target=codex,gpt-5.5 until=2026-08-31T14:49:04Z' },
  { lv: 'info',  t: '14:03:04.884', msg: 'failing over', kv: 'from=codex,gpt-5.5 to=claude-code,claude-fable-5 attempt=2' },
  { lv: 'debug', t: '14:03:04.901', msg: 'oauth token refreshed', kv: 'account=tkgstrator@… expires_in=3600' },
  { lv: 'info',  t: '14:03:09.295', msg: 'upstream ok', kv: 'status=200 duration_ms=4411 in=48210 out=2104 cache_read=37882' },
  { lv: 'info',  t: '14:03:09.297', msg: 'usage recorded', kv: 'cost_usd=0.0891 cache_hit=78.6%' }
]

const gutter = { info: 'bg-transparent', debug: 'bg-transparent', warn: 'bg-amber-500', error: 'bg-destructive' }

const line = (l) => `
  <div class="group flex gap-0 hover:bg-muted/50">
    <span class="w-0.5 shrink-0 ${gutter[l.lv]}"></span>
    <span class="w-28 shrink-0 py-1 pl-3 font-mono text-[12px] tabular-nums text-muted-foreground">${l.t}</span>
    <span class="w-16 shrink-0 py-1 pl-2 font-mono text-[12px] uppercase ${
      l.lv === 'warn' ? 'text-amber-600 dark:text-amber-400' : l.lv === 'error' ? 'text-destructive' : 'text-muted-foreground/60'
    }">${l.lv}</span>
    <span class="min-w-0 flex-1 py-1 pr-4">
      <span class="font-mono text-[12px]">${l.msg}</span>
      <span class="ml-2 font-mono text-[12px] text-muted-foreground">${l.kv}</span>
    </span>
  </div>`

document.getElementById('root').innerHTML = `

  <div class="grid h-full grid-cols-[14rem_20rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-2 px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Files</h2>
      </div>
      ${FILES.map(fileRow).join('')}
      <div class="border-t border-border px-4 py-3">
        <div class="text-[12px] text-muted-foreground">Level</div>
        <div class="mt-1.5 flex flex-wrap gap-1">
          ${['error', 'warn', 'info', 'debug'].map((l, i) => `
            <button class="rounded border px-1.5 py-0.5 text-[12px] transition-colors ${
              i < 3 ? 'border-foreground/40 bg-muted/60' : 'border-border text-muted-foreground hover:bg-muted/50'
            }">${l}</button>`).join('')}
        </div>
      </div>
    </aside>

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-2 px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Requests</h2>
        <span class="ml-auto font-mono text-[12px] text-muted-foreground">6</span>
      </div>
      ${GROUPS.map(groupRow).join('')}
      <!-- The request rail is the unbounded list on this screen: a busy
           hour is hundreds of groups, and it was rendering whatever the
           read returned. Compact form because the rail is too narrow for
           the worded controls the full-width lists use. -->
      ${pager({ first: 1, last: 6, total: 214, hasPrev: false, compact: true })}
    </aside>

    <div class="min-w-0 overflow-y-auto">
      <!-- Capped, not stretched. A log line is a time, a level and a
           message with a key=value tail; on a wide monitor this pane is
           the column that absorbs every spare pixel, and the tail ends up
           an arm's length from the message it belongs to. Left-aligned
           rather than centred — the pane's left edge is the rail it was
           opened from. -->
      <div class="max-w-[80rem]">
      <div class="flex items-center gap-2 border-b border-border px-4 py-2.5">
        <span class="font-mono text-[12px] text-muted-foreground">rialto-2026-08-31.log</span>
        <i class="ri-arrow-right-s-line text-sm text-muted-foreground/50"></i>
        <span ${navTo('activity-requests.html')} class="font-mono text-[12px]">req_71bd08</span>
        ${pill('warn', 'warn')}
        <div class="ml-auto flex items-center gap-2">
          <div class="flex h-7 w-44 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Search in group
          </div>
          ${btn('Copy', 'ghost', 'ri-file-copy-line')}
          ${btn('Raw', 'ghost', 'ri-code-line')}
        </div>
      </div>
      <div class="py-1">${LINES.map(line).join('')}</div>
      <div class="px-4 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Grouped by request id, so a failover reads as one story instead of two interleaved ones.
          The 429 and the retry that succeeded are the same group.
        </div>
      </div>
      <div class="h-6"></div>
      </div>
    </div>

  </div>`

renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'logs',
  crumbs: ['Logs'],
  subtitle: 'rialto-2026-08-31.log · 4.2 MB · grouped by request',
  actions: btn('Follow', 'outline', 'ri-broadcast-line') + btn('Download', 'ghost', 'ri-download-line')
})
</script>
</body>
</html>
