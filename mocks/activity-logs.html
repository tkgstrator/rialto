<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Logs</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo, pager } = window.Shell

// One pane, not three.
//
// FILES and REQUESTS used to be 14rem and 20rem rails standing beside the
// log body for the whole life of the screen, and neither is something you
// read: the file is picked once per visit and the request list is an index
// into the pane next to it. Together they took 34rem off every viewport
// and left the body — the only part anyone reads a log for — squeezed
// against the right edge, where a wide monitor then stretched it into a
// pane with the message at one end and its key=value tail at the other.
//
// Now the file is a control in the toolbar, the request groups ARE the
// body (expanded in place, so the grouping that makes a failover read as
// one story is still what you see), and the whole thing caps at 64rem
// instead of growing with the window. The width past the cap is left
// empty on purpose: a log line has a natural length and nothing is gained
// by pulling it further apart.

const FILES = [
  { name: 'rialto-2026-08-31.log', size: '4.2 MB', active: true },
  { name: 'rialto-2026-08-30.log', size: '11.8 MB' },
  { name: 'rialto-2026-08-29.log', size: '9.1 MB' },
  { name: 'rialto-2026-08-28.log', size: '6.7 MB' }
]

const GROUPS = [
  { id: 'req_9f21c4', t: '14:05:47', level: 'info',  lines: 12, summary: 'POST /v1/messages → claude-code,claude-haiku-4-5', open: false },
  { id: 'req_71bd08', t: '14:03:02', level: 'warn',  lines: 24, summary: 'POST /v1/messages → codex,gpt-5.5 (429, failed over)', open: true },
  { id: 'req_04c79a', t: '14:02:33', level: 'info',  lines: 11, summary: 'POST /v1/messages → claude-code,claude-opus-4-8', open: false },
  { id: 'req_ba512f', t: '13:58:10', level: 'info',  lines: 9,  summary: 'POST /v1/responses → codex,gpt-5.5', open: false },
  { id: 'req_3d907b', t: '13:40:22', level: 'error', lines: 18, summary: 'POST /v1/chat/completions → openai,gpt-5.4-mini (400)', open: false },
  { id: '—',          t: '13:35:00', level: 'info',  lines: 4,  summary: 'routing scheduler tick — 2 weights changed', open: false }
]

const levelTone = { info: 'mute', warn: 'warn', error: 'bad', debug: 'mute' }

// Log body. Levels are colour-coded on the gutter only — colouring the
// whole line makes a 24-line group unreadable.
const LINES = [
  { lv: 'info',  t: '14:03:02.104', msg: 'incoming POST /v1/messages', kv: 'surface=anthropic session=ses_9fa2…c41 token=rlt_a91f…' },
  { lv: 'debug', t: '14:03:02.106', msg: 'scenario classified', kv: 'scenario=default tokens=48210 threshold=60000' },
  { lv: 'debug', t: '14:03:02.107', msg: 'rule stack evaluated', kv: 'matched=none rules=4' },
  { lv: 'info',  t: '14:03:02.108', msg: 'preference chain resolved', kv: 'chain=[claude-opus-4-8,claude-fable-5,gpt-5.5,gemini-3.1-pro]' },
  { lv: 'debug', t: '14:03:02.109', msg: 'target selected', kv: 'target=codex,gpt-5.5 weight=1.00 reason=quota_headroom' },
  { lv: 'warn',  t: '14:03:04.882', msg: 'upstream rate limited', kv: 'provider=codex status=429 retry_after=2760' },
  { lv: 'warn',  t: '14:03:04.883', msg: 'marking target exhausted', kv: 'target=codex,gpt-5.5 until=2026-08-31T14:49:04Z' },
  { lv: 'info',  t: '14:03:04.884', msg: 'failing over', kv: 'from=codex,gpt-5.5 to=claude-code,claude-fable-5 attempt=2' },
  { lv: 'debug', t: '14:03:04.901', msg: 'oauth token refreshed', kv: 'account=tkgstrator@… expires_in=3600' },
  { lv: 'info',  t: '14:03:09.295', msg: 'upstream ok', kv: 'status=200 duration_ms=4411 in=48210 out=2104 cache_read=37882' },
  { lv: 'info',  t: '14:03:09.297', msg: 'usage recorded', kv: 'cost_usd=0.0891 cache_hit=78.6%' }
]

const gutter = { info: 'bg-transparent', debug: 'bg-transparent', warn: 'bg-amber-500', error: 'bg-destructive' }

const line = (l) => `
  <div class="group flex gap-0 hover:bg-muted/50">
    <span class="w-0.5 shrink-0 ${gutter[l.lv]}"></span>
    <span class="w-28 shrink-0 py-1 pl-6 font-mono text-[12px] tabular-nums text-muted-foreground">${l.t}</span>
    <span class="w-16 shrink-0 py-1 pl-2 font-mono text-[12px] uppercase ${
      l.lv === 'warn' ? 'text-amber-600 dark:text-amber-400' : l.lv === 'error' ? 'text-destructive' : 'text-muted-foreground/60'
    }">${l.lv}</span>
    <span class="min-w-0 flex-1 py-1 pr-6">
      <span class="font-mono text-[12px]">${l.msg}</span>
      <span class="ml-2 font-mono text-[12px] text-muted-foreground">${l.kv}</span>
    </span>
  </div>`

// A group is its own header plus, when open, its lines. Expanding in place
// is what replaces the middle rail: the index and the thing it indexes are
// the same list, so picking a request no longer means reading one pane and
// looking at another.
const group = (g) => `
  <div class="border-b border-border/60">
    <button ${navTo('activity-requests.html')} class="flex w-full items-center gap-2 px-6 py-2.5 text-left transition-colors ${
      g.open ? 'bg-muted/40' : 'hover:bg-muted/50'
    }">
      <i class="${g.open ? 'ri-arrow-down-s-line' : 'ri-arrow-right-s-line'} text-sm text-muted-foreground/60"></i>
      <span class="font-mono text-[12px] tabular-nums text-muted-foreground">${g.t}</span>
      ${pill(g.level, levelTone[g.level])}
      <span class="min-w-0 flex-1 truncate text-[12px]">${g.summary}</span>
      <span class="shrink-0 font-mono text-[12px] text-muted-foreground">${g.id}</span>
      <span class="w-16 shrink-0 text-right font-mono text-[12px] text-muted-foreground">${g.lines} lines</span>
    </button>
    ${g.open ? `<div class="border-t border-border/60 py-1">${LINES.map(line).join('')}</div>` : ''}
  </div>`

const chip = (label, on) => `
  <button class="h-7 rounded-md border px-2.5 text-xs transition-colors ${
    on ? 'border-border bg-muted/60' : 'border-transparent text-muted-foreground hover:bg-muted/50'
  }">${label}</button>`

document.getElementById('root').innerHTML = `
  <div class="min-w-0">

    <!-- Capped, not stretched, and left-aligned so the toolbar and the
         lines under it share one left edge. -->
    <div class="max-w-[64rem]">

      <!-- The file is a control, not a rail: it is chosen once per visit
           and then never looked at again. -->
      <div class="flex flex-wrap items-center gap-2 border-b border-border px-6 py-3">
        <button class="flex h-7 items-center gap-2 rounded-md border border-border px-2.5 transition-colors hover:bg-muted/50">
          <i class="ri-file-text-line text-sm text-muted-foreground"></i>
          <span class="font-mono text-[12px]">${FILES[0].name}</span>
          <span class="font-mono text-[12px] text-muted-foreground">${FILES[0].size}</span>
          <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
        </button>
        <span class="mx-1 h-4 w-px bg-border"></span>
        ${chip('error', true)}${chip('warn', true)}${chip('info', true)}${chip('debug', false)}
        <div class="ml-auto flex items-center gap-2">
          <div class="flex h-7 w-44 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Search
          </div>
          ${btn('Copy', 'ghost', 'ri-file-copy-line')}
          ${btn('Raw', 'ghost', 'ri-code-line')}
        </div>
      </div>

      ${GROUPS.map(group).join('')}

      ${pager({ first: 1, last: 6, total: 214, hasPrev: false })}

      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Grouped by request id, so a failover reads as one story instead of two interleaved ones.
          The 429 and the retry that succeeded are the same group.
        </div>
      </div>

      <div class="h-6"></div>
    </div>

  </div>`

renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'logs',
  crumbs: ['Logs'],
  subtitle: 'rialto-2026-08-31.log · 4.2 MB · grouped by request',
  actions: btn('Follow', 'outline', 'ri-broadcast-line') + btn('Download', 'ghost', 'ri-download-line')
})
</script>
</body>
</html>
