<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Access tokens</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, surfacePill, navTo, sortTh, SURFACES, surfaceChip } = window.Shell


// Only the sha256 is stored; `prefix` is a separate column purely so a
// row is identifiable in the list. The plaintext is shown once, at
// creation, and never again.
//
// `surface` and `profile` are the interesting columns: scoping a token
// to an inbound surface and a routing profile turns "issue another key"
// into per-client routing, without inventing a second config axis.
// Cost and Expires rather than Scope and Created. Scope was a `proxy`
// pill on every row — a column that can only say one thing. Created is
// not a decision; Expires is, and Cost 30d is the number an operator
// opens this screen for.
const TOKENS = [
  { name: 'MacBook — Claude Code', prefix: 'rlt_a91f…', surfaces: ['/v1/messages'], used: '2m ago',  reqs: '12.4k', cost: '$41.2', expires: 'never' },
  // Two surfaces on one row. Codex speaks /v1/responses and
  // /v1/chat/completions, so a single-surface pin could only be
  // expressed by giving it no scope at all.
  { name: 'MacBook — Codex',       prefix: 'rlt_7c02…', surfaces: ['/v1/responses', '/v1/chat/completions'], used: '19m ago', reqs: '2.71k', cost: '$18.6', expires: 'never' },
  { name: 'Gemini CLI',            prefix: 'rlt_be44…', surfaces: ['/v1beta/models/*'], used: '1h ago',  reqs: '486',   cost: '–',     expires: '2026-12-01' },
  { name: 'CI — nightly evals',    prefix: 'rlt_0d18…', surfaces: [],                   used: '6h ago',  reqs: '3.10k', cost: '$9.14', expires: '2026-10-08' },
  { name: 'Old laptop',            prefix: 'rlt_2b90…', surfaces: ['/v1/messages'],     used: '41d ago', reqs: '88.1k', cost: '–',     expires: 'never', revoked: true }
]

/**
 * The endpoint cell.
 *
 * One pill and a count, not every path: the column is 12rem and four
 * paths would take the row to two lines. The whole list is a hover away.
 */
const scopeCell = (paths) => {
  if (paths.length === 0) return '<span class="text-[12px] text-muted-foreground/50">all</span>'
  const rest = paths.length - 1
  return `<span class="inline-flex items-center gap-1" title="${paths.join(' · ')}">${surfacePill(paths[0])}${
    rest > 0 ? `<span class="shrink-0 font-mono text-[12px] text-muted-foreground/70">+${rest}</span>` : ''
  }</span>`
}


// The requests and last-used columns are decision support for Revoke; the
// full picture behind them is Activity → Usage, which breaks spend down by
// exactly these rows.
//
// The row leads to the token's own page. Rotate and Revoke live there and
// nowhere else — as row actions they sat one mis-aimed click from every
// row of a table of live credentials, and the cost of that click is a CLI
// failing with a 401 nobody can trace from the client end. Profile is off
// this table for the same reason it is not a column here: it is a routing
// detail, and the row exists to say which credentials are live and what
// they cost.
const tokenRow = (t) => `
  <tr ${navTo('access-token.html')} class="cursor-pointer border-t border-border/60 transition-colors hover:bg-muted/50 ${t.revoked ? 'opacity-45' : ''}">
    <td class="py-2.5 pl-6 pr-3">
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium">${t.name}</span>
        ${t.revoked ? pill('revoked', 'bad') : ''}
      </div>
      <div class="font-mono text-[12px] text-muted-foreground">${t.prefix}</div>
    </td>
    <td class="px-3">${scopeCell(t.surfaces)}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${t.reqs}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${t.cost}</td>
    <td class="px-3 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${t.used}</td>
    <td class="px-3 text-right font-mono text-[12px] tabular-nums text-muted-foreground">${t.expires}</td>
    <td class="py-2.5 pl-3 pr-6">
      <div class="flex justify-end text-muted-foreground/50"><i class="ri-arrow-right-s-line text-base"></i></div>
    </td>
  </tr>`

// One row of the issue form. `placeholder` is the empty-input state (the
// operator has not typed a name yet); `select` is the impl's picker — a
// bordered box with a chevron, monospace because every value in it is a
// path or a profile key.
const issueField = (label, hint, value, kind) => `
  <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
    <div>
      <div class="text-xs font-medium">${label}</div>
      <div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">${hint}</div>
    </div>
    <div class="relative inline-flex w-full max-w-md">
      <div class="flex h-8 w-full items-center rounded-md border border-border pl-3 pr-8 font-mono text-xs ${
        kind === 'placeholder' ? 'text-muted-foreground/50' : ''
      }">${value}</div>
      ${
        kind === 'select'
          ? '<i class="ri-arrow-down-s-line pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground"></i>'
          : ''
      }
    </div>
  </div>`

const tokens = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-48"><col class="w-20"><col class="w-28"><col class="w-28"><col class="w-24"><col class="w-10"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Token', 'pl-6 pr-3')}
        ${sortTh('Endpoint', 'px-3')}
        ${sortTh('Requests', 'px-3', 'right')}
        ${sortTh('Cost 30d', 'px-3', 'right')}
        ${sortTh('Last used', 'px-3', 'right', true, 'desc')}
        ${sortTh('Expires', 'px-3', 'right')}
        <th class="pl-3 pr-6"></th>
      </tr>
    </thead>
    <tbody>${TOKENS.filter((t) => !t.revoked).map(tokenRow).join('')}</tbody>
  </table>`
document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <!-- No "Access tokens" heading: the breadcrumb and the sidebar
           both already say it, and on its own screen a title repeating
           them costs a line that the counts can use.
           Revoked rows are folded away, not deleted. They are the only
           thing keeping past RequestLog entries attributable to a
           client, so they have to exist — but the table answers "what
           can reach the proxy right now", and a dead row is never that.
           The count stays a control rather than a label: without it the
           only way to Delete one would be to remember its URL. -->
      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <span class="text-[12px] text-muted-foreground">4 active ·
          <button class="underline decoration-dotted underline-offset-2 transition-colors hover:text-foreground">1 revoked</button>
          · all <span class="font-mono">/v1/*</span></span>
      </div>

      <div class="px-6 pb-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Only a SHA-256 digest is stored — the plaintext is shown once, when the token is issued.
          Scoping a token to endpoints and a routing profile is how a client gets its own routing:
          the CI token below is pinned to <span class="font-mono">cost-first</span> without touching
          anyone else's chain.
          <span class="font-medium text-foreground">Open a row</span> to rotate it — a new secret on
          the same row, keeping its name, scope and history — or to revoke it.
        </div>
      </div>

      <!-- The issue form, drawn open. It was missing entirely: the mock
           jumped from the button to the issued panel, so the two fields
           that are the whole reason per-client tokens exist — endpoint and
           routing profile — were never shown as decisions. Both lists come
           from the server (/api/inbound-surfaces, the profile list); none
           of it is hardcoded. -->
      <div class="border-t border-border">
        ${issueField('Name', 'How this client is identified in the list and in Activity.', 'MacBook — Claude Code', 'placeholder')}
        <!-- Chips, not a select: the question is "which of these four",
             not "which one", and the same control already asks it in
             Routing -> Rules and in Personas. "All endpoints" is an
             explicit chip rather than the absence of a choice, because
             leaving a row blank to mean the broadest possible scope is
             the kind of default nobody reads. -->
        <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
          <div>
            <div class="text-xs font-medium">Endpoint</div>
            <div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">
              Pick the endpoints this token may call. Choose several when one client speaks more than
              one — Codex uses both <span class="font-mono">/v1/responses</span> and
              <span class="font-mono">/v1/chat/completions</span>. All endpoints leaves it unrestricted.
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            ${surfaceChip('all endpoints', false)}
            ${SURFACES.map((s, i) => surfaceChip(s.path, i === 1 || i === 2)).join('')}
          </div>
        </div>
        ${issueField('Routing profile', 'Route this client’s traffic through a named profile. Unset follows the endpoint’s own routing.', 'follow the endpoint', 'select')}
        ${issueField('Expires', 'A bounded token limits the damage if it leaks. Revoke works either way.', '90 days', 'select')}
        <div class="flex items-center gap-2 border-t border-border/60 px-6 py-4">
          ${btn('Issue token', 'primary', 'ri-add-line')}
          ${btn('Cancel', 'ghost', '')}
          <span class="ml-3 text-[12px] text-muted-foreground">
            The token is shown once, immediately after issuing, and never again.
          </span>
        </div>
      </div>

      ${tokens}

      <!-- Issue dialog, shown inline so the reviewer can judge the
           one-time-reveal moment without clicking. -->
      <div class="px-6 py-8">
        <div class="mx-auto max-w-lg rounded-lg border border-border bg-popover p-5 shadow-sm">
          <div class="flex items-center gap-2">
            <h3 class="text-sm font-semibold">Token issued</h3>
            ${pill('copy it now', 'warn')}
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            This is the only time the full token is shown. Rialto stores a digest, so it cannot be
            recovered — only replaced.
          </p>
          <div class="mt-3 flex items-center gap-2 rounded-md border border-border bg-muted/40 px-3 py-2">
            <span class="flex-1 truncate font-mono text-xs">rlt_a91f4c7e20b8d5169fa3e84c07b21d6f</span>
            <button class="text-muted-foreground hover:text-foreground"><i class="ri-file-copy-line text-sm"></i></button>
          </div>
          <div class="mt-4 space-y-2">
            <div class="flex items-baseline gap-3">
              <span class="text-[12px] text-muted-foreground">Scope</span>
              <span class="ml-auto font-mono text-[12px]">proxy</span>
            </div>
            <div class="flex items-baseline gap-3">
              <span class="text-[12px] text-muted-foreground">Endpoint</span>
              <span class="ml-auto font-mono text-[12px]">/v1/messages</span>
            </div>
            <div class="flex items-baseline gap-3">
              <span class="text-[12px] text-muted-foreground">Routing profile</span>
              <span class="ml-auto font-mono text-[12px]">live</span>
            </div>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            ${btn('Done', 'primary', 'ri-check-line')}
          </div>
        </div>
      </div>

      <div class="h-8"></div>
    </div>

  </div>`

renderShell({
  active: 'access-tokens',
  navMode: 'cloudflare',
  crumbs: [],
  subtitle: 'Per-client credentials for /v1/*',
  actions: btn('Issue token', 'primary', 'ri-add-line')
})
</script>
</body>
</html>
