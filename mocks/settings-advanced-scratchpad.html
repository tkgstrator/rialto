<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Advanced · Scratchpad</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, tabs } = window.Shell

// The Advanced screen's third tab. The implementation renders a
// "not yet available" notice here rather than a half-working editor, and
// the mock had no picture of that state at all — so a reviewer clicking
// the tab in the mock got nothing and could not tell whether the panel was
// missing from the design or from the build.
//
// Worth drawing precisely because the honest empty state is the design
// decision: naming what the panel will do and what it is waiting on is
// what stops it reading as a bug.

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
    <div class="flex items-center gap-1 border-b border-border px-6">
      ${tabs([
        { id: 'config', label: 'Config document', href: 'settings-advanced.html' },
        { id: 'scratch', label: 'Request scratchpad' },
        { id: 'health', label: 'Health', href: 'settings-advanced-health.html' }
      ], 'scratch')}
    </div>

    <div class="flex items-baseline gap-3 px-6 pt-6 pb-3">
      <h2 class="text-sm font-semibold">Request scratchpad</h2>
      <span class="text-xs text-muted-foreground/70">not rebuilt yet</span>
    </div>

    <div class="px-6 py-4">
      <div class="rounded-md border border-dashed border-border px-4 py-4">
        <div class="flex items-center gap-2">
          <i class="ri-tools-line text-sm text-muted-foreground"></i>
          <span class="text-xs font-medium">Send a request without a client</span>
          ${pill('not yet available', 'mute')}
        </div>
        <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
          Needs an endpoint that runs the pipeline without recording a session — the routing decision
          and the upstream call, with nothing written to <span class="font-mono">RequestLog</span> or
          <span class="font-mono">Message</span>. Until then the nearest thing is the rule tester in
          <a href="routing-rules.html" class="underline underline-offset-2">Routing → Rules</a>, which
          answers the selection half without making the call.
        </p>
      </div>
    </div>

    <div class="px-6 pb-4">
      <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
        <i class="ri-information-line mr-1 align-[-1px]"></i>
        The state is drawn rather than left blank on purpose: an empty pane reads as a bug, and a
        reviewer cannot tell a panel missing from the design from one missing from the build. Naming
        what it will do and what it waits on is the difference.
      </div>
    </div>

    <div class="flex items-center gap-3 border-t border-border px-6 pt-5 pb-3">
      <h2 class="text-sm font-semibold">Danger zone</h2>
    </div>
    ${[
      ['Reset routing', 'Clears every chain, rule and profile back to the seeded defaults. Providers and accounts are kept.'],
      ['Re-seed model catalog', 'Drops scraped models and prices, then re-runs the seed. Enabled flags are lost.'],
      ['Purge captured data', 'Deletes every session, message and request log. Usage history and cost totals go with it.']
    ].map(([label, hint]) => `
      <div class="grid grid-cols-[1fr_auto] items-center gap-6 border-t border-border/60 px-6 py-4">
        <div>
          <div class="text-xs font-medium">${label}</div>
          <div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">${hint}</div>
        </div>
        <button class="inline-flex h-8 items-center rounded-md border border-destructive/40 px-3 text-xs font-medium text-destructive transition-colors hover:bg-destructive/10">
          ${label.split(' ')[0]}
        </button>
      </div>`).join('')}
    <div class="h-10"></div>
  </div>`

renderShell({
  active: 'settings',
  navMode: 'cloudflare',
  sub: 'advanced',
  crumbs: ['Advanced'],
  subtitle: 'Request scratchpad · not rebuilt yet',
  actions: btn('Backups', 'ghost', 'ri-history-line') + btn('Save', 'primary', 'ri-check-line')
})
</script>
</body>
</html>
