<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing map</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo, selectorBar } = window.Shell

// Absorbs RoutingLibrary + RoutingLiveEditor + RoutingPresetEditor into
// one canvas with a preset switcher. The graph stays @xyflow/react in the
// real build; drawn as inline SVG here.
//
// The new column on the left of the canvas is the inbound surface — the
// old map started at the scenario and had no way to show that three of
// the four surfaces never entered the graph at all.

const SURFACE_NODES = [
  { y: 70,  label: '/v1/messages',         mode: 'routed' },
  { y: 150, label: '/v1/chat/completions', mode: 'routed' },
  { y: 230, label: '/v1/responses',        mode: 'passthrough' },
  { y: 310, label: '/v1beta/models/*',     mode: 'passthrough' }
]
const SCENARIO_NODES = [
  { y: 60,  label: 'default',     n: 5 },
  { y: 140, label: 'think',       n: 4 },
  { y: 220, label: 'longContext', n: 3 },
  { y: 300, label: 'webSearch',   n: 2 },
  { y: 380, label: 'image',       n: 2 }
]
const TARGET_NODES = [
  { y: 40,  label: 'claude-code,claude-opus-4-8',   state: 'throttled' },
  { y: 110, label: 'claude-code,claude-fable-5',    state: 'ready' },
  { y: 180, label: 'codex,gpt-5.5',                 state: 'exhausted' },
  { y: 250, label: 'gemini-cli,gemini-3.1-pro',     state: 'ready' },
  { y: 320, label: 'claude-code,claude-sonnet-4-6', state: 'ready' },
  { y: 390, label: 'claude-code,claude-haiku-4-5',  state: 'ready' }
]

const SUBSCRIPTION_PROVIDERS = ['claude-code', 'codex', 'gemini-cli']
const providerHref = (t) =>
  SUBSCRIPTION_PROVIDERS.includes(t.split(',')[0]) ? 'providers.html' : 'providers-apikey.html'

const stroke = { ready: 'stroke-emerald-500', throttled: 'stroke-amber-500', exhausted: 'stroke-destructive' }
const dot = { ready: 'fill-emerald-500', throttled: 'fill-amber-500', exhausted: 'fill-destructive' }

// Nodes take a destination like every other row in the mocks — the graph
// is a map of the config, so a node should reach the screen that edits the
// thing it stands for. `data-nav` works on SVG elements unchanged.
const node = (x, y, w, label, sub, accent, href = '') => `
  <g ${href ? navTo(href) : ''}>
    <rect x="${x}" y="${y}" width="${w}" height="40" rx="6"
          class="fill-background stroke-border" stroke-width="1"/>
    ${accent ? `<rect x="${x}" y="${y}" width="2.5" height="40" rx="1.25" class="${accent}"/>` : ''}
    <text x="${x + 12}" y="${y + 17}" class="fill-foreground" font-size="11" font-family="var(--font-mono)">${label}</text>
    <text x="${x + 12}" y="${y + 31}" class="fill-muted-foreground" font-size="9.5" font-family="var(--font-sans)">${sub}</text>
  </g>`

const edge = (x1, y1, x2, y2, cls, dashed) => {
  const mid = (x1 + x2) / 2
  return `<path d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}"
    fill="none" stroke-width="1.25" class="${cls}" ${dashed ? 'stroke-dasharray="3 3"' : ''} opacity="0.75"/>`
}

const canvas = `
<svg viewBox="0 0 1080 460" class="w-full" style="height: 460px">
  <!-- surface → scenario -->
  ${SURFACE_NODES.map((s, i) =>
    s.mode === 'routed'
      ? edge(258, s.y + 20, 330, SCENARIO_NODES[Math.min(i, 1)].y + 20, 'stroke-muted-foreground/50', false)
      : edge(258, s.y + 20, 700, TARGET_NODES[i + 1].y + 20, 'stroke-muted-foreground/40', true)
  ).join('')}
  <!-- scenario → target -->
  ${edge(500, 80, 700, 60, stroke.throttled, false)}
  ${edge(500, 80, 700, 130, stroke.ready, false)}
  ${edge(500, 80, 700, 200, stroke.exhausted, false)}
  ${edge(500, 80, 700, 270, stroke.ready, false)}
  ${edge(500, 160, 700, 60, stroke.throttled, false)}
  ${edge(500, 160, 700, 130, stroke.ready, false)}
  ${edge(500, 240, 700, 340, stroke.ready, false)}
  ${edge(500, 320, 700, 270, stroke.ready, false)}
  ${edge(500, 400, 700, 410, stroke.ready, false)}

  <text x="60" y="30" class="fill-muted-foreground" font-size="9.5" letter-spacing="1.2" font-family="var(--font-sans)">INBOUND SURFACE</text>
  <text x="340" y="30" class="fill-muted-foreground" font-size="9.5" letter-spacing="1.2" font-family="var(--font-sans)">SCENARIO</text>
  <text x="710" y="30" class="fill-muted-foreground" font-size="9.5" letter-spacing="1.2" font-family="var(--font-sans)">TARGET</text>

  ${SURFACE_NODES.map((s) =>
    node(
      60, s.y, 198, s.label, s.mode,
      s.mode === 'routed' ? 'fill-emerald-500' : 'fill-muted-foreground/40',
      s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html'
    )
  ).join('')}
  ${SCENARIO_NODES.map((s) => node(340, s.y, 160, s.label, `${s.n} targets`, 'fill-foreground/30', 'routing.html')).join('')}
  ${TARGET_NODES.map((t) => `
    ${node(700, t.y, 320, t.label, t.state, '', providerHref(t.label))}
    <circle cx="1006" cy="${t.y + 20}" r="3.5" class="${dot[t.state]}"/>`).join('')}
</svg>`

document.getElementById('root').innerHTML = `
  ${selectorBar('chain')}


  <div class="flex items-center gap-3 border-b border-border px-6 py-3">
    <button class="inline-flex h-7 items-center gap-2 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60">
      <i class="ri-bookmark-line text-sm text-muted-foreground"></i> live
      <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
    </button>
    ${pill('unsaved changes', 'warn')}
    <span class="text-[12px] text-muted-foreground">4 surfaces · 5 scenarios · 6 targets</span>
    <div class="ml-auto flex gap-2">
      ${btn('Save as preset', 'outline', 'ri-bookmark-line')}
      ${btn('Save', 'primary', 'ri-check-line')}
    </div>
  </div>

  <div class="relative overflow-hidden border-b border-border bg-muted/20">
    <!-- Canvas controls, as in the current @xyflow build -->
    <div class="absolute left-4 top-4 z-10 flex flex-col overflow-hidden rounded-md border border-border bg-background">
      <button class="px-2 py-1.5 text-muted-foreground hover:bg-muted/60"><i class="ri-add-line text-sm"></i></button>
      <button class="border-t border-border px-2 py-1.5 text-muted-foreground hover:bg-muted/60"><i class="ri-subtract-line text-sm"></i></button>
      <button class="border-t border-border px-2 py-1.5 text-muted-foreground hover:bg-muted/60"><i class="ri-focus-3-line text-sm"></i></button>
    </div>
    <div class="absolute bottom-4 right-4 z-10 flex items-center gap-3 rounded-md border border-border bg-background px-3 py-1.5">
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground"><span class="size-1.5 rounded-full bg-emerald-500"></span>ready</span>
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground"><span class="size-1.5 rounded-full bg-amber-500"></span>throttled</span>
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground"><span class="size-1.5 rounded-full bg-destructive"></span>exhausted</span>
      <span class="ml-1 border-l border-border pl-3 text-[12px] text-muted-foreground">┄ passthrough</span>
    </div>
    ${canvas}
  </div>

  <div class="px-6 py-4">
    <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
      <i class="ri-information-line mr-1 align-[-1px]"></i>
      Dashed edges bypass the router entirely — that surface is in passthrough and jumps straight to
      whatever target the caller named. Drag a surface onto a scenario to switch it to routed.
    </div>
  </div>
  <div class="h-6"></div>`

renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Map'],
  subtitle: 'live · 4 surfaces · 5 scenarios · 6 targets',
  actions:
    btn('Presets', 'outline', 'ri-archive-drawer-line') +
    btn('Simulate', 'ghost', 'ri-play-line', 'routing-rules.html')
})
</script>
</body>
</html>
