<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Activity</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, surfacePill, navTo, sortTh } = window.Shell

// Sessions / Usage / ApiCost / LogViewer were four screens answering the
// same question at different zoom levels. One screen, four tabs, one
// shared filter bar. The strip itself comes from shell.js so every
// Activity screen offers the same four destinations.

const filter = (label, value) => `
  <button class="inline-flex h-7 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs transition-colors hover:bg-muted/60">
    <span class="text-muted-foreground">${label}</span>
    <span>${value}</span>
    <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
  </button>`

const SESSIONS = [
  { id: 'ses_9fa2…c41', surface: '/v1/messages',  model: 'claude-opus-4-8',   turns: 42, inTok: '284k', outTok: '34.1k', cache: '78%', cost: '$1.24' },
  { id: 'ses_71bd…08e', surface: '/v1/responses', model: 'gpt-5.5',           turns: 17, inTok: '88.4k', outTok: '7.80k', cache: '41%', cost: '$0.412' },
  { id: 'ses_04c7…9aa', surface: '/v1beta/models/*',    model: 'gemini-3.1-pro',    turns: 8,  inTok: '38.2k', outTok: '3.50k', cache: '0%',  cost: '$0.0930' },
  { id: 'ses_ba51…2f0', surface: '/v1/messages',  model: 'claude-sonnet-4-6', turns: 91, inTok: '641k', outTok: '61.4k', cache: '85%', cost: '$2.06' },
  { id: 'ses_3d90…7bc', surface: '/v1/chat/completions',      model: 'gpt-5.4-mini',      turns: 4,  inTok: '9.10k', outTok: '1.20k', cache: '0%',  cost: '$0.00610' },
  { id: 'ses_c18e…44d', surface: '/v1/messages',  model: 'claude-fable-5',    turns: 63, inTok: '412k', outTok: '48.9k', cache: '81%', cost: '$1.71' }
]

const sessionRow = (s) => `
  <tr ${navTo('activity-session.html')} class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <!-- A short form of the session id, and nothing else. The full uuid
         was 36 characters that no eye can tell apart, and the opening
         turn of the conversation is the operator's own prompt text —
         readable over someone's shoulder, and not what this row is for.
         Both are on the session's own screen, which is one click away
         and is where you go to read the conversation. -->
    <td class="py-3 pl-6 pr-3">
      <div class="truncate font-mono text-xs">${s.id}</div>
    </td>
    <td class="px-3">${surfacePill(s.surface)}</td>
    <td class="px-3 font-mono text-[12px] text-muted-foreground">${s.model}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.turns}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.inTok}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.outTok}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums text-muted-foreground">${s.cache}</td>
    <td class="px-3 text-right font-mono text-xs tabular-nums">${s.cost}</td>

  </tr>`

const table = `
  <table class="w-full table-fixed">
    <colgroup><col class="w-44"><col class="w-40"><col><col class="w-16"><col class="w-20"><col class="w-20"><col class="w-16"><col class="w-24"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        ${sortTh('Session', 'pl-6 pr-3')}
        ${sortTh('Endpoint', 'px-3')}
        ${sortTh('Model', 'px-3')}
        ${sortTh('Turns', 'px-3', 'right')}
        ${sortTh('Input', 'px-3', 'right')}
        ${sortTh('Output', 'px-3', 'right')}
        ${sortTh('Cache', 'px-3', 'right')}
        ${sortTh('Cost', 'pl-3 pr-6', 'right', true, 'desc')}

      </tr>
    </thead>
    <tbody>${SESSIONS.map(sessionRow).join('')}</tbody>
  </table>

  <!-- Paging, because the list is unbounded and the screen was showing
       whatever the first fetch happened to return. The range is spelled
       out rather than a page number: "26–50 of 128" answers both "where
       am I" and "how much is there", and a page number answers neither
       without knowing the page size. -->
  <div class="flex items-center gap-3 border-t border-border px-6 py-3">
    <span class="text-[12px] text-muted-foreground">1–25 of 128</span>
    <div class="ml-auto flex items-center gap-2">
      <button class="inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-xs font-medium text-muted-foreground opacity-50" disabled>
        <i class="ri-arrow-left-s-line text-sm leading-none"></i>Previous
      </button>
      <button class="inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-xs font-medium hover:bg-muted/60">
        Next<i class="ri-arrow-right-s-line text-sm leading-none"></i>
      </button>
    </div>
  </div>`

const stat = (label, value, sub, href) => `
  <div ${navTo(href)} class="border-l-2 border-l-border px-4 py-3 transition-colors hover:border-l-foreground/30 hover:bg-muted/50">
    <div class="text-[12px] uppercase tracking-wider text-muted-foreground">${label}</div>
    <div class="mt-1 font-mono text-lg tabular-nums">${value}</div>
    <div class="text-[12px] text-muted-foreground">${sub}</div>
  </div>`

document.getElementById('root').innerHTML = `

  <div class="flex flex-wrap items-center gap-2 border-b border-border px-6 py-3">
    ${filter('Surface', 'All')}
    ${filter('Provider', 'All')}
    ${filter('Model', 'All')}
    ${filter('Range', 'Last 7 days')}
    <!-- No search box and no Export. The rows are named by a short id
         now, so there is nothing on this screen worth typing at; finding
         a session is what the filters and ⌘K are for. Export stays on
         Requests, where a row is a measurement someone takes away. -->
  </div>

  <div class="grid grid-cols-4 gap-px border-b border-border px-6 py-4">
    ${stat('Requests', '18,742', 'last 7 days', 'activity-requests.html')}
    ${stat('Tokens', '41.2M', 'in + out', 'activity-usage.html')}
    ${stat('Cost', '$31.7', 'API-key providers only', 'activity-usage.html')}
    ${stat('Cache hit', '73.4%', 'weighted by input tokens', 'activity-usage.html')}
  </div>

  ${table}
  <div class="h-10"></div>`

renderShell({
  active: 'activity',
  navMode: 'cloudflare',
  sub: 'sessions',
  crumbs: ['Sessions'],
  subactions:
    btn('Live tail', 'outline', 'ri-broadcast-line', 'activity-requests.html') +
    btn('Archive', 'ghost', 'ri-archive-line')
})
</script>
</body>
</html>
