<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, btn, navTo, dialog, pill } = window.Shell

// ─── Surfaces ─────────────────────────────────────────────────────────
// The surface is the outermost selector: pick which wire format you are
// configuring, then whether the router applies to it at all. A filled
// dot is routed, a hollow one passthrough — the old build bypassed the
// router on two surfaces and said so nowhere, so the mode stays visible
// on every tab.
const SURFACES = [
  { id: 'messages',  label: '/v1/messages',         mode: 'routed' },
  { id: 'chat',      label: '/v1/chat/completions', mode: 'routed' },
  { id: 'responses', label: '/v1/responses',        mode: 'passthrough' },
  { id: 'gemini',    label: '/v1beta/models/*',     mode: 'passthrough' }
]
const ACTIVE_SURFACE = 'messages'

const surfaceTab = (s) => {
  const on = s.id === ACTIVE_SURFACE
  const href = s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html'
  const dot = s.mode === 'routed'
    ? '<span class="size-1.5 shrink-0 rounded-full bg-emerald-500"></span>'
    : '<span class="size-1.5 shrink-0 rounded-full border border-muted-foreground/50"></span>'
  return `
    <button ${navTo(href)} class="flex items-center gap-2 border-b-2 px-3 py-2.5 transition-colors ${
      on ? 'border-b-foreground' : 'border-b-transparent hover:bg-muted/50'
    }">
      ${dot}
      <span class="whitespace-nowrap font-mono text-xs ${on ? 'text-foreground' : 'text-muted-foreground'}">${s.label}</span>
    </button>`
}

// ─── Scenarios ────────────────────────────────────────────────────────
// Routing is an assignment per scenario and per caller — the agent, or a
// subagent (a request carrying the subagent tag): one or more provider ·
// tier combinations, tried top first. The second takes a request only
// when the first cannot (out of quota, failing, or unable to hold it).
// That is the whole screen: a provider and a tier, nothing else. The
// model is neither picked nor shown here — the provider's tier alias, set
// on its page, says which model "sonnet" is, so a vendor's new model
// moves one alias instead of this table.
//
// Earlier drafts stacked a summary, a quota strip, a status per row, a
// block of constraints, and the resolved model beside every combination.
// None of it was asked for: the question an operator brings here is which
// provider and tier each scenario uses.
const R = (provider, tier, on = true) => ({ provider, tier, on })
const SCENARIOS = [
  {
    label: 'Default',
    when: 'everything the rows below do not catch',
    agent: [R('claude-code', 'sonnet'), R('codex', 'sonnet', false)],
    subagent: [R('claude-code', 'haiku'), R('claude-code', 'sonnet')]
  },
  {
    label: 'Think',
    when: 'extended thinking is on',
    agent: [R('claude-code', 'opus'), R('claude-code', 'sonnet')],
    subagent: [R('claude-code', 'sonnet')]
  },
  {
    label: 'Long context',
    // The threshold is automatic: 70% of the context window of the first
    // Default · Agent combination, leaving the reply room — 700k here,
    // for a 1M-token Sonnet. It follows the alias, so it moves by itself
    // when the Default model changes.
    when: 'input over 700k tokens (auto)',
    agent: [R('claude-code', 'fable'), R('claude-code', 'opus')],
    subagent: []
  }
]

// The screen reads until Edit is pressed; routing.html?edit draws the
// state after it.
const EDITING = new URLSearchParams(location.search).has('edit')

// What a combination can be: every provider's tiers. A tier the provider
// has no model for (its alias is unset) cannot be chosen — it would
// reach nothing.
const PROVIDERS = [
  { name: 'claude-code', tiers: [['fable', true], ['opus', true], ['sonnet', true], ['haiku', true]] },
  { name: 'codex',       tiers: [['fable', false], ['opus', true], ['sonnet', true], ['haiku', true]] },
  { name: 'openai',      tiers: [['fable', false], ['opus', true], ['sonnet', true], ['haiku', true]] }
]

// A combination is shown, not edited in place. Picking one is a
// decision in two steps — which provider, then which of its tiers — so
// it happens in a dialog (?edit&add, ?edit&add=tier), opened by Add or
// by clicking a line to change it. An earlier draft put a provider
// select and a tier select side by side on every line: two controls for
// one decision, the second's options depending on the first.
//
// Every line is the same grid in both states, so the columns line up
// down a cell and across the table: handle, order, the combination, on,
// remove. The provider is a name and the tier a badge: a tier is a class
// of model, not a thing of the same kind as the provider beside it. A combination switched off keeps its place and is skipped.
const LINE = 'grid grid-cols-[1rem_1rem_minmax(0,22rem)_1.75rem_1.5rem] items-center gap-2'

const toggle = (on) => `
  <span class="inline-flex h-4 w-7 items-center rounded-full ${on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5 ${EDITING ? 'cursor-pointer' : 'opacity-50'}">
    <span class="size-3 rounded-full bg-background ${on ? 'translate-x-3' : ''}"></span>
  </span>`

const combination = (r, i) => `
  <div class="${LINE} min-h-8">
    <i class="ri-draggable text-base leading-none text-muted-foreground/50 ${EDITING ? '' : 'invisible'}"></i>
    <span class="font-mono text-[12px] tabular-nums text-muted-foreground">${i + 1}</span>
    <div class="flex h-8 items-center gap-2 rounded-md px-2.5 ${EDITING ? 'cursor-pointer border border-border hover:bg-muted/60' : ''} ${r.on ? '' : 'opacity-50'}">
      <span class="font-mono text-xs">${r.provider}</span>${pill(r.tier, 'mute')}
    </div>
    ${toggle(r.on)}
    <button class="text-muted-foreground/60 hover:text-foreground ${EDITING ? '' : 'invisible'}"><i class="ri-close-line text-sm"></i></button>
  </div>`

// ─── The dialog ───────────────────────────────────────────────────────
// Step 1: which provider. Step 2: which of its tiers; a tier the provider
// has no model for is disabled.
const ADD = new URLSearchParams(location.search).get('add')

// A provider reads as its name; a tier reads as the same badge it wears in
// the table, so the two steps pick visibly different kinds of thing. The
// chosen line is ringed rather than filled: a muted fill would swallow
// the muted badge inside it.
const option = (label, detail, { on = false, disabled = false, arrow = false, tier = false } = {}) => `
  <button class="flex h-10 w-full items-center gap-3 rounded-md px-3 text-left ${disabled ? 'cursor-not-allowed text-muted-foreground/50' : on ? 'ring-1 ring-foreground/20' : 'hover:bg-muted/60'}">
    <span class="w-4">${on ? '<i class="ri-check-line text-sm"></i>' : ''}</span>
    ${tier ? `<span class="${disabled ? 'opacity-50' : ''}">${pill(label, 'mute')}</span>` : `<span class="font-mono text-xs">${label}</span>`}
    <span class="ml-auto text-[12px] ${disabled ? '' : 'font-mono text-muted-foreground'}">${detail}</span>
    ${arrow ? '<i class="ri-arrow-right-s-line text-sm text-muted-foreground"></i>' : ''}
  </button>`

const providerStep = dialog(
  'Add provider · tier — Default, Agent',
  `<div class="grid gap-1">
    <div class="text-[12px] text-muted-foreground">1. Choose a provider</div>
    ${PROVIDERS.map((p) => option(p.name, '', { arrow: true })).join('')}
  </div>`,
  btn('Cancel', 'ghost')
)

const tierStep = dialog(
  'Add provider · tier — Default, Agent',
  `<div class="grid gap-1">
    <div class="flex items-center gap-2 text-[12px] text-muted-foreground">
      <button class="inline-flex items-center gap-1 hover:text-foreground"><i class="ri-arrow-left-s-line text-sm"></i>codex</button>
      <span>·</span><span>2. Choose a tier</span>
    </div>
    ${PROVIDERS[1].tiers
      .map(([tier, set]) =>
        !set
          ? option(tier, '<span class="font-sans">not set</span>', { disabled: true, tier: true })
          : option(tier, '', { on: tier === 'sonnet', tier: true })
      )
      .join('')}
  </div>`,
  `${btn('Cancel', 'ghost')}${btn('Add', 'primary', 'ri-add-line')}`
)

// Add sits on the combination column, dashed, where the next line would
// go. It opens the dialog.
const addLine = `
  <div class="${LINE}">
    <span></span><span></span>
    <button class="flex h-8 items-center gap-1.5 rounded-md border border-dashed border-border px-2.5 text-[12px] text-muted-foreground hover:bg-muted/60 hover:text-foreground"><i class="ri-add-line text-sm"></i>Add provider · tier</button>
    <span></span>
  </div>`

const cell = (routes, isDefault) => `
  <td class="px-2 py-3">
    <div class="grid gap-1.5">
      ${
        routes.length === 0
          ? `<div class="${LINE} min-h-8"><span></span><span></span><span class="px-2.5 text-[12px] text-muted-foreground">${isDefault ? 'none — the requested model is used' : 'none — uses Default'}</span><span></span></div>`
          : routes.map(combination).join('')
      }
      ${EDITING ? addLine : ''}
    </div>
  </td>`

const row = (sc) => `
  <tr class="border-t border-border/60 align-top">
    <td class="py-3 pl-6 pr-2">
      <div class="text-xs font-medium">${sc.label}</div>
      <div class="text-[12px] text-muted-foreground">${sc.when}</div>
    </td>
    ${cell(sc.agent, sc.label === 'Default')}
    ${cell(sc.subagent, sc.label === 'Default')}
  </tr>`

document.getElementById('root').innerHTML = `

  <!-- Band 1 — which surface. Locked while editing. -->
  <div class="flex items-center gap-1 border-b border-border pl-4 pr-6 ${EDITING ? '[&>button]:pointer-events-none [&>button]:opacity-50' : ''}">
    ${SURFACES.map(surfaceTab).join('')}
  </div>

  <!-- Band 2 — the selected surface's own settings: routed or
       passthrough, and which profile it reads. -->
  <div class="flex items-center gap-3 border-b border-border bg-muted/30 px-6 py-2.5">
    <span class="whitespace-nowrap font-mono text-xs">/v1/messages</span>
    <span class="whitespace-nowrap text-[12px] text-muted-foreground">Claude Code</span>
    <span class="mx-1 h-4 w-px shrink-0 bg-border"></span>
    <div class="flex rounded-md border border-border p-0.5 ${EDITING ? 'pointer-events-none opacity-50' : ''}">
      <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Routed</button>
      <button ${navTo('routing-passthrough.html')} class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Passthrough</button>
    </div>
    <span class="mx-1 h-4 w-px shrink-0 bg-border"></span>
    <button class="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60 ${EDITING ? 'pointer-events-none opacity-50' : ''}">
      <span class="text-muted-foreground">Profile</span> live <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
    </button>
  </div>

  <!-- Band 3 — the assignments, and Edit / Save. -->
  <div class="flex items-center gap-3 border-b border-border px-6 py-2.5">
    <span class="text-xs font-medium">Scenarios</span>
    <span class="text-[12px] text-muted-foreground">provider · tier combinations per scenario, for the agent and for subagents, tried top first</span>
    <div class="ml-auto flex items-center gap-2">
      ${EDITING ? `${btn('Revert', 'outline', 'ri-arrow-go-back-line')}${btn('Save', 'primary', 'ri-check-line')}` : btn('Edit', 'outline', 'ri-pencil-line')}
    </div>
  </div>

  <table class="w-full table-fixed">
    <colgroup><col class="w-72"><col><col></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-2 text-left font-medium">Scenario</th>
        <th class="px-2 text-left font-medium">Agent</th>
        <th class="px-2 text-left font-medium">Subagent</th>
      </tr>
    </thead>
    <tbody>${SCENARIOS.map(row).join('')}</tbody>
  </table>

  ${EDITING && ADD !== null ? (ADD === 'tier' ? tierStep : providerStep) : ''}`

renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Scenarios']
})
</script>
</body>
</html>
