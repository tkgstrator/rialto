<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, mono, meter, btn, navTo, selectorBar } = window.Shell

// ─── The fix for "every routing setting is messages-only" ─────────────
// The old build hard-coded a router bypass for /v1/chat/completions and
// /v1/responses (scenario-router.ts:117-128) and nothing in the UI said
// so. Here the surface is the OUTERMOST selector: you pick which wire
// format you are configuring, then whether the router applies to it at
// all, and only then the scenario / lane / chain.
const SURFACES = [
  { id: 'messages',  label: '/v1/messages',         mode: 'routed',      hint: 'Claude Code' },
  { id: 'chat',      label: '/v1/chat/completions', mode: 'routed',      hint: 'OpenAI SDK' },
  { id: 'responses', label: '/v1/responses',        mode: 'passthrough', hint: 'Codex CLI' },
  { id: 'gemini',    label: '/v1beta/models/*',     mode: 'passthrough', hint: 'Gemini CLI' }
]
const ACTIVE_SURFACE = 'messages'

// The outermost axis has to be walkable, so picking a passthrough surface
// lands on the passthrough half of this screen rather than doing nothing.
const surfaceTab = (s) => {
  const on = s.id === ACTIVE_SURFACE
  const href = s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html'
  return `
    <button ${navTo(href)} class="relative flex flex-col items-start gap-0.5 border-b-2 px-4 py-2.5 text-left transition-colors ${
      on ? 'border-b-foreground' : 'border-b-transparent hover:bg-muted/50'
    }">
      <span class="font-mono text-xs ${on ? 'text-foreground' : 'text-muted-foreground'}">${s.label}</span>
      <span class="flex items-center gap-1.5 text-[12px] text-muted-foreground">
        ${s.hint} · ${s.mode === 'routed' ? '<span class="text-emerald-600 dark:text-emerald-400">routed</span>' : 'passthrough'}
      </span>
    </button>`
}

const SCENARIOS = [
  { id: 'default',     label: 'Default',      count: 5 },
  { id: 'think',       label: 'Think',        count: 4 },
  { id: 'longContext', label: 'Long context', count: 3 },
  { id: 'webSearch',   label: 'Web search',   count: 2 },
  { id: 'image',       label: 'Image',        count: 2 }
]
const ACTIVE_SCENARIO = 'default'

const scenarioTab = (s) => {
  const on = s.id === ACTIVE_SCENARIO
  return `
    <!-- py-3, not py-2: the strip is the one place a scenario is
         switched, and at 8px of padding it read as a caption over the
         table rather than a control you aim at. -->
    <button class="flex items-center gap-2 border-b-2 px-3 py-3 text-xs transition-colors ${
      on ? 'border-b-foreground font-medium' : 'border-b-transparent text-muted-foreground hover:text-foreground'
    }">
      ${s.label}<span class="font-mono text-[12px] tabular-nums text-muted-foreground">${s.count}</span>
    </button>`
}

// ─── Preference chain ─────────────────────────────────────────────────
// Priority order is the whole point, so the row leads with the ordinal
// and a drag handle. Share is each enabled target's slice of this lane's
// scheduler weight, apportioned so the column adds up to exactly 100%.
// A row switched off, or one the scheduler has not scored, takes no
// slice and reads `–` instead of 0% — it is not competing for the lane.
const CHAIN = [
  // Shares are apportioned from the weights 0.60 / 1.00 / 0.00 / 1.00
  // (total 2.60) by largest remainder, which is what makes 23+39+0+38
  // land on 100 instead of the 99 that plain rounding gives.
  { n: 1, target: 'claude-code,claude-opus-4-8',  tier: 'opus',   share: '23%',  state: 'throttled', on: true },
  { n: 2, target: 'claude-code,claude-fable-5',   tier: 'fable',  share: '39%',  state: 'ready',     on: true },
  { n: 3, target: 'codex,gpt-5.5',                tier: 'opus',   share: '0%',   state: 'exhausted', on: true },
  // Tier null on purpose: no Gemini name says a Claude family, so the
  // router cannot classify it and nobody has set a manualTier in
  // Providers. It is the row the tier-respect floor below cannot hold.
  // State `unknown`, but it still takes a share: no quota window means
  // the scheduler has no reading to publish, not that the target is out
  // of the running. The pill says the number behind it is a policy
  // default rather than a measurement.
  { n: 4, target: 'gemini-cli,gemini-3.1-pro',    tier: null,     share: '38%',  state: 'unknown',   on: true },
  // Switched off: it takes no share of the lane, so the cell is a dash
  // rather than a 0% that would read as "lost the apportionment".
  { n: 5, target: 'claude-code,claude-sonnet-4-6',tier: 'sonnet', share: null,   state: 'ready',     on: false }
]

const stateTone = { ready: 'ok', throttled: 'warn', exhausted: 'bad', unknown: 'mute' }

// A chain entry names "provider,model", and the provider is where its
// credentials, accounts and model list live. The mock set has one detail
// screen per auth mode, so the vendor half of the pair picks which.
const SUBSCRIPTION_PROVIDERS = ['claude-code', 'codex', 'gemini-cli']
const providerHref = (t) =>
  SUBSCRIPTION_PROVIDERS.includes(t.split(',')[0]) ? 'providers.html' : 'providers-apikey.html'

// The model half of "provider,model", unless another row in the lane
// carries the same model under a different provider.
const modelOf = (t) => t.slice(t.indexOf(',') + 1)
const ambiguous = new Set(
  CHAIN.map((e) => modelOf(e.target)).filter((m, i, all) => all.indexOf(m) !== i)
)
const label = (t) => (ambiguous.has(modelOf(t)) ? t : modelOf(t))

const chainRow = (e) => `
  <tr ${navTo(providerHref(e.target))} class="border-t border-border/60 transition-colors hover:bg-muted/50 ${e.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2">
      <div class="flex items-center gap-2">
        <i class="ri-draggable text-base leading-none text-muted-foreground/50"></i>
        <span class="font-mono text-xs tabular-nums text-muted-foreground">${e.n}</span>
      </div>
    </td>
    <!-- Model name only. The provider half repeats down the column and
         is one click away on the row itself; it comes back only when two
         rows in the same lane would otherwise read identically (the same
         model served by a subscription and by an api_key provider). -->
    <td class="px-2 font-mono text-xs">${label(e.target)}</td>
    <td class="px-2">${
      e.tier === null ? '<span class="text-[12px] text-muted-foreground/50">—</span>' : pill(e.tier, 'mute')
    }</td>
    <td class="px-2">${pill(e.state, stateTone[e.state])}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums ${e.share === null ? 'text-muted-foreground' : ''}">${
      e.share === null ? '–' : e.share
    }</td>
    <td class="py-2.5 pl-2 pr-6">
      <div class="flex items-center justify-end gap-1">
        <span class="inline-flex h-4 w-7 items-center rounded-full ${e.on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5">
          <span class="size-3 rounded-full bg-background ${e.on ? 'translate-x-3' : ''}"></span>
        </span>
        <button class="ml-1 text-muted-foreground/60 hover:text-foreground"><i class="ri-more-2-fill text-sm"></i></button>
      </div>
    </td>
  </tr>`

const chain = `
  <table class="w-full table-fixed">
    <colgroup><col class="w-16"><col><col class="w-20"><col class="w-24"><col class="w-20"><col class="w-24"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:pb-2">
        <th class="pl-6 pr-2 text-left font-medium">#</th>
        <th class="px-2 text-left font-medium">Target</th>
        <th class="px-2 text-left font-medium">Tier</th>
        <th class="px-2 text-left font-medium">State</th>
        <th class="px-2 text-right font-medium">Share</th>
        <th class="pl-2 pr-6 text-right font-medium">On</th>
      </tr>
    </thead>
    <tbody>${CHAIN.map(chainRow).join('')}</tbody>
  </table>`

// ─── Right rail: constraints + rules ──────────────────────────────────
const constraint = (label, value, hint) => `
  <div class="border-l-2 border-l-transparent px-4 py-3 transition-colors hover:border-l-border hover:bg-muted/50">
    <div class="flex items-baseline gap-2">
      <span class="text-xs">${label}</span>
      <span class="ml-auto font-mono text-xs">${value}</span>
    </div>
    <div class="mt-0.5 text-[12px] text-muted-foreground">${hint}</div>
  </div>`

const RULES = [
  { when: 'requestedModel matches <span class="font-mono">*haiku*</span>', then: 'claude-code,claude-haiku-4-5' },
  { when: 'tokens &gt; <span class="font-mono">60,000</span>', then: 'longContext chain' },
  { when: 'has <span class="font-mono">&lt;RIALTO-SUBAGENT-MODEL&gt;</span>', then: 'subagent lane' }
]

const rule = (r) => `
  <div ${navTo('routing-rules.html')} class="border-l-2 border-l-transparent px-4 py-3 transition-colors hover:border-l-border hover:bg-muted/50">
    <div class="text-[12px] uppercase tracking-wider text-muted-foreground">when</div>
    <div class="mt-0.5 text-xs">${r.when}</div>
    <div class="mt-2 text-[12px] uppercase tracking-wider text-muted-foreground">then</div>
    <div class="mt-0.5 font-mono text-xs">${r.then}</div>
  </div>`

document.getElementById('root').innerHTML = `
  ${selectorBar('chain')}

  <!-- Surface selector: the outermost axis of the whole screen -->
  <div class="flex items-stretch gap-0 border-b border-border px-2">
    ${SURFACES.map(surfaceTab).join('')}
  </div>

  <!-- Mode + profile for the selected surface -->
  <div class="flex items-center gap-4 border-b border-border bg-muted/30 px-6 py-3">
    <div class="flex items-center gap-2">
      <span class="text-xs text-muted-foreground">Routing</span>
      <div class="flex rounded-md border border-border p-0.5">
        <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Routed</button>
        <button ${navTo('routing-passthrough.html')} class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Passthrough</button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-muted-foreground">Profile</span>
      <button class="inline-flex h-7 items-center gap-2 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60">
        live <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
      </button>
    </div>
    <p class="ml-auto max-w-md text-right text-[12px] leading-snug text-muted-foreground">
      Passthrough sends the caller's <span class="font-mono">provider,model</span> straight upstream.
      Routed applies scenarios, rules and quota-aware failover.
    </p>
  </div>

  <div class="grid grid-cols-[1fr_20rem]">
    <div class="min-w-0 border-r border-border">
      <div class="flex items-center gap-1 border-b border-border px-6">
        ${SCENARIOS.map(scenarioTab).join('')}
      </div>

      <div class="flex items-center gap-3 px-6 py-3">
        <div class="flex rounded-md border border-border p-0.5">
          <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Agent</button>
          <button class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Subagent</button>
        </div>
        <span class="text-[12px] text-muted-foreground">5 targets · 1 disabled</span>
        <div class="ml-auto flex gap-2">
          ${btn('Add target', 'outline', 'ri-add-line')}
          ${btn('Save', 'primary', 'ri-check-line')}
        </div>
      </div>

      ${chain}

      <div class="px-6 py-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          Order is preference, top first: the router walks the chain from the top and sends the request to
          the first target it can use, so <span class="font-mono">Share</span> is each target's slice of this
          lane's scheduler weight — not the fraction of traffic it will see. A target is skipped when it is
          disabled, exhausted, or its share is <span class="font-mono">0%</span>. The weights are published
          by the routing scheduler every tick — edit the chain, not the numbers.
        </div>
      </div>
    </div>

    <aside class="min-w-0">
      <div class="px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Constraints</h2>
      </div>
      ${constraint(
        'Tier respect',
        'sonnet',
        'never fall below this tier. A target whose tier is unknown is not held by it — set one in <a href="providers-apikey.html" class="underline underline-offset-2">Providers</a>.'
      )}
      ${constraint('Healthiness floor', '95%', 'skip targets below this')}
      ${constraint('When exhausted', 'next', 'next / wait / error')}
      ${constraint('Cross-provider', 'on', 'allow different auth modes')}

      <div class="border-t border-border px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Rules</h2>
      </div>
      ${RULES.map(rule).join('')}

      <div class="border-t border-border px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Presets</h2>
      </div>
      <div class="px-4 pb-6">
        <!-- Two kinds of row, and the difference is worth showing rather
             than labelling: a built-in is a chain of TIERS, resolved
             against whatever models this install has enabled at the
             moment you apply it, so its second line is the chain itself.
             A saved snapshot already names models and needs no gloss. -->
        <div class="flex items-center gap-2 rounded-md border border-border px-3 py-2 text-xs">
          <i class="ri-stack-line text-sm text-muted-foreground"></i>
          <div class="min-w-0">
            <div class="truncate">Max quality</div>
            <div class="truncate font-mono text-[11px] text-muted-foreground">fable → opus → sonnet</div>
          </div>
          <span class="ml-auto shrink-0 text-[12px] text-muted-foreground">Apply</span>
        </div>
        <div class="mt-2 flex items-center gap-2 rounded-md border border-border px-3 py-2 text-xs">
          <i class="ri-stack-line text-sm text-muted-foreground"></i>
          <div class="min-w-0">
            <div class="truncate">Cost saver</div>
            <div class="truncate font-mono text-[11px] text-muted-foreground">haiku → sonnet</div>
          </div>
          <span class="ml-auto shrink-0 text-[12px] text-muted-foreground">Apply</span>
        </div>
        <div ${navTo('settings-presets.html')} class="mt-2 flex items-center gap-2 rounded-md border border-border px-3 py-2 text-xs">
          <i class="ri-bookmark-line text-sm text-muted-foreground"></i>
          <span class="truncate">Subscription first</span>
          <span class="ml-auto shrink-0 text-[12px] text-muted-foreground">Apply</span>
        </div>
      </div>
    </aside>
  </div>`

renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Chain'],
  subtitle: 'Per inbound surface · scenario · lane',
  // The only doors to Map and Rules now that the sidebar lists Routing
  // alone, so they name the destination rather than what you do there.
  actions:
    btn('Map', 'ghost', 'ri-node-tree', 'routing-map.html') +
    btn('Rules', 'ghost', 'ri-filter-3-line', 'routing-rules.html')
})
</script>
</body>
</html>
