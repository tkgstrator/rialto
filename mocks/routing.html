<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, btn, navTo } = window.Shell

// ─── Surfaces ─────────────────────────────────────────────────────────
// The surface is the outermost selector: pick which wire format you are
// configuring, then whether the router applies to it at all. A filled
// dot is routed, a hollow one passthrough — the old build bypassed the
// router on two surfaces and said so nowhere, so the mode stays visible
// on every tab.
const SURFACES = [
  { id: 'messages',  label: '/v1/messages',         mode: 'routed' },
  { id: 'chat',      label: '/v1/chat/completions', mode: 'routed' },
  { id: 'responses', label: '/v1/responses',        mode: 'passthrough' },
  { id: 'gemini',    label: '/v1beta/models/*',     mode: 'passthrough' }
]
const ACTIVE_SURFACE = 'messages'

const surfaceTab = (s) => {
  const on = s.id === ACTIVE_SURFACE
  const href = s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html'
  const dot = s.mode === 'routed'
    ? '<span class="size-1.5 shrink-0 rounded-full bg-emerald-500"></span>'
    : '<span class="size-1.5 shrink-0 rounded-full border border-muted-foreground/50"></span>'
  return `
    <button ${navTo(href)} class="flex items-center gap-2 border-b-2 px-3 py-2.5 transition-colors ${
      on ? 'border-b-foreground' : 'border-b-transparent hover:bg-muted/50'
    }">
      ${dot}
      <span class="whitespace-nowrap font-mono text-xs ${on ? 'text-foreground' : 'text-muted-foreground'}">${s.label}</span>
    </button>`
}

// ─── Scenarios ────────────────────────────────────────────────────────
// Routing is one assignment per scenario: which provider, and which tier
// on it. That is the whole screen. The model is not picked here — the
// provider's tier alias, set on its page, says which model "sonnet" is —
// so a vendor's new model moves one alias instead of this table.
//
// Earlier drafts stacked a summary, a quota strip, an ordered list per
// scenario and lane with a status per row, and a block of constraints.
// None of it was asked for: the question an operator brings here is
// which provider and tier each scenario uses.
const SCENARIOS = [
  { label: 'Default',      when: 'everything the rows below do not catch', provider: 'claude-code', tier: 'sonnet', model: 'claude-sonnet-5' },
  { label: 'Think',        when: 'extended thinking is on',                provider: 'claude-code', tier: 'opus',   model: 'claude-opus-5' },
  { label: 'Long context', when: 'input over 200k tokens',                 provider: 'claude-code', tier: 'fable',  model: 'claude-fable-5' },
  { label: 'Subagent',     when: 'the request carries the subagent tag',   provider: 'claude-code', tier: 'haiku',  model: 'claude-haiku-4-5' }
]

// The screen reads until Edit is pressed; routing.html?edit draws the
// state after it.
const EDITING = new URLSearchParams(location.search).has('edit')

// Reading: the value as text. Editing: the same value in a select box.
// The model the tier resolves to rides along muted, so "sonnet" is never
// a mystery and a changed alias shows up here without an edit.
const selectBox = (value) =>
  `<button class="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-2.5 font-mono text-xs hover:bg-muted/60">${value} <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i></button>`
const valueCell = (value) => (EDITING ? selectBox(value) : `<span class="font-mono text-xs">${value}</span>`)

const row = (sc) => `
  <tr class="border-t border-border/60">
    <td class="py-3 pl-6 pr-2">
      <div class="text-xs font-medium">${sc.label}</div>
      <div class="text-[12px] text-muted-foreground">${sc.when}</div>
    </td>
    <td class="px-2 py-3">${valueCell(sc.provider)}</td>
    <td class="px-2 py-3">
      <div class="flex items-center gap-3">
        ${valueCell(sc.tier)}
        <span class="font-mono text-[12px] text-muted-foreground">${sc.model}</span>
      </div>
    </td>
  </tr>`

document.getElementById('root').innerHTML = `

  <!-- Band 1 — which surface. Locked while editing. -->
  <div class="flex items-center gap-1 border-b border-border pl-4 pr-6 ${EDITING ? '[&>button]:pointer-events-none [&>button]:opacity-50' : ''}">
    ${SURFACES.map(surfaceTab).join('')}
  </div>

  <!-- Band 2 — the selected surface's own settings: routed or
       passthrough, and which profile it reads. -->
  <div class="flex items-center gap-3 border-b border-border bg-muted/30 px-6 py-2.5">
    <span class="whitespace-nowrap font-mono text-xs">/v1/messages</span>
    <span class="whitespace-nowrap text-[12px] text-muted-foreground">Claude Code</span>
    <span class="mx-1 h-4 w-px shrink-0 bg-border"></span>
    <div class="flex rounded-md border border-border p-0.5 ${EDITING ? 'pointer-events-none opacity-50' : ''}">
      <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Routed</button>
      <button ${navTo('routing-passthrough.html')} class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Passthrough</button>
    </div>
    <span class="mx-1 h-4 w-px shrink-0 bg-border"></span>
    <button class="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60 ${EDITING ? 'pointer-events-none opacity-50' : ''}">
      <span class="text-muted-foreground">Profile</span> live <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
    </button>
  </div>

  <!-- Band 3 — the assignments, and Edit / Save. -->
  <div class="flex items-center gap-3 border-b border-border px-6 py-2.5">
    <span class="text-xs font-medium">Scenarios</span>
    <span class="text-[12px] text-muted-foreground">each scenario uses one provider and one tier on it</span>
    <div class="ml-auto flex items-center gap-2">
      ${EDITING ? `${btn('Revert', 'outline', 'ri-arrow-go-back-line')}${btn('Save', 'primary', 'ri-check-line')}` : btn('Edit', 'outline', 'ri-pencil-line')}
    </div>
  </div>

  <table class="w-full table-fixed">
    <colgroup><col class="w-80"><col class="w-64"><col></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-2 text-left font-medium">Scenario</th>
        <th class="px-2 text-left font-medium">Provider</th>
        <th class="px-2 text-left font-medium">Tier</th>
      </tr>
    </thead>
    <tbody>${SCENARIOS.map(row).join('')}</tbody>
  </table>`

renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Scenarios']
})
</script>
</body>
</html>
