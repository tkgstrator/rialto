<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo } = window.Shell

// ─── The fix for "every routing setting is messages-only" ─────────────
// The old build hard-coded a router bypass for /v1/chat/completions and
// /v1/responses (scenario-router.ts:117-128) and nothing in the UI said
// so. Here the surface is the OUTERMOST selector: you pick which wire
// format you are configuring, then whether the router applies to it at
// all, and only then the scenario / lane / chain.
//
// ─── Two bands, not four ──────────────────────────────────────────────
// That axis order is right; the earlier draft of this screen just spent
// a full-width strip on each step of it — surface, then mode + profile,
// then scenario, then lane — plus a header subtitle restating all three
// and two separate blocks of prose explaining them. ~364px of chrome
// stood above ~250px of chain, and the chain still left ~400px of empty
// page under it.
//
// The four strips are two now. Band 1 answers "which surface, and does
// the router apply to it" — the tabs went single-line and the
// Routed/Passthrough switch moved into the same row, so a surface's
// state and the control that changes it finally sit together instead of
// two strips apart. Band 2 answers "which chain, and what can I do to
// it": scenario, lane, actions.
//
// Both bands span the full width. They used to live inside the left
// column of a grid, which cost them the 320px the right rail took.

const SURFACES = [
  { id: 'messages',  label: '/v1/messages',         mode: 'routed',      hint: 'Claude Code' },
  { id: 'chat',      label: '/v1/chat/completions', mode: 'routed',      hint: 'OpenAI SDK' },
  { id: 'responses', label: '/v1/responses',        mode: 'passthrough', hint: 'Codex CLI' },
  { id: 'gemini',    label: '/v1beta/models/*',     mode: 'passthrough', hint: 'Gemini CLI' }
]
const ACTIVE_SURFACE = 'messages'

// The outermost axis has to be walkable, so picking a passthrough surface
// lands on the passthrough half of this screen rather than doing nothing.
//
// Every tab is the same shape — a dot and a path, filled dot for routed
// and hollow for passthrough. Uniform on purpose: the controls for the
// selected surface used to live at the right end of this row, where a
// switch on the same line as four tabs reads as governing the row rather
// than one tab, and moving them INSIDE the selected tab only traded that
// for a row that stretches and reflows every time you switch. They sit
// in a scope strip of their own now, directly under this row.
//
// The dot still carries each surface's mode, which is the fact this
// screen exists to stop hiding: the old build bypassed the router on two
// surfaces and said so nowhere.
const surfaceTab = (s) => {
  const on = s.id === ACTIVE_SURFACE
  const href = s.mode === 'routed' ? 'routing.html' : 'routing-passthrough.html'
  const dot = s.mode === 'routed'
    ? '<span class="size-1.5 shrink-0 rounded-full bg-emerald-500"></span>'
    : '<span class="size-1.5 shrink-0 rounded-full border border-muted-foreground/50"></span>'
  return `
    <button ${navTo(href)} class="flex items-center gap-2 border-b-2 px-3 py-2.5 transition-colors ${
      on ? 'border-b-foreground' : 'border-b-transparent hover:bg-muted/50'
    }">
      ${dot}
      <span class="whitespace-nowrap font-mono text-xs ${on ? 'text-foreground' : 'text-muted-foreground'}">${s.label}</span>
    </button>`
}

const SCENARIOS = [
  { id: 'default',     label: 'Default',      count: 5 },
  { id: 'think',       label: 'Think',        count: 4 },
  { id: 'longContext', label: 'Long context', count: 3 },
  { id: 'webSearch',   label: 'Web search',   count: 2 },
  { id: 'image',       label: 'Image',        count: 2 }
]
const ACTIVE_SCENARIO = 'default'

// Chips rather than a second row of underline tabs. Underlines belong to
// the band above — two underline strips stacked read as one nested
// inside the other, which is exactly backwards: the surface is the outer
// axis and it is the one that lost its emphasis.
const scenarioTab = (s) => {
  const on = s.id === ACTIVE_SCENARIO
  return `
    <button class="flex h-8 items-center gap-1.5 rounded-md px-2.5 text-xs transition-colors ${
      on ? 'bg-muted font-medium' : 'text-muted-foreground hover:text-foreground'
    }">
      ${s.label}<span class="font-mono text-[12px] tabular-nums ${on ? 'text-muted-foreground' : 'text-muted-foreground/70'}">${s.count}</span>
    </button>`
}

// ─── Preference chain ─────────────────────────────────────────────────
// Priority order is the whole point, so the row leads with the ordinal
// and a drag handle. Share is each enabled target's slice of this lane's
// scheduler weight, apportioned so the column adds up to exactly 100%.
// A row switched off, or one the scheduler has not scored, takes no
// slice and reads `–` instead of 0% — it is not competing for the lane.
const CHAIN = [
  // Shares are apportioned from the weights 0.60 / 1.00 / 0.00 / 1.00
  // (total 2.60) by largest remainder, which is what makes 23+39+0+38
  // land on 100 instead of the 99 that plain rounding gives.
  { n: 1, target: 'claude-code,claude-opus-4-8',  tier: 'opus',   share: '23%',  state: 'throttled', on: true },
  { n: 2, target: 'claude-code,claude-fable-5',   tier: 'fable',  share: '39%',  state: 'ready',     on: true },
  { n: 3, target: 'codex,gpt-5.5',                tier: 'opus',   share: '0%',   state: 'exhausted', on: true },
  // Tier null on purpose: no Gemini name says a Claude family, so the
  // router cannot classify it and nobody has set a manualTier in
  // Providers. It is the row the tier-respect floor below cannot hold.
  // State `unknown`, but it still takes a share: no quota window means
  // the scheduler has no reading to publish, not that the target is out
  // of the running. The pill says the number behind it is a policy
  // default rather than a measurement.
  { n: 4, target: 'gemini-cli,gemini-3.1-pro',    tier: null,     share: '38%',  state: 'unknown',   on: true },
  // Switched off: it takes no share of the lane, so the cell is a dash
  // rather than a 0% that would read as "lost the apportionment".
  { n: 5, target: 'claude-code,claude-sonnet-4-6',tier: 'sonnet', share: null,   state: 'ready',     on: false }
]

const stateTone = { ready: 'ok', throttled: 'warn', exhausted: 'bad', unknown: 'mute' }

// A chain entry names "provider,model", and the provider is where its
// credentials, accounts and model list live. The mock set has one detail
// screen per auth mode, so the vendor half of the pair picks which.
const SUBSCRIPTION_PROVIDERS = ['claude-code', 'codex', 'gemini-cli']
const providerHref = (t) =>
  SUBSCRIPTION_PROVIDERS.includes(t.split(',')[0]) ? 'provider-subscription.html' : 'provider-apikey.html'

// The model half of "provider,model", unless another row in the lane
// carries the same model under a different provider.
const modelOf = (t) => t.slice(t.indexOf(',') + 1)
const ambiguous = new Set(
  CHAIN.map((e) => modelOf(e.target)).filter((m, i, all) => all.indexOf(m) !== i)
)
const label = (t) => (ambiguous.has(modelOf(t)) ? t : modelOf(t))

const chainRow = (e) => `
  <tr ${navTo(providerHref(e.target))} class="border-t border-border/60 transition-colors hover:bg-muted/50 ${e.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2">
      <div class="flex items-center gap-2">
        <i class="ri-draggable text-base leading-none text-muted-foreground/50"></i>
        <span class="font-mono text-xs tabular-nums text-muted-foreground">${e.n}</span>
      </div>
    </td>
    <!-- Model name only. The provider half repeats down the column and
         is one click away on the row itself; it comes back only when two
         rows in the same lane would otherwise read identically (the same
         model served by a subscription and by an api_key provider). -->
    <td class="px-2 font-mono text-xs">${label(e.target)}</td>
    <td class="px-2">${
      e.tier === null ? '<span class="text-[12px] text-muted-foreground/50">—</span>' : pill(e.tier, 'mute')
    }</td>
    <td class="px-2">${pill(e.state, stateTone[e.state])}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums ${e.share === null ? 'text-muted-foreground' : ''}">${
      e.share === null ? '–' : e.share
    }</td>
    <td class="py-2.5 pl-2 pr-6">
      <div class="flex items-center justify-end gap-1">
        <span class="inline-flex h-4 w-7 items-center rounded-full ${e.on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5">
          <span class="size-3 rounded-full bg-background ${e.on ? 'translate-x-3' : ''}"></span>
        </span>
        <button class="ml-1 text-muted-foreground/60 hover:text-foreground"><i class="ri-more-2-fill text-sm"></i></button>
      </div>
    </td>
  </tr>`

// Share is the one column a reader misreads — it is a slice of the
// lane's scheduler weight, not a traffic forecast — so the caveat rides
// on the header as a marker. The dashed four-line box that used to
// explain it under the table is gone; a table does not need a paragraph.
const chain = `
  <table class="w-full table-fixed">
    <colgroup><col class="w-16"><col><col class="w-20"><col class="w-24"><col class="w-24"><col class="w-24"></colgroup>
    <thead>
      <tr class="text-[12px] uppercase tracking-wider text-muted-foreground/70 [&>th]:h-9 [&>th]:whitespace-nowrap [&>th]:align-bottom [&>th]:pb-2">
        <th class="pl-6 pr-2 text-left font-medium">#</th>
        <th class="px-2 text-left font-medium">Target</th>
        <th class="px-2 text-left font-medium">Tier</th>
        <th class="px-2 text-left font-medium">State</th>
        <th class="px-2 text-right font-medium">
          Share <i class="ri-question-line align-[-1px] text-[13px] normal-case text-muted-foreground/50"></i>
        </th>
        <th class="pl-2 pr-6 text-right font-medium">On</th>
      </tr>
    </thead>
    <tbody>${CHAIN.map(chainRow).join('')}</tbody>
  </table>`

const constraint = (label, value, hint) => `
  <div class="border-l-2 border-l-transparent bg-background px-4 py-3 transition-colors hover:border-l-border hover:bg-muted/50">
    <div class="flex items-baseline gap-2">
      <span class="text-xs">${label}</span>
      <span class="ml-auto font-mono text-xs">${value}</span>
    </div>
    <div class="mt-0.5 text-[12px] text-muted-foreground">${hint}</div>
  </div>`

document.getElementById('root').innerHTML = `

  <!-- Band 1 — which surface. -->
  <div class="flex items-center gap-1 border-b border-border pl-4 pr-6">
    ${SURFACES.map(surfaceTab).join('')}
  </div>

  <!-- Band 2 — the selected surface's own settings.
       It leads with the surface it writes to. That repeats the path from
       the tab above, and that repetition is the point: parked at the
       right end of the tab row the same switch read as a screen-wide
       control, and nothing on it said which surface it was changing.
       The tinted ground ties the strip to the tabs it hangs from. -->
  <div class="flex items-center gap-3 border-b border-border bg-muted/30 px-6 py-2.5">
    <span class="whitespace-nowrap font-mono text-xs">/v1/messages</span>
    <span class="whitespace-nowrap text-[12px] text-muted-foreground">Claude Code</span>
    <span class="mx-1 h-4 w-px shrink-0 bg-border"></span>
    <div class="flex rounded-md border border-border p-0.5">
      <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Routed</button>
      <button ${navTo('routing-passthrough.html')} class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Passthrough</button>
    </div>
    <!-- The two-line paragraph this replaced held 380px of the strip.
         The distinction matters once, when you first meet the switch. -->
    <button class="flex h-8 w-8 shrink-0 items-center justify-center text-muted-foreground/60 hover:text-foreground" title="Routed walks the chain for this scenario and fails over on quota. Passthrough sends the caller's provider,model straight upstream.">
      <i class="ri-question-line text-sm"></i>
    </button>
    <span class="mx-1 h-4 w-px shrink-0 bg-border"></span>
    <button class="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-2.5 text-xs hover:bg-muted/60">
      <span class="text-muted-foreground">Profile</span> live <i class="ri-arrow-down-s-line text-sm text-muted-foreground"></i>
    </button>
  </div>

  <!-- Band 3 — which chain, and what you can do to it. Presets is one
       control and lives here; it used to be a header button AND a list
       in the right rail. -->
  <div class="flex items-center gap-3 border-b border-border px-6 py-2.5">
    <div class="flex items-center gap-0.5">
      ${SCENARIOS.map(scenarioTab).join('')}
    </div>
    <span class="h-4 w-px bg-border"></span>
    <div class="flex rounded-md border border-border p-0.5">
      <button class="rounded bg-foreground px-2.5 py-1 text-[12px] font-medium text-background">Agent</button>
      <button class="rounded px-2.5 py-1 text-[12px] text-muted-foreground hover:text-foreground">Subagent</button>
    </div>
    <!-- Save alone. Presets and Add target moved under the table: five
         scenario chips, a lane switch and three buttons was more than one
         row should carry, and neither of those two acts on the coordinate
         this band picks — they act on the list below it. -->
    <div class="ml-auto">
      ${btn('Save', 'primary', 'ri-check-line')}
    </div>
  </div>

  ${chain}

  <!-- The count reads as a total under the thing it counts, and the two
       actions that add to that list sit with it. "Add target" appends a
       row to the table directly above, which is where a reader looks for
       it once they have read the last one. -->
  <div class="flex items-center gap-3 border-t border-border/60 px-6 py-2.5">
    <span class="text-[12px] text-muted-foreground">5 targets · 1 disabled · order is preference, top first</span>
    <div class="ml-auto flex items-center gap-2">
      ${btn('Presets', 'ghost', 'ri-stack-line')}
      ${btn('Add target', 'outline', 'ri-add-line')}
    </div>
  </div>

  <!-- Constraints, four-up, in the space the right rail used to leave
       empty. The rail ran the full page height for four rows while the
       chain beside it ended after 250px — a tall column next to a short
       one, with the empty half carrying the content. Same four items,
       same values; they stopped being a column and became a footer to
       the chain they constrain. -->
  <div class="mt-6 border-t border-border">
    <div class="px-6 pt-4 pb-2">
      <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Constraints</h2>
    </div>
    <div class="grid grid-cols-4 gap-px bg-border/60">
      ${constraint('Tier respect', 'sonnet', 'never fall below this tier. Unknown tiers are not held by it.')}
      ${constraint('Healthiness floor', '95%', 'skip targets below this')}
      ${constraint('When exhausted', 'next', 'next / wait / error')}
      ${constraint('Cross-provider', 'on', 'allow different auth modes')}
    </div>
  </div>`

// No Presets button in the header, and no subtitle: the subtitle read
// "Per inbound surface · scenario · lane", which described the strips
// that used to sit underneath it.
renderShell({
  active: 'routing',
  navMode: 'cloudflare',
  crumbs: ['Chain']
})
</script>
</body>
</html>
