<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Add provider</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo } = window.Shell

// Absorbs ConnectChoiceDialog + ProviderConnectFlow + ImportCredentialsDialog
// + ManualCallbackDialog + ManageProvidersDialog — four dialogs that chained
// into each other — into one three-step page. A dialog stack is the wrong
// shape for a flow that can branch and can fail.

// ?device — Codex signing in with a one-time code. Codex offers no browser
// sign-in: its OAuth client only redirects to localhost:1455 on the
// BROWSER's machine, which a remote or containerised install never
// receives. A device code needs nothing to reach back: Rialto shows the
// code, the operator enters it at auth.openai.com from any browser, and
// the server polls until the grant is issued.
const PARAMS = new URLSearchParams(location.search)
const DEVICE = PARAMS.has('device')
// ?codex-failed — Codex before a code has been asked for, with the last
// attempt's error still on record. The failure card then sits straight
// under the choice grid instead of under a waiting card, which is the one
// placement where it has to bring its own top gap (see failureCard).
const CODEX_FAILED = PARAMS.has('codex-failed')
const CODEX = DEVICE || CODEX_FAILED
const SELECTED = CODEX ? 'codex' : 'gemini-cli'

const step = (n, label, state) => {
  const tone = { done: 'bg-foreground text-background', active: 'bg-foreground text-background', todo: 'bg-muted text-muted-foreground' }[state]
  return `
    <div class="flex items-center gap-2">
      <span class="flex size-5 items-center justify-center rounded-full text-[12px] font-medium ${tone}">
        ${state === 'done' ? '<i class="ri-check-line text-xs"></i>' : n}
      </span>
      <span class="text-xs ${state === 'todo' ? 'text-muted-foreground' : 'font-medium'}">${label}</span>
    </div>`
}

const VENDORS = [
  { id: 'claude-code', label: 'Claude Code',  hint: 'Pro / Max via Claude CLI OAuth', kind: 'subscription', icon: 'ri-sparkling-line', added: true },
  { id: 'codex',       label: 'Codex',        hint: 'ChatGPT plan via Codex CLI OAuth', kind: 'subscription', icon: 'ri-terminal-line', added: true },
  { id: 'gemini-cli',  label: 'Gemini CLI',   hint: 'AI Pro / Ultra via Gemini CLI OAuth', kind: 'subscription', icon: 'ri-gemini-line', added: true },
  { id: 'anthropic',   label: 'Anthropic',    hint: 'Pay-as-you-go API key', kind: 'api_key', icon: 'ri-key-2-line', added: true },
  { id: 'openai',      label: 'OpenAI',       hint: 'Pay-as-you-go API key', kind: 'api_key', icon: 'ri-key-2-line', added: true },
  { id: 'google',      label: 'Google AI',    hint: 'AI Studio API key', kind: 'api_key', icon: 'ri-key-2-line', added: true },
  { id: 'deepseek',    label: 'DeepSeek',     hint: 'Pay-as-you-go API key', kind: 'api_key', icon: 'ri-key-2-line', added: true },
  { id: 'groq',        label: 'Groq',         hint: 'OpenAI-compatible', kind: 'api_key', icon: 'ri-flashlight-line', added: false },
  { id: 'openrouter',  label: 'OpenRouter',   hint: 'OpenAI-compatible aggregator', kind: 'api_key', icon: 'ri-shuffle-line', added: false },
  { id: 'custom',      label: 'Custom',       hint: 'Any OpenAI / Anthropic / Gemini-shaped endpoint', kind: 'api_key', icon: 'ri-add-box-line', added: false }
]

// A vendor already connected is not a step in this flow — it is a provider
// with a detail screen, so the card goes there instead of restarting an
// authentication the operator has already finished.
const vendorHref = (v, selected) =>
  v.added && !selected ? (v.kind === 'subscription' ? 'provider-subscription.html' : 'provider-apikey.html') : ''

const vendorCard = (v, selected) => `
  <button ${vendorHref(v, selected) ? navTo(vendorHref(v, selected)) : ''} class="flex items-start gap-3 border-l-2 px-4 py-3 text-left transition-colors ${
    selected ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  }">
    <i class="${v.icon} mt-0.5 text-base leading-none text-muted-foreground"></i>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium">${v.label}</span>
        ${v.kind === 'subscription' ? pill('OAuth', 'info') : pill('API key', 'mute')}
        ${v.added ? '<span class="ml-auto text-[12px] text-muted-foreground">added</span>' : ''}
      </div>
      <div class="mt-0.5 text-[12px] text-muted-foreground">${v.hint}</div>
    </div>
  </button>`

const choice = ({ icon, title, body, selected }) => `
  <button class="rounded-md px-4 py-3 text-left ${
    selected ? 'border-2 border-foreground/40 bg-muted/40' : 'border border-border transition-colors hover:bg-muted/50'
  }">
    <div class="flex items-center gap-2">
      <i class="${icon} text-sm ${selected ? '' : 'text-muted-foreground'}"></i>
      <span class="text-xs font-medium">${title}</span>
      ${selected ? pill('recommended', 'ok') : ''}
    </div>
    <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">${body}</p>
  </button>`

// Failure state shown inline: this flow fails often enough (an expired
// refresh token, the wrong account) that hiding it in a toast loses the only
// actionable detail. Under a waiting card, that card's py-5 is the gap
// between the two. `flush` is the other placement — straight under the
// choice grid, which ends with no padding — so the card brings its own pt-5
// rather than touching the choices.
const failureCard = ({ ago, message, flush }) => `
      <div class="px-6 pb-6 ${flush ? 'pt-5' : ''}">
        <div class="rounded-md border border-destructive/30 bg-destructive/5 px-4 py-3">
          <div class="flex items-center gap-2">
            <i class="ri-error-warning-line text-sm text-destructive"></i>
            <span class="text-xs font-medium">Previous attempt failed</span>
            <span class="ml-auto text-[12px] text-muted-foreground">${ago}</span>
          </div>
          <p class="mt-1.5 font-mono text-[12px] leading-relaxed text-muted-foreground">
            ${message}
          </p>
        </div>
      </div>`

// Codex on step 2. While `waiting`, it is mid device-code sign-in: the code
// and the link are the whole instruction, so they are the largest things in
// the card; the expiry is there because a code left too long stops working
// without saying so. Before a code is asked for, the step is the two choices
// and whatever the last attempt left behind.
const codexPane = ({ waiting, failed }) => `
    <div class="min-w-0 overflow-y-auto">
      <div class="border-b border-border px-6 py-4">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-semibold">Codex</h2>
          ${pill('subscription', 'info')}
        </div>
        <p class="mt-1 text-[12px] leading-relaxed text-muted-foreground">
          Uses your OpenAI subscription entitlement. Rialto never sees your password — it exchanges an
          OAuth code and stores only the encrypted tokens.
        </p>
      </div>

      <div class="px-6 pt-5 pb-2">
        <h3 class="text-sm font-semibold">How to authenticate</h3>
      </div>
      <div class="grid grid-cols-2 gap-3 px-6">
        ${choice({
          icon: 'ri-keyboard-line',
          title: 'Device code',
          body: 'Enter a one-time code at <span class="font-mono">auth.openai.com</span> from any browser.',
          selected: true
        })}
        ${choice({
          icon: 'ri-folder-open-line',
          title: 'Import from Codex',
          body: 'Reads <span class="font-mono">~/.codex/auth.json</span> if you have already signed in on this machine.',
          selected: false
        })}
      </div>

      ${waiting ? `
      <div class="px-6 py-5">
        <div class="rounded-md border border-border px-4 py-4">
          <div class="flex items-center gap-2">
            <i class="ri-loader-4-line text-sm text-muted-foreground"></i>
            <span class="text-xs font-medium">Waiting for the code…</span>
            <span class="ml-auto font-mono text-[12px] tabular-nums text-muted-foreground">expires in 14:32</span>
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            Open the link, sign in to ChatGPT and enter the code. This page continues on its own.
          </p>
          <div class="mt-3 space-y-2 rounded-md bg-muted/50 px-3 py-3">
            <div class="flex items-center gap-3">
              <span class="w-10 text-[12px] text-muted-foreground">Link</span>
              <span class="min-w-0 flex-1 truncate font-mono text-xs">https://auth.openai.com/codex/device</span>
              ${btn('Open', 'outline', 'ri-external-link-line')}
            </div>
            <div class="flex items-center gap-3">
              <span class="w-10 text-[12px] text-muted-foreground">Code</span>
              <span class="min-w-0 flex-1 font-mono text-base font-semibold tracking-wider">KQ7M-P4TZ</span>
              ${btn('Copy', 'outline', 'ri-file-copy-line')}
            </div>
          </div>
        </div>
      </div>` : ''}
      ${failed ? failureCard({ ago: '13m ago', message: 'No access token stored', flush: !waiting }) : ''}
      <div class="h-6"></div>
    </div>`

document.getElementById('root').innerHTML = `
  <div class="flex items-center gap-6 border-b border-border px-6 py-3">
    ${step(1, 'Pick a vendor', 'done')}
    <i class="ri-arrow-right-s-line text-sm text-muted-foreground/50"></i>
    ${step(2, 'Authenticate', 'active')}
    <i class="ri-arrow-right-s-line text-sm text-muted-foreground/50"></i>
    ${step(3, 'Choose models', 'todo')}
    <div class="ml-auto">${btn('Cancel', 'ghost', '', 'providers.html')}</div>
  </div>

  <div class="grid h-full grid-cols-[22rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Vendor</h2>
      </div>
      ${VENDORS.map((v) => vendorCard(v, v.id === SELECTED)).join('')}
    </aside>

    ${CODEX ? codexPane({ waiting: DEVICE, failed: CODEX_FAILED }) : `
    <div class="min-w-0 overflow-y-auto">
      <div class="border-b border-border px-6 py-4">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-semibold">Gemini CLI</h2>
          ${pill('subscription', 'info')}
        </div>
        <p class="mt-1 text-[12px] leading-relaxed text-muted-foreground">
          Uses your Google AI Pro / Ultra entitlement through the Code Assist API. Rialto never sees
          your password — it exchanges an OAuth code and stores only the encrypted tokens.
        </p>
      </div>

      <!-- Two ways in. Browser OAuth is the happy path; importing the CLI's
           existing credentials is the escape hatch for headless boxes. -->
      <div class="px-6 pt-5 pb-2">
        <h3 class="text-sm font-semibold">How to authenticate</h3>
      </div>
      <div class="grid grid-cols-2 gap-3 px-6">
        <button class="rounded-md border-2 border-foreground/40 bg-muted/40 px-4 py-3 text-left">
          <div class="flex items-center gap-2">
            <i class="ri-external-link-line text-sm"></i>
            <span class="text-xs font-medium">Sign in with Google</span>
            ${pill('recommended', 'ok')}
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            Opens Google in your browser and returns to <span class="font-mono">/callback</span>.
          </p>
        </button>
        <button class="rounded-md border border-border px-4 py-3 text-left transition-colors hover:bg-muted/50">
          <div class="flex items-center gap-2">
            <i class="ri-folder-open-line text-sm text-muted-foreground"></i>
            <span class="text-xs font-medium">Import from Gemini CLI</span>
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            Reads <span class="font-mono">~/.gemini/oauth_creds.json</span> if you have already
            signed in on this machine.
          </p>
        </button>
      </div>

      <div class="px-6 py-5">
        <div class="rounded-md border border-border px-4 py-4">
          <div class="flex items-center gap-2">
            <i class="ri-loader-4-line text-sm text-muted-foreground"></i>
            <span class="text-xs font-medium">Waiting for Google…</span>
          </div>
          <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
            A browser tab should have opened. Finish there and this page will continue on its own.
          </p>
          <div class="mt-3 rounded-md bg-muted/50 px-3 py-2">
            <div class="text-[12px] text-muted-foreground">Or paste the redirect URL manually</div>
            <div class="mt-1.5 flex items-center gap-2">
              <div class="flex h-8 flex-1 items-center rounded-md border border-border bg-background px-3 font-mono text-[12px] text-muted-foreground">
                http://localhost:3456/callback?code=…&amp;state=…
              </div>
              ${btn('Submit', 'outline', '')}
            </div>
            <p class="mt-1.5 text-[12px] leading-relaxed text-muted-foreground">
              Needed when Rialto runs behind a tunnel and the browser cannot reach loopback.
            </p>
          </div>
        </div>
      </div>

      ${failureCard({
        ago: '5h ago',
        message: '403 — Code Assist onboarding required for this account (loadCodeAssist returned no project)',
        flush: false
      })}
      <div class="h-6"></div>
    </div>`}

  </div>`

renderShell({
  active: 'providers',
  navMode: 'cloudflare',
  crumbs: ['Add provider'],
  subtitle: CODEX ? 'Step 2 of 3 · Codex' : 'Step 2 of 3 · Gemini CLI',
  actions:
    btn('Back', 'ghost', 'ri-arrow-left-line', 'providers.html') +
    btn('Continue', 'primary', 'ri-arrow-right-line', 'providers-connect-models.html')
})
</script>
</body>
</html>
