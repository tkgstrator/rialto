<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Status line</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn } = window.Shell

// Absorbs StatusLineConfigDialog + its six sub-components. It was a modal;
// it is a three-pane editor (module palette / assembled line / properties)
// because you cannot judge a status line without seeing it rendered.

const TYPES = [
  { id: 'model',     label: 'Model',      icon: 'ri-cpu-line' },
  { id: 'provider',  label: 'Provider',   icon: 'ri-plug-line' },
  { id: 'quota',     label: 'Quota',      icon: 'ri-battery-2-line' },
  { id: 'cost',      label: 'Cost',       icon: 'ri-money-dollar-circle-line' },
  { id: 'tokens',    label: 'Tokens',     icon: 'ri-hashtag' },
  { id: 'session',   label: 'Session',    icon: 'ri-chat-1-line' },
  { id: 'gitBranch', label: 'Git branch', icon: 'ri-git-branch-line' },
  { id: 'cwd',       label: 'Directory',  icon: 'ri-folder-line' },
  { id: 'text',      label: 'Static text',icon: 'ri-text' }
]

const MODULES = [
  { id: 'cwd',       label: 'Directory', icon: 'ri-folder-line',    color: 'text-muted-foreground', active: false },
  { id: 'gitBranch', label: 'Git branch',icon: 'ri-git-branch-line',color: 'text-muted-foreground', active: false },
  { id: 'model',     label: 'Model',     icon: 'ri-cpu-line',       color: 'text-sky-500',          active: true },
  { id: 'quota',     label: 'Quota',     icon: 'ri-battery-2-line', color: 'text-emerald-500',      active: false },
  { id: 'cost',      label: 'Cost',      icon: 'ri-money-dollar-circle-line', color: 'text-amber-500', active: false }
]

const typeItem = (t) => `
  <button class="flex w-full items-center gap-2.5 border-l-2 border-l-transparent px-4 py-2 text-left text-xs transition-colors hover:border-l-border hover:bg-muted/50">
    <i class="${t.icon} text-sm leading-none text-muted-foreground"></i>${t.label}
    <i class="ri-add-line ml-auto text-sm text-muted-foreground/40"></i>
  </button>`

// A div, not a button: the row carries its own remove control, and a
// button inside a button is invalid markup the browser hoists out.
const moduleRow = (m) => `
  <div class="flex w-full cursor-pointer items-center gap-2 border-l-2 px-4 py-2.5 text-left transition-colors ${
    m.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  }">
    <i class="ri-draggable text-base leading-none text-muted-foreground/50"></i>
    <i class="${m.icon} text-sm leading-none ${m.color}"></i>
    <span class="text-xs">${m.label}</span>
    <button class="ml-auto text-muted-foreground/50 hover:text-destructive"><i class="ri-close-line text-sm"></i></button>
  </div>`

document.getElementById('root').innerHTML = `
  <div class="grid h-full grid-cols-[13rem_15rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Add module</h2>
      </div>
      ${TYPES.map(typeItem).join('')}
    </aside>

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-2 px-4 pt-5 pb-2">
        <h2 class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Line</h2>
        <span class="ml-auto font-mono text-[12px] text-muted-foreground">5</span>
      </div>
      ${MODULES.map(moduleRow).join('')}
      <div class="border-t border-border px-4 py-4">
        <p class="text-[12px] leading-relaxed text-muted-foreground">
          Order is left to right. Claude Code pipes session JSON to
          <span class="font-mono">rialto statusline</span> on every turn.
        </p>
      </div>
    </aside>

    <div class="min-w-0 overflow-y-auto">
      <!-- Preview first: it is the thing being designed. -->
      <div class="border-b border-border px-6 py-5">
        <div class="flex items-center gap-2">
          <h3 class="text-sm font-semibold">Preview</h3>
          ${pill('live', 'ok')}
        </div>
        <div class="mt-3 rounded-md border border-border bg-[#0d0d0d] px-4 py-3">
          <div class="flex items-center gap-3 font-mono text-xs text-neutral-300">
            <span class="text-neutral-500">~/app</span>
            <span class="text-neutral-500">⎇ master</span>
            <span class="text-sky-400">claude-opus-4-8</span>
            <span class="text-emerald-400">▮▮▮▮▯ 71%</span>
            <span class="text-amber-400">$1.24</span>
          </div>
        </div>
        <div class="mt-2 flex gap-2">
          <button class="rounded border border-border px-2 py-0.5 text-[12px] text-muted-foreground hover:bg-muted/50">Dark terminal</button>
          <button class="rounded border border-border px-2 py-0.5 text-[12px] text-muted-foreground hover:bg-muted/50">Light terminal</button>
          <button class="rounded border border-border px-2 py-0.5 text-[12px] text-muted-foreground hover:bg-muted/50">No color</button>
        </div>
      </div>

      <div class="flex items-center gap-2 px-6 pt-5 pb-3">
        <h3 class="text-sm font-semibold">Model module</h3>
        ${pill('selected', 'info')}
      </div>

      <div class="grid grid-cols-[10rem_1fr] items-start gap-4 border-t border-border/60 px-6 py-3">
        <span class="text-xs">Icon</span>
        <div class="flex items-center gap-2">
          <div class="flex size-8 items-center justify-center rounded-md border border-border"><i class="ri-cpu-line text-sm"></i></div>
          <div class="flex h-8 w-44 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> ri-cpu-line
          </div>
        </div>
      </div>
      <div class="grid grid-cols-[10rem_1fr] items-start gap-4 border-t border-border/60 px-6 py-3">
        <span class="text-xs">Color</span>
        <div class="flex items-center gap-1.5">
          ${['bg-sky-500', 'bg-emerald-500', 'bg-amber-500', 'bg-destructive', 'bg-foreground', 'bg-muted-foreground'].map((c, i) => `
            <button class="size-6 rounded ${c} ${i === 0 ? 'ring-2 ring-foreground ring-offset-2 ring-offset-background' : ''}"></button>`).join('')}
          <div class="ml-2 flex h-8 w-24 items-center rounded-md border border-border px-2.5 font-mono text-[12px]">#38bdf8</div>
        </div>
      </div>
      <div class="grid grid-cols-[10rem_1fr] items-start gap-4 border-t border-border/60 px-6 py-3">
        <span class="text-xs">Format</span>
        <div class="flex h-8 max-w-sm items-center rounded-md border border-border px-3 font-mono text-xs">{model}</div>
      </div>
      <div class="grid grid-cols-[10rem_1fr] items-start gap-4 border-t border-border/60 px-6 py-3">
        <div>
          <div class="text-xs">Strip provider</div>
          <div class="mt-0.5 text-[12px] text-muted-foreground">Show <span class="font-mono">claude-opus-4-8</span>, not <span class="font-mono">claude-code,claude-opus-4-8</span>.</div>
        </div>
        <span class="inline-flex h-5 w-9 items-center rounded-full bg-foreground px-0.5 align-middle">
          <span class="size-4 translate-x-4 rounded-full bg-background"></span>
        </span>
      </div>
      <div class="grid grid-cols-[10rem_1fr] items-start gap-4 border-t border-border/60 px-6 py-3">
        <div>
          <div class="text-xs">Separator</div>
          <div class="mt-0.5 text-[12px] text-muted-foreground">Placed after this module.</div>
        </div>
        <div class="flex h-8 w-24 items-center rounded-md border border-border px-3 font-mono text-xs">&nbsp;</div>
      </div>

      <div class="px-6 py-5">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-terminal-line mr-1 align-[-1px]"></i>
          Wire it up in <span class="font-mono">~/.claude/settings.json</span>:
          <span class="font-mono">"statusLine": { "type": "command", "command": "rialto statusline" }</span>
        </div>
      </div>
      <div class="h-6"></div>
    </div>

  </div>`

renderShell({
  active: 'settings',
  navMode: 'cloudflare',
  sub: 'statusline',
  crumbs: ['Status line'],
  subtitle: '5 modules · rialto statusline',
  actions: btn('Discard', 'ghost', '') + btn('Save', 'primary', 'ri-check-line')
})
</script>
</body>
</html>
