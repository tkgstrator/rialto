<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Admin access</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn, navTo, dialog } = window.Shell

// The Access pair reads until Edit is pressed. Both values are set once
// and then left alone, and a stray keystroke in either is the cheapest way
// to shut every remote browser out — clearing both even saves without a
// dry run, because it turns Access off. `?edit` draws the state after Edit;
// `?turnoff` the confirmation a save of the emptied pair opens first.
const PARAMS = new URLSearchParams(location.search)
const TURNING_OFF = PARAMS.has('turnoff')
const EDITING = TURNING_OFF || PARAMS.has('edit')

const withClass = (html, cls) => (cls === '' ? html : html.replace('class="', `class="${cls} `))
// Leaving the page would drop an unsaved edit, so Audit log waits for
// Save or Revert. Open Zero Trust stays live: the AUD is copied from there.
const lockedWhileEditing = EDITING ? 'pointer-events-none opacity-50' : ''

const TEAM_DOMAIN = 'acme.cloudflareaccess.com'
const AUD = '97e2aa5c0f3b41d8a6e97c2b1d04f5e8c3a9b7d61e2f4a0c8b5d3e7f1a2c913a'

const row = (label, hint, body) => `
      <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
        <div>
          <div class="text-xs font-medium">${label}</div>
          ${hint ? `<div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">${hint}</div>` : ''}
        </div>
        <div class="space-y-1.5">${body}</div>
      </div>`

// The reading takes the input's exact box, so Edit swaps one for the other
// without moving the page.
const valueBox = (value, placeholder) => `
          <div class="flex h-8 w-full max-w-md items-center rounded-md border border-border px-3 font-mono text-xs">${
            value === '' ? `<span class="text-muted-foreground">${placeholder}</span>` : `<span class="truncate">${value}</span>`
          }</div>`

// A dry run of values being edited, so it only exists while editing.
const verifyRow = TURNING_OFF
  ? row(
      'Verify',
      'Nothing is saved by this. It reports whether these values would work.',
      withClass(btn('Check settings', 'outline', 'ri-shield-check-line'), 'pointer-events-none opacity-50')
    )
  : row(
      'Verify',
      'Nothing is saved by this. It reports whether these values would work.',
      `<div class="space-y-2">
            <div class="flex items-center gap-2">${btn('Check settings', 'outline', 'ri-shield-check-line')}</div>
            <div class="space-y-1.5">
              <div class="flex items-center gap-2">
                ${pill('verified', 'ok')}
                <span class="font-mono text-[12px] text-muted-foreground">2 signing keys</span>
                <span class="font-mono text-[12px]">tkgstrator@example.com</span>
              </div>
              <p class="text-[12px] leading-relaxed text-muted-foreground">Your own Access assertion validates against these values.</p>
            </div>
          </div>`
    )

const turnOffDialog = TURNING_OFF
  ? dialog(
      'Turn off Cloudflare Access?',
      '<p class="text-xs leading-relaxed text-muted-foreground">Both fields are empty, so saving turns Access off. Every remote browser loses this UI and /api/* the moment it lands — including this one, if you came in through Access — and only a browser on the host can get back in.</p>',
      `${btn('Cancel', 'ghost')}${btn('Turn off', 'danger', 'ri-lock-unlock-line')}`
    )
  : ''


document.getElementById('root').innerHTML = `
  <div class="grid h-full grid-cols-1">

    <div class="min-w-0 overflow-y-auto">

      <!-- Two ways in, and no key: Cloudflare Access for a remote browser,
           the host itself for a local one. -->
      <div class="flex items-center gap-3 px-6 pt-6 pb-3">
        <h2 class="text-sm font-semibold">Admin access</h2>
        ${pill('Cloudflare Access', 'ok')}
        <span class="text-[12px] text-muted-foreground">rialto.example.com</span>
        <div class="ml-auto">${btn('Open Zero Trust', 'outline', 'ri-external-link-line')}</div>
      </div>
      <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
        <div>
          <div class="text-xs font-medium">Signed in as</div>
        </div>
        <div class="space-y-1.5">
          <div class="flex items-center gap-2">
            <i class="ri-shield-check-line text-sm text-emerald-600 dark:text-emerald-400"></i>
            <span class="font-mono text-xs">tkgstrator@example.com</span>
            ${pill('valid', 'ok')}
          </div>
          <div class="font-mono text-[12px] text-muted-foreground">aud 97e2aa…913a · exp in 21h</div>
        </div>
      </div>
      ${row(
        'Team domain',
        'Looks like &lt;team&gt;.cloudflareaccess.com. Required together with the AUD tag — one alone enables nothing.',
        valueBox(TURNING_OFF ? '' : TEAM_DOMAIN, 'acme.cloudflareaccess.com')
      )}
      ${row(
        'Application AUD',
        'The Application Audience tag from the Access app. Without it a token minted for any other app on your team would be accepted.',
        valueBox(TURNING_OFF ? '' : AUD, '64 hex characters')
      )}
      ${EDITING ? verifyRow : ''}
      ${
        TURNING_OFF
          ? '<div class="px-6 pb-4 text-[12px] leading-relaxed text-muted-foreground">Both fields are empty, so saving turns Access off — afterwards only a browser on this machine can reach /api/*.</div>'
          : ''
      }
      <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
        <div>
          <div class="text-xs font-medium">Policy coverage</div>
        </div>
        <div class="space-y-1.5">
          <div class="flex items-center gap-2 rounded-md border border-border px-3 py-1.5">
            <span class="font-mono text-[12px]">/</span>
            <span class="ml-auto text-[12px] text-muted-foreground">Allow · 1 email rule</span>
          </div>
          <div class="flex items-center gap-2 rounded-md border border-border px-3 py-1.5">
            <span class="font-mono text-[12px]">/v1</span>
            <span class="ml-auto text-[12px] text-muted-foreground">Bypass · Everyone</span>
          </div>
          <p class="text-[12px] leading-relaxed text-muted-foreground">
            <span class="font-mono">/v1</span> must bypass Access: Claude Code, Codex and Gemini CLI
            cannot complete an interactive login and do not send service-token headers. The access
            tokens below are that path's only gate.
          </p>
        </div>
      </div>

      <!-- No bootstrap token. It was a master key for /api/* that got past
           Access for whoever read it out of config.json, a backup or shell
           history, and the outages it was kept for — Access broken, Postgres
           down — already have a way back in that needs no secret: a request
           made on the host skips the admin gate, and that check reads
           neither Access nor the database. So this row says how to be on
           the host, instead of holding a key. -->
      <div class="grid grid-cols-[14rem_1fr] items-start gap-6 border-t border-border/60 px-6 py-4">
        <div>
          <div class="text-xs font-medium">If Access breaks</div>
          <div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">
            There is no fallback key. Come in from the host instead.
          </div>
        </div>
        <div class="space-y-1.5">
          <div class="flex h-8 max-w-md items-center rounded-md border border-border px-3 font-mono text-xs">ssh -L 3456:localhost:3456 &lt;host&gt;</div>
          <p class="text-[12px] leading-relaxed text-muted-foreground">
            Then open <span class="font-mono">http://localhost:3456</span>. A browser on the host is exempt from
            the admin gate — unless <span class="font-mono">RIALTO_TRUST_LOCAL=false</span>, which closes that
            door too.
          </p>
        </div>
      </div>

      <div class="px-6 pb-2">
        <div class="rounded-md border border-border px-4 py-3">
          <div class="text-[12px] font-semibold uppercase tracking-wider text-muted-foreground">Who guards what</div>
          <div class="mt-2 grid grid-cols-3 gap-4">
            <div class="border-l-2 border-l-emerald-500/60 pl-3">
              <div class="text-xs font-medium">Cloudflare Access</div>
              <div class="mt-1 text-[12px] leading-relaxed text-muted-foreground">
                Guards this UI and <span class="font-mono">/api/*</span>. Browser logs in at the edge;
                Rialto only validates the signed JWT.
              </div>
              <div class="mt-1.5 font-mono text-[12px] text-muted-foreground">you → Access → Rialto</div>
            </div>
            <div class="border-l-2 border-l-foreground/40 pl-3">
              <div class="text-xs font-medium">Access token</div>
              <div class="mt-1 text-[12px] leading-relaxed text-muted-foreground">
                Guards <span class="font-mono">/v1/*</span>. CLI clients cannot do an interactive
                Access login, so that path is a Bypass app and these tokens are its gate.
              </div>
              <div class="mt-1.5 font-mono text-[12px] text-muted-foreground">Claude Code → Rialto</div>
            </div>
            <div class="border-l-2 border-l-border pl-3">
              <div class="text-xs font-medium">Provider API key</div>
              <div class="mt-1 text-[12px] leading-relaxed text-muted-foreground">
                <span class="font-medium text-foreground">Outbound.</span> Rialto presents it to a
                vendor. Lives on the provider in
                <a href="providers-keys.html" class="underline underline-offset-2">Providers</a>.
              </div>
              <div class="mt-1.5 font-mono text-[12px] text-muted-foreground">Rialto → OpenAI</div>
            </div>
          </div>
        </div>
      </div>

  </div>
  ${turnOffDialog}`

renderShell({
  active: 'settings',
  navMode: 'cloudflare',
  sub: 'auth',
  crumbs: ['Access'],
  subtitle: 'Who may administer this install',
  // Edit, then Revert / Save, for the Access pair — the only thing on this
  // page an operator writes. Save turning Access off asks first (?turnoff).
  actions:
    withClass(btn('Audit log', 'ghost', 'ri-history-line', 'activity-logs.html'), lockedWhileEditing) +
    (EDITING
      ? `${btn('Revert', 'outline', 'ri-arrow-go-back-line')}${btn('Save', 'primary', 'ri-check-line')}`
      : btn('Edit', 'outline', 'ri-pencil-line'))
})
</script>
</body>
</html>
