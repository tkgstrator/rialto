<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Decisions</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, btn, pill } = window.Shell

const field = (label, hint, control) => `
  <div class="space-y-2 px-6 py-4 max-md:px-4">
    <div>
      <div class="text-xs font-medium">${label}</div>
      ${hint ? `<div class="mt-0.5 text-[12px] leading-snug text-muted-foreground">${hint}</div>` : ''}
    </div>
    <div class="min-w-0">${control}</div>
  </div>`

const input = (value, flex = false) => `<input readonly value="${value}" class="h-8 ${flex ? 'min-w-0 flex-1' : 'w-full'} rounded-md border border-border bg-transparent px-3 text-xs">`
const options = `
  <div class="space-y-2">
    <div class="flex items-center gap-2"><span class="w-5 text-xs text-muted-foreground">1</span>${input('A request to explain or summarize information', true)}<i class="ri-close-line text-muted-foreground"></i></div>
    <div class="flex items-center gap-2"><span class="w-5 text-xs text-muted-foreground">2</span>${input('A task that requires multi-step reasoning', true)}<i class="ri-close-line text-muted-foreground"></i></div>
    <div class="pt-1">${btn('Add option', 'outline', 'ri-add-line')}</div>
  </div>`

document.getElementById('root').innerHTML = `
  <div class="@container min-w-0">
    <section class="border-b border-border">
      <div class="flex flex-wrap items-center gap-3 px-6 py-3 max-md:px-4">
        <span class="text-xs font-medium">Decision service</span>
        <span class="text-[12px] text-muted-foreground max-md:order-last max-md:basis-full">Configured on the server; credentials never reach this browser.</span>
        <span class="ml-auto">${pill('Unavailable', 'mute')}</span>
        ${btn('Refresh', 'outline', 'ri-refresh-line')}
      </div>
      <div class="space-y-2 px-6 pb-4 text-xs text-muted-foreground max-md:px-4">
        <p>Configure a decision service on the server before running a test.</p>
      </div>
    </section>

    <div class="grid min-w-0 grid-cols-1 @min-[64rem]:grid-cols-[minmax(0,3fr)_minmax(0,2fr)]">
      <section class="min-w-0 pb-6">
    <div class="flex flex-wrap items-center gap-3 gap-y-2 px-6 pt-6 pb-3 max-md:px-4">
      <h2 class="text-sm font-semibold">Try a decision</h2>
      <span class="order-last basis-full text-[12px] leading-relaxed text-muted-foreground">Use English for this test. Input is sent as written; user requests are not translated.</span>
      <div class="ml-auto"><button disabled class="inline-flex h-8 items-center gap-1.5 rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground opacity-50"><i class="ri-play-line text-sm leading-none"></i>Run decision</button></div>
    </div>
    ${field('Situation (English)', '', `<textarea readonly placeholder="Describe the subagent's task in English…" class="h-28 w-full resize-y rounded-md border border-border bg-transparent px-3 py-2 text-xs"></textarea>`)}
    ${field('Question type', '', `<div class="relative inline-flex"><select class="h-8 w-40 appearance-none rounded-md border border-border bg-transparent pl-3 pr-8 text-xs"><option>choice</option></select><i class="ri-arrow-down-s-line pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground"></i></div>`)}
    ${field('Question (English)', '', input('Which option best describes the subagent task?'))}
    ${field('Options / scale (English)', '', options)}

      </section>
      <section class="min-w-0 border-t border-border @min-[64rem]:border-l @min-[64rem]:border-t-0">
        <div class="px-6 pt-6 pb-3 max-md:px-4">
          <h2 class="text-sm font-semibold">Result</h2>
          <p class="mt-1 text-[12px] leading-relaxed text-muted-foreground">Subagent observations do not affect model selection.</p>
        </div>
        <div class="px-6 py-4 text-xs text-muted-foreground max-md:px-4">Submit a situation to see probabilities here.</div>
      </section>
    </div>
    <div class="h-10"></div>
  </div>`

renderShell({
  active: 'decisions',
  navMode: 'cloudflare',
  subtitle: 'Test decisions without changing live routing'
})
</script>
</body>
</html>
