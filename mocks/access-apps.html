<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Apps</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, btn, appTable, accessTabs, dialog } = window.Shell

// Apps an operator has authorized to register their own installs.
//
// An install cannot ship a credential — anything in the binary is
// everyone's — so it proves instead, with Apple App Attest, that it is
// this app, unmodified, on a real device, and is handed a token of its
// own. Which apps may do that is the one decision left to the operator,
// and it is made here, per app, rather than in an environment variable
// nobody can see from the UI.
//
// The rows are apps, not installs. A thousand devices are a count on the
// app's row and a searchable list on its page; they are never mixed into
// the Tokens tab, where a dozen hand-issued credentials would drown.
//
// `?add` draws the Add app dialog over the list (access-app-add in
// mocks.json), the same way issuing a token opens over the token list.

const addDialog = () => {
  const label = (text) => `<div class="mb-1 text-[12px] text-muted-foreground">${text}</div>`
  const box = (value, placeholder = false, chevron = false) => `
    <div class="relative flex h-8 w-full items-center rounded-md border border-border pl-3 pr-8 font-mono text-xs ${placeholder ? 'text-muted-foreground/50' : ''}">
      ${value}
      ${chevron ? '<i class="ri-arrow-down-s-line pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground"></i>' : ''}
    </div>`
  const hint = (text) => `<p class="mt-1 text-[12px] leading-snug text-muted-foreground">${text}</p>`
  return dialog(
    'Add app',
    `<div class="grid gap-4">
      <div>${label('Name')}${box('Connect')}</div>
      <div>
        ${label('App ID')}
        ${box('5Q94QJ7G98.jp.qleap.connect')}
        ${hint('Team ID and bundle ID, joined by a dot. Only attestations minted for exactly this app are accepted.')}
      </div>
      <div>
        ${label('Plan for new installs')}
        ${box('Free', false, true)}
        ${hint('Every install that registers gets a token on this plan. Change it later on the app’s page; tokens already issued move with the plan, not with this setting.')}
      </div>
      <label class="flex items-start gap-2">
        <span class="mt-0.5 inline-flex size-4 shrink-0 rounded border border-border"></span>
        <span>
          <span class="block text-xs font-medium">Accept development builds</span>
          <span class="block text-[12px] leading-snug text-muted-foreground">Builds run from Xcode attest in Apple’s development environment. Turn this on only while testing — anyone with the project can make one.</span>
        </span>
      </label>
    </div>`,
    `${btn('Cancel', 'ghost')}${btn('Add app', 'primary', 'ri-add-line')}`
  )
}

const adding = new URLSearchParams(location.search).has('add')

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <div class="flex items-center gap-1 border-b border-border px-6">${accessTabs('apps')}</div>

      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <span class="text-[12px] text-muted-foreground">1 app on · 1 off · 1,287 devices</span>
        <div class="ml-auto">${btn('Add app', 'primary', 'ri-add-line', 'access-apps.html?add')}</div>
      </div>

      <div class="px-6 pb-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          An authorized app’s installs get their own token by proving, with Apple App Attest, that they are
          the genuine app on a real device — nobody types a key.
          Registration is <span class="font-mono">POST /v1/app/challenge</span> then
          <span class="font-mono">POST /v1/app/devices</span>.
          <span class="font-medium text-foreground">Turning an app off</span> stops new installs and every
          token it already handed out.
        </div>
      </div>

      ${appTable()}
  </div>
  ${adding ? addDialog() : ''}`

renderShell({
  active: 'access-tokens',
  navMode: 'cloudflare',
  crumbs: [],
  subtitle: 'Apps whose installs register themselves'
})
</script>
</body>
</html>
