<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Subscriptions</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, btn, providerTable } = window.Shell

// Subscriptions: the providers Rialto reaches through someone's plan.
//
// This used to be the top half of an 18rem rail beside a provider's
// detail, which cost the detail 288px it did not have to spare — the
// account emails truncated and the six price columns collapsed to
// dashes. The rail's two headings are now the sidebar's two sub-entries,
// and each is a list in its own right.
//
// Quota is the column this list exists for. A subscription is the only
// provider kind that can stop serving without anyone changing anything,
// and the number that predicts it is per-account usage against the
// window — so it gets a meter and a figure rather than a state pill
// alone.

document.getElementById('root').innerHTML = `
  <div class="min-w-0">
      <!-- No heading: the breadcrumb and the sidebar both say
           "Subscriptions" already. -->
      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <span class="text-[12px] text-muted-foreground">3 accounts across 3 providers · 10 of 16 models enabled</span>
        <!-- Refresh asks upstream now. The quota column is otherwise a
             five-minute-old reading, and the moment an operator looks at
             it is usually the moment they doubt it. It sits beside the
             primary action, after the catalog-wide "Refresh prices" the
             API keys list also carries. -->
        <div class="ml-auto flex items-center gap-2">${btn('Refresh prices', 'ghost', 'ri-price-tag-3-line')}${btn('Refresh', 'ghost', 'ri-refresh-line')}${btn('Add subscription', 'primary', 'ri-add-line', 'providers-connect.html')}</div>
      </div>

      <div class="px-6 pb-4">
        <div class="rounded-md border border-dashed border-border px-4 py-3 text-[12px] leading-relaxed text-muted-foreground">
          <i class="ri-information-line mr-1 align-[-1px]"></i>
          A subscription authenticates with OAuth and serves whatever the plan allows — there is no
          per-request price, which is why these rows carry a quota instead of a cost.
          <span class="font-medium text-foreground">Open a row</span> to manage its accounts and pick
          which models it may serve. Routing skips an account the moment its window is spent, and
          comes back when the window rolls.
        </div>
      </div>

      ${providerTable('subscription')}
  </div>`

renderShell({
  active: 'providers',
  sub: 'subscriptions',
  navMode: 'cloudflare',
  crumbs: [],
  subtitle: 'Providers reached through a plan'
})
</script>
</body>
</html>
