<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The SPA is served for every unmatched path, and vite-plugin-singlefile
      emits every remaining asset reference as a RELATIVE url. Without a
      base, reloading /activity/sessions asks for /activity/manifest.json
      (and /activity/remixicon-*.svg) and gets index.html back with a 200 —
      so the manifest silently fails to parse and the app is not
      installable from any deep link. Rialto always serves from the origin
      root, /api and /v1 included, so pinning the base here is safe.
    -->
    <base href="/" />
    <!-- viewport-fit=cover lets the installed app paint into the notch /
         home-indicator area; the shell pays that back with
         env(safe-area-inset-*) padding (see .safe-area-inset). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rialto</title>

    <!-- PWA. The manifest drives install + display mode; the meta tags
         below are what iOS reads instead of it. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` rather than `black-translucent`: translucent puts white
         status-bar text over the app's own header, which disappears
         against the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rialto" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
