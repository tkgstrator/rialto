services:
  rialto:
    image: ghcr.io/tkgstrator/rialto:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/rialto
      REDIS_URL: redis://redis:6379
      # Optional break-glass key for /api/*. Nothing is generated when it is
      # unset; /v1/* takes the access tokens you issue on the Access tokens
      # page, never this key.
      # APIKEY: change-me
      # Speech (/v1/audio/speech, /v1/audio/voices) is relayed to the TTS
      # server named here, reached by its service name on this network.
      # Unset, those paths answer 503. See docs/guides/tts-relay.md.
      # RIALTO_TTS_URL: http://irodori-tts:8000
      # Decisions screen. Empty means "not configured", so an ordinary
      # `docker compose up` is unchanged. To use the CPU sidecar below, set
      # COMPOSE_PROFILES=decisions and JEFF_URL=http://jeff:8765 in your own
      # environment (.env). See docs/guides/decisions.md.
      JEFF_URL: ${JEFF_URL:-}
      JEFF_SHADOW_ENABLED: ${JEFF_SHADOW_ENABLED:-false}
    ports:
      # The server listens on the envelope PORT (default 3456). Map it to
      # whatever host port you want.
      - "3456:3456"
      # Codex OAuth callback. OpenAI's client whitelists exactly
      # http://localhost:1455/auth/callback, so this one cannot be remapped:
      # the consent page sends the browser to :1455 on the machine the
      # BROWSER runs on. Publishing it makes the sign-in complete by itself
      # when you browse from the Docker host, and binding to the host's own
      # loopback keeps a credential-minting endpoint off the LAN.
      #
      # Drop this line if you reach Rialto from another machine or through a
      # tunnel — the port cannot help there. Sign in via Providers ->
      # Connect and paste the dead redirect URL into the box the wizard
      # shows; the exchange runs server-side from the pasted code.
      - "127.0.0.1:1455:1455"
    volumes:
      # Bind-mount the config envelope so config.json is
      # readable/editable on the host. Adjust the container path to the
      # image user's home if it is not /root.
      #
      # Upgrading from a pre-rename deployment: this used to be
      # `./ccr-config:/root/.claude-code-router`. Rename the host
      # directory once (`mv ccr-config rialto-config`) — the in-container
      # copy from the old home cannot help here, because the old path is
      # only ever a mount point.
      - ./rialto-config:/root/.rialto
      # Claude / Codex subscription credentials, so subscription-mode
      # providers (claude-code, codex) can authenticate. Read-write
      # because the Codex token is refreshed in place. Drop these if you
      # only use api_key providers.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.codex:/root/.codex
    restart: unless-stopped

  # Optional CPU sidecar for the Decisions screen. Off unless the `decisions`
  # profile is enabled, so it is never built or pulled by default, and rialto
  # deliberately does not depend_on it: Decisions simply reads "unavailable"
  # until Jeff is up.
  #
  # Internal only: no `ports`, so nothing is published to the host, and Jeff's
  # own authentication is not enabled (JEFF_API_KEY unset), so rialto sends no
  # key. It is reached as http://jeff:8765 on this Compose network.
  jeff:
    profiles: ["decisions"]
    build:
      context: docker/jeff
    volumes:
      # The checkpoint is downloaded here on first start.
      - jeff_models:/models
    restart: unless-stopped
    healthcheck:
      # Jeff's /health answers status "ready" once the model is loaded.
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import json, sys, urllib.request;
          sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)).get('status') == 'ready' else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      # First start downloads the checkpoint and loads it; allow for both.
      start_period: 600s

  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rialto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rialto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6.3
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  jeff_models: