name: CI

on:
  pull_request:
  push:
    branches: [main, develop, master]

# Every `bun install` reads @qtmleap packages from GitHub Packages, which
# needs a token even to read (bunfig.toml). Dependabot's PRs get it from the
# Dependabot secret of the same name, not this one.
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CLAUDE.md","LICENSE","README.md","docs/architecture/adaptive-reasoning-effort.md","docs/architecture/anthropic-native-classifier.md","docs/architecture/claude-code-model-catalog.md","docs/architecture/decision-routing.md","docs/architecture/inbound-surfaces.md","docs/architecture/model-capabilities.md","docs/architecture/pipeline-overview.md","docs/architecture/request-flow.md","docs/architecture/response-model-identity.md","docs/architecture/routing.md","docs/architecture/testing-map.md","docs/development/ci-change-scope.md","docs/guides/agent-call-detection.md","docs/guides/codex-mcp.md","docs/guides/decisions.md","docs/guides/demo-data.md","docs/guides/migration-v3.md","docs/guides/model-provider-priority.md","docs/guides/permission-routing.md","docs/guides/persona-authoring.md","docs/guides/plans.md","docs/guides/public-deployment.md","docs/guides/pwa.md","docs/guides/tts-relay.md","docs/plan/develop-master-divergence.md","docs/plan/effort-translation.md","docs/plan/quota-and-tier-routing.md","docs/plan/quota-aware-preference-router.md","docs/plan/quota-aware-router-post-phase-4.md","docs/plan/refactor/README.md","docs/plan/refactor/master-plan.md","docs/plan/refactor/phase-1-foundation.md","docs/plan/refactor/phase-2-backend-architecture.md","docs/plan/refactor/phase-3-frontend-structure.md","docs/plan/refactor/phase-4-workspaces-and-quality.md","docs/plan/refactor/phase-5-multi-account-same-plan.md","docs/plan/refactor/phase-6-quota-aware-routing.md","docs/plan/rialto/gemini-code-assist-spike.md","docs/plan/rialto/master-plan.md","docs/plan/router-force-override.md","docs/plan/rules-only-router.md","docs/plan/scenario-tier-routing.md","docs/plan/subscription-utilization-tuning-implementation.md","docs/plan/subscription-utilization-tuning.md","docs/standards/local-secret-files.md","docs/standards/naming-conventions.md"]'
      doc-prefixes: '[]'
      runner: '"ubuntu-latest"'

  commitlint:
    name: Commit Lint
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install commitlint
        run: |
          bun install \
            commitlint@latest \
            @commitlint/config-conventional \
            conventional-changelog-conventionalcommits
      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      # Skip on develop→master release PRs: those promote a long-lived
      # batch of already-validated commits, so re-linting the whole
      # backlog from --from HEAD~commits-count just trips on historical
      # commits that predate the current commitlint rules.
      # Lint base..head, not head~<commit count>..head. `~N` walks first
      # parents only, so once a branch contains a merge (develop merged in to
      # catch up, or a master backmerge) it overshoots into commits develop
      # already has and fails on ones linted, or exempted, long ago.
      - name: Validate PR commits
        if: github.event_name == 'pull_request' && github.base_ref != 'master'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  biome:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/biome check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b --noEmit

  test:
    env:
      GH_TOKEN: '${{ fromJSON((needs[''ci-change-scope''].result != ''success'' || needs[''ci-change-scope''].outputs.docs_only != ''true'') && toJSON(secrets.GH_TOKEN) || ''""'') }}'
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Test
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # __tests__/providers/* are live-API integration tests (need a
      # running Rialto server + provider keys/credentials). RIALTO_SKIP_LIVE_TESTS
      # forces every provider describe to skip regardless of whether keys
      # or ~/.claude / ~/.codex credentials happen to be present, so the
      # whole __tests__ tree runs deterministically: providers skip,
      # preset unit tests pass. This also guards the skipIf wiring itself.
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - run: RIALTO_SKIP_LIVE_TESTS=1 bun test __tests__/

        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  build:
    env:
      GH_TOKEN: '${{ fromJSON((needs[''ci-change-scope''].result != ''success'' || needs[''ci-change-scope''].outputs.docs_only != ''true'') && toJSON(secrets.GH_TOKEN) || ''""'') }}'
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Build
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - run: bun run build

        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
