name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  # GHCR only. The Docker Hub half (tkgling/rialto) was dropped: it needed
  # DOCKER_USERNAME / DOCKER_PASSWORD secrets to publish what GITHUB_TOKEN
  # already publishes for free, and two registries meant two places a tag
  # could silently go missing. Images through v2.78.4 remain on Docker Hub
  # for anyone pinned there; nothing new lands.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

      # No BuildKit cache on purpose. GitHub Actions Cache is scoped per ref,
      # so a `refs/tags/vX.Y.Z` build can read neither the previous tag's cache
      # nor develop's: measured on v2.77.1, the import produced 0 CACHED steps
      # while `cache-to: mode=max` spent 691s of the 843s build writing a cache
      # no later run can read. The build itself is ~150s; the cache was the job.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
