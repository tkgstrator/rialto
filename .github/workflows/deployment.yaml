name: Deployment (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# The develop channel never reached GHCR before — this workflow pushed
# only to Docker Hub, so `ghcr.io/tkgstrator/rialto:develop` 404'd while
# the release tags were on both. It publishes to GHCR now, like
# docker-publish.yml.
#
# Only the latest develop push publishes the moving :develop tag.
# Older overlapping runs are cancelled so they cannot race and
# overwrite :develop with an older commit on completion.
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # packages:write is what GHCR needs: the login below authenticates as
    # GITHUB_TOKEN rather than a Docker Hub username/password pair, so the
    # token has to carry the scope. actions:write went away with the
    # BuildKit cache below.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short

      # No BuildKit cache — see docker-publish.yml. Warm develop scope still
      # only landed 2 CACHED layers while spending 152s exporting the cache,
      # so it cost more than it saved here too.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
