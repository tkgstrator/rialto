name: Deployment (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Only the latest develop push publishes the moving :develop tag.
# Older overlapping runs are cancelled so they cannot race and
# overwrite :develop with an older commit on completion.
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: tkgling/rialto

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # contents:read for checkout is all this needs. Docker Hub login uses
    # username/password secrets, so packages:write and id-token:write are not
    # required, and actions:write went away with the BuildKit cache below.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short

      # No BuildKit cache — see docker-publish.yml. Warm develop scope still
      # only landed 2 CACHED layers while spending 152s exporting the cache,
      # so it cost more than it saved here too.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
