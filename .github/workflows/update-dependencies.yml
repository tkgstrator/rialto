name: Update Dependencies

on:
  schedule:
    # Every Monday at 09:00 UTC (18:00 JST).
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun update --latest` follows each package's `latest` dist-tag, not
      # the semver range in package.json. That is the point of the job, and
      # also how it broke: npm has had Prisma's `latest` pointing at an
      # 8.0.0 release candidate, whose CLI no longer registers `generate`.
      # The repo's `postinstall: prisma generate` then exited 2, the step
      # failed, and every step after it was skipped — so this workflow has
      # produced no dependency PR since 2026-08-31.
      #
      # Prisma is held back rather than the job weakened: 7 -> 8 is a major
      # move that wants a deliberate migration, and silencing postinstall
      # would only hide a missing client until a later job failed on it.
      # Everything else still tracks `latest`.
      - name: Update dependencies
        # @qtmleap packages come from GitHub Packages (bunfig.toml).
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          held='["prisma","@prisma/client","@prisma/adapter-pg"]'
          names=$(jq -r --argjson held "$held" '
            (.dependencies // {}) + (.devDependencies // {})
            | keys[] | select(IN($held[]) | not)
          ' package.json)
          bun update --latest $names

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR opened with GITHUB_TOKEN does not start any workflow —
      # GitHub suppresses those events so an action cannot trigger itself
      # in a loop. develop requires five checks (Biome Check, Build,
      # Commit Lint, Test, Type Check), so the PR this step opens arrives
      # with none of them and sits at BLOCKED, unmergeable, until someone
      # reopens it by hand to make the events come from a person.
      #
      # `DEPS_PR_TOKEN` fixes that: a PAT (or GitHub App token) with
      # `repo` scope opens the PR as its owner, and the checks run. The
      # fallback keeps the job working without one — the PR still gets
      # created, it just needs a manual close/reopen before it can merge.
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEPS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "chore: weekly dependency update"
          body: |
            ## Summary

            Automated weekly dependency update via `bun update --latest`.

            Prisma (`prisma`, `@prisma/client`, `@prisma/adapter-pg`) is
            held back — its `latest` dist-tag points at an 8.0.0 release
            candidate whose CLI drops `generate`, which breaks
            `postinstall`. Move it by hand when 8 is ready.

            ---
            *This PR was created automatically by the Update Dependencies workflow.*
            *If no checks are present, it was opened with `GITHUB_TOKEN` —*
            *close and reopen it to run them, or add a `DEPS_PR_TOKEN` secret.*
          branch: chore/update-dependencies
          delete-branch: true
          labels: |
            dependencies
            automated
