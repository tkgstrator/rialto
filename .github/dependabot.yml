version: 2

# @qtmleap packages (the Mock Diff Viewer's Vite plugin) live on GitHub
# Packages, which needs a token even to read. GH_TOKEN here is the
# Dependabot secret, which is separate from the Actions secret of the same
# name.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GH_TOKEN }}

updates:
  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # JavaScript/TypeScript dependencies (package.json)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
